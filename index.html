function PsShell({filmId, title, line, children}){
  const nav = useNav();
  const ar  = psAr(filmId);
  const scroller = useRef(null);
  const scrim    = useRef(null);
  const vid      = useRef(null);
  const stage    = useRef(null);
  const sraf     = useRef(0);
  const [deep,setDeep] = useState(false);
  const sync = ()=>{
    sraf.current = 0;
    const s = scroller.current, k = scrim.current, v = vid.current, g = stage.current;
    if(!s) return;
    const t = s.scrollTop;
    if(k) k.style.opacity =
      Math.max(0, Math.min(1, (t - PS_SCRIM_IN) / (PS_SCRIM_OUT - PS_SCRIM_IN)));
    /* the film covers what is left of the stage, times a zoom that eases out
       over the first 200px — see PS_ZOOM. Width floors at the stage's own, so
       once cover would make the film narrower than the screen it simply crops. */
    if(v && g){
      const vis = Math.max(0, PS_STAGE - t);
      const z   = 1 + PS_ZOOM * Math.max(0, Math.min(1, 1 - t / PS_ZOOM_END));
      v.style.width = Math.max(g.clientWidth, vis * ar * z).toFixed(1) + "px";
    }
    setDeep(t > PS_TALK_MAX);      // the film has left the bubble's own box
  };
  const onScroll = ()=>{
    if(!sraf.current) sraf.current = requestAnimationFrame(sync);
  };
  useEffect(()=>{
    sync();
    return ()=>{ if(sraf.current) cancelAnimationFrame(sraf.current); };
  },[]);

  return <div className="psscreen">

    {/* 1 — the scroller: the film, its resolve, and the sections, in that order */}
    <div className="psscroll" ref={scroller} onScroll={onScroll}>
      <div className="psstage" ref={stage}>
        <video className="psvid" key={filmId} ref={vid} src={psFilm(filmId)}
          muted loop autoPlay playsInline preload="auto"
          style={{width:psVidW0(ar).toFixed(1)+"px", aspectRatio:String(ar)}}/>
      </div>
      <div className="psfade"/>
      <div className="pscontent">{children}</div>
    </div>

    {/* 2 — the scrim: nothing at rest, solid once the content is under the title */}
    <div className="psscrim" ref={scrim} aria-hidden="true"/>

    {/* 3 — the pinned nav, and the plant's reaction bubble beside it */}
    <div className="pshead">
      <div className="plhead">
        <span className="plback" onClick={nav.back} title="Back"><IconChevronLeft/></span>
        {/* titleless is a real state — the flow's character step drops the line
            and keeps the chevron. .plhead's min-height holds the 52px the title
            used to give it, so the chevron does not climb the screen. */}
        {title && <h1 className="pltitle">{title}</h1>}
      </div>
    </div>
    <div className={"psbub"+(deep?" off":"")}
      style={{backgroundImage:blobBg("speech","#FFFFFF")}}>
      {line}
    </div>
  </div>;
}

function PlantSettings({params}){

  const [tune,setTune]       = useState(personaByName(p.persona).defaults);

  /* the window itself lives on the plant now, written by the Customise screen
     and re-read here on every mount — the same round trip Auto-watering makes */
  const q = quietOf(p);
  const first = name.split(" ")[0] || "they";

  /* ── the reaction bubble ──────────────────────────────────────────────────
     It used to be a PREVIEW that only surfaced while the character was being
     shaped and hid itself 2.6s later. That is gone: it is simply the plant now,
     on screen the whole time the plant is. sampleLine() still builds the line
     from these very slider values, so it stays live — it answers each change
     instead of appearing for each change.

     ONE gate survives, and it is not the one that was removed: the bubble still
     withdraws once the film has scrolled out from under it (PS_TALK_MAX). The
     brief names "the personality-editing-only show/hide logic" as the thing to

            The pencil is a real affordance: tapping the row (or the pencil)

        <div className="pssec">

/* ───────────────── ADD NEW PLANT (465:312) ─────────────────
   The section draws five frames and they are all one shape — chevron, centred
   serif line, optional muted line, actions — so they are one component with a
   state machine, not five. `ApStep` is that shape; every screen in the flow is
   an instance of it, including the four the mockups stop short of.

   THE FINAL SCREEN LIST (the mockups' own logic first, the brief's list
   second — see DECISIONS):
     pair      the five mocked frames: idle → searching → found → connecting →
               paired, one component
     capture   point-and-shoot, then "Reading your photo…" — the same
               action → progress → result rhythm the pairing screen already has
     identify  the photo read back as a species, to confirm or override
     species   the manual pick, if the read was wrong
     create    name, personality, voice
     meeting   the first greeting, in the plant's own bubble → Dashboard

   Gone with the rebuild: `matches` (three ranked guesses) and `speciesDetail`
   (a carousel, an identification table and look-alikes). They are a species
   encyclopedia hung off a pairing flow, and nothing in these mockups has more
   than one idea on a screen. The manual list survives as the escape hatch. */

const AP_FILM     = "assets/video/bt.mp4";
const AP_CAM_FILM = "assets/video/add-plant.mp4";
/* The photo the recogniser "took" — add-plant.mp4's own last frame, exported
   once rather than held on a live <video> seeked to its end. A still is what
   the result screen actually shows, it survives the screen change with no
   playback state to carry across, and it cannot end up a frame off the one the
   shutter froze. 72KB against a video element. */
const AP_PHOTO    = "assets/photo-addplant.webp";
/* whose settings film the character step opens on — Felix, the app's reference
   pot, because the plant being set up has none of its own yet */
const AP_CREATE_FILM = "felix";

/* the ellipsis that shows something is happening — see .apdots */
const Dots = ()=> <span className="apdots"><i>.</i><i>.</i><i>.</i></span>;

/* What the recogniser returns in this prototype, and the plant whose render,
   avatar and film stand in for each species. A new plant has no art of its own,
   so it wears the art the app already has for what it is. */
const AP_SPECIES = "Ficus";
const LOOK_BY_SPECIES = { Ficus:"felix", Cannabis:"mary", Cactus:"gosha",
                          Aloe:"vera", Bonsai:"vlad" };
const lookFor = (species)=> LOOK_BY_SPECIES[species] || "felix";

function ApStep({onBack, film, filmRef, filmProps, filmUp, title, sub, children, actions, inflow}){
  return <div className="apscreen">
    <div className="apbg" aria-hidden="true">
      {film && <video className={"apvid"+(filmUp?" up40":"")} key={film} ref={filmRef} src={film}
        muted playsInline preload="auto" {...(filmProps || {loop:true, autoPlay:true})}/>}
    </div>
    <div className="aphead">
      {onBack && <span className="plback" onClick={onBack} title="Back">
        <IconChevronLeft/></span>}
    </div>
    <h1 className="aptitle">{title}</h1>
    {sub && <p className="apsub">{sub}</p>}
    {children}
    {actions && <div className={"apacts"+(inflow?" inflow":"")}>{actions}</div>}
  </div>;
}

/* Step 1 — pairing, the five mocked frames.
   The film (bt.mp4, the pot with its Bluetooth LED breathing) appears exactly
   where the mockups put the pot: on found, connecting and paired, and not on
   the two frames that have nothing to show yet.

   AND IT IS NOW THE CONNECTING ANIMATION, not decoration. It holds on its first
   frame while the pot is merely found, plays once — no loop — when Connect is
   pressed, and its `ended` is what advances the screen to "paired and online",
   where it stays frozen on its last frame. So the wait is the pot's own 5s of
   LED rather than a timer that happens to run beside a loop, and there is one
   fewer number in this component than there was.

   "Connecting" still gets its own frame, which the brief does not require and
   465:286 does draw: the text has to say something true while those 5 seconds
   run, and the mockup already decided what.

   Back inside the machine returns to idle rather than leaving the flow — the
   chevron is drawn on every frame, and on four of them the thing behind you is
   the previous state, not the previous screen. */
function PairDevice(){
  const nav = useNav();
  const [st,setSt] = useState("idle");   // idle → searching → found → connecting → done
  const btV = useRef(null);
  // a second run through the flow must not inherit the first run's answers
  useEffect(()=>{ for(const k in AP_DRAFT) delete AP_DRAFT[k]; },[]);
  useEffect(()=>{
    let t;
    if(st==="searching") t=setTimeout(()=>setSt("found"),1700);
    return ()=>clearTimeout(t);
  },[st]);
  const back = ()=>{
    const v = btV.current;
    if(v){ v.pause(); v.currentTime = 0; }
    return st==="idle" ? nav.back() : setSt("idle");
  };
  const connect = ()=>{
    setSt("connecting");
    const v = btV.current;
    if(v){ v.currentTime = 0; const q = v.play(); if(q && q.catch) q.catch(()=>{}); }
  };
  /* one element across all three film frames — same src, same key — so pressing
     Connect on "found" plays the very film that is already showing its first
     frame, and "paired" is that same film left where it stopped. */
  const filmProps = { loop:false, onEnded:()=>setSt("done") };
  const film = (st==="found"||st==="connecting"||st==="done") ? AP_FILM : null;

  if(st==="idle") return <ApStep onBack={back}
    title={"Pair your pot & meet your new plant"}
    sub="Switch the pot on and keep your phone close — we'll find it over Bluetooth and introduce you properly."
    inflow
    actions={<button className="actbtn" onClick={()=>setSt("searching")}>Start searching</button>}/>;

  if(st==="searching") return <ApStep onBack={back}
    title={<>Searching for devices<Dots/></>}/>;

  if(st==="found") return <ApStep onBack={back} film={film} filmRef={btV} filmProps={filmProps} filmUp
    title="Pot found nearby"
    actions={<>
      <button className="actbtn" onClick={connect}>Connect</button>
      <button className="actbtn ghost" onClick={()=>setSt("searching")}>Search again</button>
    </>}/>;

  if(st==="connecting") return <ApStep onBack={back} film={film} filmRef={btV} filmProps={filmProps} filmUp
    title={<>Connecting<Dots/></>}/>;

  return <ApStep onBack={back} film={film} filmRef={btV} filmProps={filmProps} filmUp
    title="Your pot is paired and online"
    actions={<button className="actbtn"
      onClick={()=>nav.go("capture")}>Take a photo of your plant</button>}/>;
}

/* Step 2 — the camera (417:1591). A full-bleed viewfinder and a shutter, and
   nothing else: the mockup draws no chrome, and the only thing added back is
   the chevron, because a flow you cannot back out of is not a flow.

   The shutter does three things in one gesture — stops the loop, freezes the
   film on its LAST frame, and raises the recogniser over it — so the frozen
   frame IS the photograph, and the still the next screen shows is that same
   frame exported. Nothing is captured at runtime and nothing can drift. */
function CapturePhoto(){
  const nav = useNav();
  const [st,setSt] = useState("live");   // live → reading → (push) identify
  const camV = useRef(null);
  useEffect(()=>{
    let t;
    if(st==="reading") t=setTimeout(()=>nav.go("identify"),1800);
    return ()=>clearTimeout(t);
  },[st]);

  const shoot = ()=>{
    const v = camV.current;
    if(v){
      v.loop = false;                       // or the freeze would wrap to 0
      v.pause();
      if(v.duration) v.currentTime = Math.max(0, v.duration - 0.04);
    }
    setSt("reading");
  };

  return <div className="camscreen">
    <div className="cambg" aria-hidden="true">
      <video className="camvid" ref={camV} src={AP_CAM_FILM}
        muted loop autoPlay playsInline preload="auto"/>
    </div>
    <span className="camback" onClick={nav.back} title="Back"><IconChevronLeft/></span>
    {st==="live"
      ? <button className="camshutter" onClick={shoot} aria-label="Take the photo"/>
      : <div className="camwait"><i/><span>Recognising your plant<Dots/></span></div>}
  </div>;
}

/* Step 3 — the read, handed back as one species to confirm or override. */
function IdentifyPlant({params}){
  const nav = useNav();
  const species = (params&&params.species)||AP_SPECIES;
  /* The photo the shutter froze, not a render of the species: the screen is
     showing you back what it just looked at, and the two must be the same
     picture. It only has one for the plant it recognises by default — a manual
     override lands on `create` directly, so the mismatch never appears. */
  return <ApStep onBack={nav.back} title={"Looks like it's a "+species}
    actions={<>
      <button className="actbtn" onClick={()=>nav.go("create",{species})}>Yes, that's my plant</button>
      <button className="actbtn ghost" onClick={()=>nav.go("species")}>Choose the species myself</button>
    </>}>
    <div className="apshot photo"><img src={AP_PHOTO} alt=""/></div>
  </ApStep>;
}

/* Step 4 — the character, on the Personality & Settings screen itself.
   Not "the same design": the same shell (<PsShell> — film, resolve, scrim,
   pinned nav, bubble) around the same <PersonalitySection>. What you set up on
   day one is the screen you will edit it on, down to the pot breathing behind
   the chips and the line coming off it as you move a slider.

   THE FILM IS FELIX'S, by instruction: this plant has no footage of its own and
   the flow has not yet decided whose it borrows, so it opens on the app's
   reference pot. It routes through psFilm()/filmId(), so the standing fallback
   still applies if the file ever goes missing.

   WHICH SECTIONS SURVIVE, and this is the call:
     Personality  in full — chips, scroll-to-selected, sliders.
     General      TRIMMED to name + voice. Dropping it whole would leave the
                  flow with no way to name the plant, and the next screen greets
                  it by name and the app files it under one. The species row IS
                  dropped: the screen before this one just decided it.
     Activity     in full, as of rev 34 — the same <ActivitySection>, on a draft
                  window (AP_QUIET) that the new plant inherits when the flow
                  finishes. Rev 33 dropped it on the reasoning that quiet hours
                  are about living with a plant you already have; reversed,
                  because the brief asks for it and because setting the hours
                  before the first evening is a perfectly sensible thing to want.
   There is no title: the chevron alone tops the screen. */
function CreateCharacter({params}){
  const nav = useNav();
  const species = (params&&params.species)||AP_SPECIES;
  const preset0 = AP_DRAFT.persona || PERSONALITIES.presets[0].k;
  const [name,setName]       = useState(AP_DRAFT.name || "");
  const [editing,setEditing] = useState(false);
  const [preset,setPreset]   = useState(preset0);
  const [tune,setTune]       = useState(AP_DRAFT.tune || personaByName(preset0).defaults);
  const [voice,setVoice]     = useState(AP_DRAFT.voice || PS_VOICES[2]);
  /* every change writes through to the draft, so the trip out to "Customise"
     and back finds the screen exactly as it was left */
  const rename = (v)=>{ AP_DRAFT.name = v; setName(v); };
  const pick   = (k)=>{ const d = personaByName(k).defaults;
                        AP_DRAFT.persona = k; AP_DRAFT.tune = d;
                        setPreset(k); setTune(d); };
  const slide  = (key,v)=>setTune(t=>{ const n = {...t,[key]:v}; AP_DRAFT.tune = n; return n; });
  const setV   = (v)=>{ AP_DRAFT.voice = v; setVoice(v); };
  const commit = ()=>setEditing(false);
  const finalName = name.trim() || species;

  return <PsShell filmId={AP_CREATE_FILM} line={sampleLine(preset,tune)}>

    <PersonalitySection preset={preset} tune={tune} onPick={pick} onSlide={slide}/>

    {/* the settings screen's General row and voice grid, less the species it
        has already been told */}
    <div className="pssec">
      <h2 className="pssech">General</h2>
      <div className="psfield" onClick={()=>setEditing(true)}>
        {editing
          ? <input autoFocus value={name} onChange={e=>rename(e.target.value)}
              onBlur={commit} onKeyDown={e=>e.key==="Enter"&&commit()}/>
          : <b style={name?null:{opacity:.4}}>{name || "Your "+species.toLowerCase()}</b>}
        <span className="psedit"><IconEdit/></span>
      </div>
      <div className="psvoice">
        {PS_VOICES.map(v=>(
          <div key={v} className={"psvopt"+(voice===v?" on":"")}
            onClick={()=>setV(v)}>{v}</div>
        ))}
      </div>
    </div>

    {/* the settings screen's Activity section, on the flow's own draft window */}
    <ActivitySection first={finalName.split(" ")[0]} window={quietOf(AP_DRAFT)}
      onCustomise={()=>nav.go("quietConfig",{id:"draft"})}/>

    <div className="apacts" style={{marginTop:"40px"}}>
      <button className="actbtn"
        onClick={()=>nav.go("meeting",{name:finalName,species,preset,voice})}>Say hello</button>
    </div>
  </PsShell>;
}

/* The flow ends by actually adding the plant. PLANTS and CHAT_INIT are this
   prototype's whole store, and a "done" screen that changed nothing would teach
   the wrong thing about the flow — so the new plant is on the dashboard, in the
   chat and in My Plants the moment you land. `look` is the borrowed visual
   identity: no render, no avatar and no film of its own, so it wears the ones
   the app already has for its species. */
const addNewPlant = ({name, species, preset, voice})=>{
  if(PLANTS.some(x=>x.id==="new")) return;
  const persona = personaByName(preset);
  PLANTS.push({
    id:"new", look:lookFor(species), name, species, persona:preset, voice,
    emotion:persona.faces.base, growth:4, lastWatered:"Just now", light:"Good",
    reservoir:100, autoOn:true, schedule:"Every 2 days", amount:"Medium",
    bondLevel:1, bondPct:6, bondTitle:"Just met",
    quietFrom:AP_DRAFT.quietFrom, quietTo:AP_DRAFT.quietTo,
    checkin:persona.lines.base, reaction:persona.lines.warm,
    diaryNote:"Day one. New pot, new window, new person.",
  });
  CHAT_INIT.push({ who:"new", at:"now", text:persona.lines.big });
};

/* Pot renders — the five square 1024px sources from the mockup (364:1073/1075/
   1077/1097 and 415:1423), re-exported at 768px. Nothing is measured by hand
   here: `win` is each image frame's own box and `img` is the source's offset
   inside that frame, both read off Figma node 364:1065 and re-expressed against
   the card's TOP-RIGHT corner instead of the artboard's top-left. Anchoring on
   the right is what lets the 402px mockup land unchanged in a 386px device —
   every pot keeps its exact distance from the card edge, and the 16px difference
   is absorbed by the empty gap between the text column and the pot.
     mockup (card top / card right edge)      -> card-relative
     felix  frame 185,135 258x218  card 135/397   win right -46, top   0  img 258 @   0,-40
     mary   frame 135,275 262x215  card 275/397   win right   0, top   0  img 358 @   0,-143
     gosha  frame 248,411 140x187  card 415/397   win right   9, top  -4  img 308 @ -88,-80
     vera   frame 173,555 224x227  card 555/397   win right   0, top   0  img 282 @   0,-79
     vlad   frame 184,651 267x267  card 695/397   win right -54, top -44  img 267 @   0,0
   Vera's frame now starts exactly on her card's top-left, so her render is fully
   clipped by the card like Felix/Mary/Gosha. Vlad is the one that breaks out —
   his frame starts 44px ABOVE his card and runs 54px past its right edge, and he
   is the last card, which is what .plcard:last-child{overflow:visible} unlocks. */
const SHOT = {
  felix:{ src:"assets/pot-felix.webp",  win:{w:258,h:218,right:-46,top:  0},
                                        img:{s:258,left:    0,top:-40  } },
  mary: { src:"assets/pot-mary.webp",   win:{w:262,h:215,right:  0,top:  0},
                                        img:{s:358,left:    0,top:-143 } },
  gosha:{ src:"assets/pot-gosha.webp",  win:{w:140,h:187,right:  9,top: -4},
                                        img:{s:308,left:-88.2,top:-80.2} },
  vera: { src:"assets/pot-vera.webp",   win:{w:224,h:227,right:  0,top:  0},
                                        img:{s:282,left: -0.1,top:-78.9} },
  vlad: { src:"assets/pot-vlad.webp",   win:{w:267,h:267,right:-54,top:-44},
                                        img:{s:267,left:    0,top:  0  } },
};
function PotShot({who}){
  const p = SHOT[who];
  if(!p) return null;
  const {win:w, img:i} = p;
  return <span className="plwin"
    style={{width:w.w, height:w.h, right:w.right, top:w.top}}>
    <img src={p.src} alt=""
      style={{width:i.s, height:i.s, left:i.left, top:i.top}}/>
  </span>;
}

/* ───────────────── APP STATE + ROUTER ───────────────── */
const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

const SCREENS = {
  dashboard:Dashboard, notifs:Notifications, profile:Profile, langPick:LangPick,
  plantsList:PlantsList,
  plant:PlantDetail, waterConfig:WaterConfig, quietConfig:QuietConfig,
  plantSettings:PlantSettings,
  alert:Alert, diagnosis:Diagnosis, alertDone:AlertDone,
  pair:PairDevice, capture:CapturePhoto, identify:IdentifyPlant,
  species:SpeciesList, create:CreateCharacter, meeting:FirstMeeting,
};

/* Flow index — prototype-shell shortcut panel. Lives OUTSIDE the device.
   One entry per flow; `path` is the screen stack the shortcut builds, so an entry
   can land deep in a flow with Back still working. */
const FLOWS = [
  { label:"Add new plant",      path:[["pair"]] },
  { label:"Dashboard",          path:[["dashboard"]] },   // = hero + Windowsill chat
  { label:"Notifications",      path:[["notifs"]] },
  { label:"Plant card",         path:[["plant",{id:"vlad"}]] },   // Vlad: the films are his
  /* "Alert simulation" is out of the index, not out of the app: the screens and
     the route stay, and Notifications' urgent row is still the way in. It came
     off the list because the chat no longer offers a second door to it. */
  { label:"Profile & settings", path:[["profile"]] },
];
function FlowIndex({cur}){
  const nav = useNav();
  return <aside className="flowindex">
    {FLOWS.map(({label,path})=>{
      const dest = path[path.length-1][0];
      return <div key={label}
        className={"fi-link"+(cur.screen===dest?" on":"")}
        onClick={()=>nav.jump(path)}>{label}</div>;
    })}
  </aside>;
}

function App(){
  const [stack,setStack] = useState([{screen:"dashboard",params:{}}]);
  const [chatCross,setChatCross] = useState(true);
  const [freq,setFreq]           = useState("Moderate");
  const [uiLang,setUiLang]       = useState("English");
  const [convLang,setConvLang]   = useState("English");

  const cur = stack[stack.length-1];
  const nav = useMemo(()=>({
    go:(screen,params={})=> setStack(s=> screen==="dashboard"
      ? [{screen:"dashboard",params}]         // dashboard is the root — reset the stack
      : [...s,{screen,params}]),
    back:()=>setStack(s=>s.length>1?s.slice(0,-1):s),
    // pop back to a named screen — used by "keep looking" after hopping through
    // several look-alike species; falls back to a single step if it isn't in the stack
    backTo:(screen)=>setStack(s=>{
      const i = s.map(x=>x.screen).lastIndexOf(screen);
      return i>=0 ? s.slice(0,i+1) : (s.length>1?s.slice(0,-1):s);
    }),
    // replace the whole stack — lets the flow index land deep in a flow with Back intact
    jump:(path)=> setStack(path.map(([screen,params])=>({screen,params:params||{}}))),
  }),[]);

  const Screen = SCREENS[cur.screen] || Dashboard;

  return (
    <AppCtx.Provider value={{chatCross,setChatCross,freq,setFreq,
      uiLang,setUiLang,convLang,setConvLang}}>
    <Nav.Provider value={nav}>
      <div className="phone">
        <div className="device">
          <div className="island"/>
          <StatusBar/>
          <Screen params={cur.params} key={cur.screen+stack.length}/>
        </div>
      </div>
      <FlowIndex cur={cur}/>
    </Nav.Provider>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- Bootstrap: manual Babel transform, classic runtime, no ES modules -->
<script>
(function () {
  function fail(msg) {
    document.getElementById("root").innerHTML =
      '<div style="max-width:360px;margin:80px auto;font-family:\'Circular Std\',sans-serif;color:#333;text-align:center">'
      + '<h2>Could not start the prototype</h2><p style="color:#777">' + msg + '</p></div>';
  }
  if (!window.React || !window.ReactDOM || !window.Babel) {
    return fail("React / Babel failed to load from the CDN. An internet connection is needed the first time you open this file.");
  }
  try {
    var src = document.getElementById("app-src").textContent;
    // classic runtime => React.createElement, never `import {jsx} from 'react/jsx-runtime'`
    var out = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]]
    }).code;
    (0, eval)(out); // indirect eval => run in global scope
  } catch (e) {
    fail(String(e && e.message || e));
    throw e;
  }
})();
</script>
