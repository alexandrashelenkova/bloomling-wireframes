<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>[APP NAME] — wireframe</title>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  /* ── TYPEFACES ───────────────────────────────────────────────────────────
     Circular Std  → every piece of UI text (body 400, labels/names/buttons 500).
     Riccione Serial Light → DISPLAY HEADLINES ONLY (dashboard hero, moment
     screens). Never for UI text. Files are local; no webfont CDN. */
  @font-face{font-family:'Circular Std';src:url('fonts/CircularStd-Book.woff2') format('woff2');
    font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Circular Std';src:url('fonts/CircularStd-Medium.woff2') format('woff2');
    font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:'Circular Std';src:url('fonts/CircularStd-Bold.woff2') format('woff2');
    font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:'Riccione';src:url('fonts/Riccione-Serial-Light%20Regular.ttf') format('truetype');
    font-weight:400;font-style:normal;font-display:swap}

  :root{
    /* ── COLOUR — extracted from Figma "concept2" frames (see DECISIONS.md) ── */
    --bg:#EDEEE9;            /* milky off-white page                  (343:6)   */
    --bg2:#EFEFEF;           /* chat sheet / scrim                    (345:213) */
    --sage:#C9D6BC;          /* header pill + expanded hero flood     (343:60)  */
    --sage-deep:#6E845C;     /* DERIVED: readable sage for accents/active states */
    --accent:#6E845C;
    --ink:#050505;           /* body text                             (344:97)  */
    --serif-ink:#1E0C00;     /* display headline                      (344:125) */
    --icon:#1F1F1F;          /* icon strokes                          (mic/bell)*/
    --mut:rgba(5,5,5,.45);   /* timestamps / secondary — Figma 40% black        */
    --line:rgba(5,5,5,.12);
    --line2:rgba(5,5,5,.08); /* hairline divider — Figma black @10%   (350:235) */
    --card:#FFFFFF;
    --box:#E1E2DB;           /* DERIVED: warm neutral fill (tracks, tags)       */
    --input:#FFFAFA;         /* composer pill                         (344:74)  */
    --ava:#D9D9D9;           /* avatar placeholder                    (344:92)  */
    /* character-coded bubbles */
    --c-margo:#BCCAD7;       /* muted blue-grey        (Ellipse 19 fill) */
    --c-felix:#E3D2CA;       /* dusty terracotta       (Ellipse 20 fill) */
    --c-gosha:#E0D3B8;       /* DERIVED: warm sand/ochre — third tone     */
    --c-vera:#CBD5C9;        /* DERIVED: soft sage-grey                   */
    --c-basil:#D3D0DC;       /* DERIVED: muted lavender-grey              */
    --c-me:#FFFFFF;          /* user messages          (Ellipse 21 fill) */
    /* plants-overview card fills — two-stop gradients from the mockup (364:585),
       each running from the character's tint into that pot's glow colour */
    --g-felix:linear-gradient(126.35deg,#E7D1C9 38.007%,#E2F7CF 115.19%);
    --g-margo:linear-gradient(126.35deg,#B9CBD8 38.007%,#E39B84 115.19%);
    --g-gosha:linear-gradient(126.35deg,#D6D0BA 38.007%,#C3F5EE 115.19%);
    --g-vera:linear-gradient(113.89deg,#C9D5C8 38.007%,#E7FCD6 115.19%);
    --g-basil:linear-gradient(126.35deg,#D3D0DC 38.007%,#F0E6FA 115.19%);

    /* ── TYPE SCALE — LOCKED to the two Figma frames. Four sizes, no others. ── */
    --t-sm:13px;             /* names, timestamps, labels, meta   (344:95)  */
    --t-md:16px;             /* body, buttons, inputs             (344:97)  */
    --t-lg:22px;             /* display headline, collapsed       (344:125) */
    --t-xl:44.7px;           /* display headline, expanded        (345:215) */

    /* ── RADII ── */
    --r-pill:36px;           /* header pill            (343:60)  */
    --r-input:37px;          /* composer pill 36.932px (344:74)  */
    --r-btn:28px;            /* white pill button      (345:216) */
    --r-sheet:36px;          /* chat sheet top corners (345:213) */
    --r-card:24px;           /* DERIVED: cards on restyled screens */

    /* ── MOTION ── gentle ease-out-back for the hero (gets there fast, settles
       with a 2% overshoot); plain soft ease-out for everything reversing out. */
    --spring:cubic-bezier(.16,.84,.28,1.02);
    --soft:cubic-bezier(.22,1,.36,1);
    /* Organic blob bubble: four different large radii, tight corner by the avatar.
       Derived from the Ellipse 19/20/21 vectors (near-half-height corners). */
    --bub:10px 56px 44px 64px / 10px 44px 60px 52px;
    --bub-me:56px 10px 64px 44px / 44px 10px 52px 60px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#262521;
    font-family:'Circular Std',-apple-system,sans-serif;
    color:var(--ink)}
  /* form controls don't inherit type by default — route them to Circular too */
  input,button,textarea,select{font-family:inherit}
  /* Shell canvas: center the phone both axes. `safe center` falls back to
     top-alignment when the viewport is shorter than the phone, so it never
     clips out of reach — the page just scrolls. */
  #root{display:flex;justify-content:center;align-items:safe center;
    min-height:100vh;padding:24px 12px;box-sizing:border-box}

  /* phone frame — simplified iPhone mockup: dark body + bezel, dynamic island,
     status bar. This is prototype-shell chrome, NOT wireframe app UI. */
  .phone{width:412px;max-width:100%;height:844px;background:#0c0c0c;
    border-radius:56px;padding:13px;position:relative;display:flex;flex:0 0 auto}
  .device{flex:1;background:var(--bg);border-radius:44px;overflow:hidden;
    position:relative;display:flex;flex-direction:column;
    transition:background .46s cubic-bezier(.22,.9,.28,1)}
  .device:has(.dash.open){background:var(--sage)}
  /* dynamic island */
  .island{position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:112px;height:31px;background:#000;border-radius:16px;z-index:60}
  /* status bar — constant device chrome, solid ink (never dashed/wireframe) */
  .statusbar{flex:0 0 auto;height:48px;display:flex;align-items:center;
    justify-content:space-between;padding:0 26px;color:var(--ink);
    position:relative;z-index:40}
  .sb-time{font-size:var(--t-sm);font-weight:500;letter-spacing:.02em}
  .sb-right{display:flex;align-items:center;gap:6px}
  .sb-right svg{display:block}
  .screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 16px 24px;
    display:flex;flex-direction:column;gap:14px}
  .screen::-webkit-scrollbar{width:0}

  /* header */
  .topbar{display:flex;align-items:center;gap:10px;min-height:32px}
  .topbar h1{font-size:var(--t-lg);margin:0;font-weight:500;flex:1;letter-spacing:-.01em}
  .back{border:none;background:var(--card);border-radius:999px;
    padding:8px 14px;font-size:var(--t-sm);cursor:pointer;color:var(--ink)}
  .back:active{background:var(--box)}
  .kicker{font-size:var(--t-sm);letter-spacing:.04em;
    color:var(--mut);font-weight:500}

  /* [APP NAME] placeholder chip — name is undecided */
  .brand{display:inline-block;font-size:var(--t-sm);font-weight:500;letter-spacing:.04em;
    color:var(--mut);background:var(--box);
    border-radius:999px;padding:2px 9px}

  /* generic */
  .muted{color:var(--mut)}
  .center{text-align:center}
  .row{display:flex;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .grow{flex:1}
  h2{font-size:var(--t-md);margin:0 0 2px;font-weight:500}
  p{margin:0;line-height:1.4;font-size:var(--t-md)}
  small{font-size:var(--t-sm)}
  b,strong{font-weight:500}
  /* DISPLAY headline — the only place Riccione is allowed outside the dashboard:
     centred hero titles on the "moment" screens (first meeting, alert, thank-you). */
  .display{font-family:'Riccione',Georgia,serif;font-weight:400;color:var(--serif-ink);
    letter-spacing:0}

  .card{background:var(--card);border:none;border-radius:var(--r-card);
    padding:16px}
  .card.tap{cursor:pointer}
  .card.tap:active{background:#f4f4f1}

  /* placeholder boxes (photos / charts) */
  .ph{background:repeating-linear-gradient(45deg,#E4E5DE,#E4E5DE 8px,#DCDDD6 8px,#DCDDD6 16px);
    border:1px dashed var(--line);border-radius:18px;display:flex;
    align-items:center;justify-content:center;color:var(--mut);font-size:var(--t-sm);
    letter-spacing:.04em;font-weight:500;min-height:64px}
  .ph.round{border-radius:50%}

  /* photo avatar badge (emotion glyph sits on the photo, never replaces it) */
  .badge{position:absolute;top:4px;right:4px;min-width:26px;height:26px;padding:0 4px;
    border-radius:999px;border:none;background:#fff;display:flex;
    align-items:center;justify-content:center;
    font-size:var(--t-sm);color:var(--ink)}

  /* buttons — white / sage pills, matching the dashboard */
  .btn{display:block;width:100%;text-align:center;border-radius:999px;padding:17px;
    font-size:var(--t-md);font-weight:500;cursor:pointer;border:none;
    background:var(--card);color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--sage);color:var(--serif-ink)}
  .btn.ghost{background:transparent;color:var(--mut)}
  .btn.sm{padding:10px 16px;width:auto;font-size:var(--t-sm)}
  .btn[disabled]{opacity:.5;pointer-events:none}

  /* face (expressive moments only — reactions, alerts) */
  .face{width:var(--fs,56px);height:var(--fs,56px);border-radius:50%;
    border:none;background:var(--card);display:flex;align-items:center;
    justify-content:center;font-size:var(--ff,18px);
    flex:0 0 auto;color:var(--ink)}
  .face.big{--fs:120px;--ff:40px}
  .face.accent{background:var(--sage)}

  /* header icon buttons + user avatar */
  .iconbtn{width:38px;height:38px;border-radius:50%;border:none;
    background:var(--card);display:flex;align-items:center;justify-content:center;
    font-size:17px;cursor:pointer;flex:0 0 auto;position:relative}
  .iconbtn:active{background:var(--box)}
  .avatarbtn{width:38px;height:38px;border-radius:50%;border:none;
    background:repeating-linear-gradient(45deg,#E4E5DE,#E4E5DE 6px,#DCDDD6 6px,#DCDDD6 12px);
    cursor:pointer;flex:0 0 auto}
  .ndot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;
    background:var(--icon);border:2px solid var(--ava)}

  /* status dot / pill */
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 auto}
  .dot.ok{background:var(--sage-deep)}
  .dot.warn{background:#B08968}
  .pill{display:inline-flex;align-items:center;gap:6px;border:none;
    border-radius:999px;padding:6px 12px;font-size:var(--t-sm);background:var(--card)}
  .pill.accent{background:var(--sage);color:var(--serif-ink);font-weight:500}

  /* list */
  .list{display:flex;flex-direction:column;gap:0}
  .li{display:flex;gap:12px;align-items:center;padding:13px 4px;
    border-bottom:1px solid var(--line2)}
  .li:last-child{border-bottom:none}

  /* advice row (diagnosis) — a recommendation the POT senses, never a tickable task */
  .adv{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;
    border-bottom:1px solid var(--line2)}
  .adv:last-child{border-bottom:none}
  .adv .leaf{color:var(--sage-deep);font-size:var(--t-sm);line-height:1.5;flex:0 0 auto}

  /* ── PLANTS OVERVIEW — edge-to-edge card stack (Figma "concept2" 364:585) ──
     Cards are 192px tall on a 140px step, so 140px of every card shows and the
     last one stands taller. 40px top corners only — every bottom is tucked under
     the next card. Later cards paint on top (z-index inline), which is what makes
     the stack read as a stack. */
  .plhead{display:flex;align-items:center;gap:5px;margin:13px -2px 0;flex:0 0 auto}
  .plback{width:24px;height:24px;flex:0 0 auto;cursor:pointer;opacity:.4;
    display:flex;align-items:center;justify-content:center}
  .plback:active{opacity:.75}
  .pltitle{flex:1;margin:0;font-family:'Riccione',Georgia,serif;font-weight:400;
    color:var(--serif-ink);font-size:var(--t-xl);line-height:1.16;letter-spacing:0}
  .pladd{flex:0 0 auto;background:#fff;border:none;border-radius:var(--r-btn);
    padding:15px 24px;font-size:var(--t-md);color:var(--ink);cursor:pointer}
  .pladd:active{transform:translateY(1px)}

  /* full bleed, and the negative bottom cancels the screen's padding so the last
     card runs off the bottom edge instead of ending on a strip of page */
  .pstack{display:flex;flex-direction:column;flex:0 0 auto;margin:0 -16px -24px}
  .plcard{position:relative;height:192px;margin-top:-52px;
    border-radius:40px 40px 0 0;cursor:pointer;color:var(--serif-ink);
    box-shadow:0 -4px 60px rgba(61,61,61,.2);
    transition:transform .18s var(--soft),filter .18s var(--soft)}
  .plcard:first-child{margin-top:0;box-shadow:none}
  .plcard:last-child{height:250px}
  .plcard:active{transform:scale(.99);filter:brightness(.98)}
  /* status chip — thin dark outline, no fill */
  .plchip{position:absolute;left:43px;top:14px;border:1px solid var(--ink);
    border-radius:24px;padding:2px 10px 5px;font-size:var(--t-md);
    color:var(--ink);line-height:1.25}
  .plspecies{position:absolute;left:43px;top:76px;font-size:var(--t-md);
    color:var(--ink);opacity:.4;line-height:1.25}
  /* a plant whose species IS its name (Basil) drops the duplicate label, so the
     name moves up into the space the species would have used */
  .plcard:not(:has(.plspecies)) .plname{top:76px}
  .plname{position:absolute;left:43px;top:101px;font-family:'Riccione',Georgia,serif;
    font-weight:400;font-size:var(--t-lg);line-height:1.18;color:var(--serif-ink)}
  /* the pot render. Its window crops the square source exactly as the mockup
     does; the pot then spills past the card's visible band — and, for two of
     them, past the screen edge. The window is hosted by the card BELOW so it
     paints over that card's surface but under its chip/species/name. */
  .plshot{position:absolute;overflow:hidden;pointer-events:none;z-index:1}
  .plshot img{position:absolute;display:block;max-width:none;
    filter:drop-shadow(0 10px 16px rgba(30,12,0,.16))}
  .plchip,.plspecies,.plname{z-index:2}

  /* compact, secondary "+ add plant" tile — sits above the stack, not a peer of the plant cards */
  .addtile{border:1px dashed var(--line);border-radius:999px;background:transparent;
    color:var(--sage-deep);
    display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;
    font-size:var(--t-sm);font-weight:500;cursor:pointer;flex:0 0 auto}
  .addtile:active{background:var(--box)}
  .addtile .plus{font-size:var(--t-md);line-height:1;font-weight:400}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:2px}
  .pgdot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .pgdot.on{background:var(--sage-deep)}

  /* ── PLANT DETAIL — immersive full-bleed photo + draggable bottom sheet ──
     The photo is a fixed background: it never scrolls and never moves when the
     sheet is dragged. Only the sheet translates; the dim layer fades over the
     photo as it rises. */
  .pd{flex:1 1 auto;position:relative;overflow:hidden}
  .pdphoto{position:absolute;inset:0;border-radius:0;border:none;min-height:0}
  .pddim{position:absolute;inset:0;background:#1E0C00;z-index:7;pointer-events:none}
  .pdbar{position:absolute;top:10px;left:14px;right:14px;z-index:12;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .pdname{background:var(--card);border:none;border-radius:999px;padding:8px 14px}
  .pdname b{font-size:var(--t-md);display:block;line-height:1.2;font-weight:500}
  .pdname small{color:var(--mut);font-size:var(--t-sm)}
  .pdmenu{position:absolute;top:58px;right:14px;z-index:22;background:var(--card);
    border:none;border-radius:var(--r-card);min-width:196px;overflow:hidden}
  .pdmenu > div{padding:13px 16px;font-size:var(--t-md);cursor:pointer;
    border-bottom:1px solid var(--line2)}
  .pdmenu > div:last-child{border-bottom:none}
  .pdmenu > div:active{background:var(--box)}

  /* plant + pot inside the photo — proportions are driven by the timeline index */
  .pdstack{position:absolute;left:0;right:0;z-index:6;display:flex;
    flex-direction:column;align-items:center;gap:8px;padding:0 22px}
  .pdplant{width:148px;border-radius:16px 16px 6px 6px;min-height:0}
  .pdpot{position:relative;border:none;border-radius:7px 7px 24px 24px;
    background:repeating-linear-gradient(45deg,#DCDDD6,#DCDDD6 8px,#D2D3CC 8px,#D2D3CC 16px);
    display:flex;align-items:center;justify-content:center;color:var(--ink);
    font-weight:500;letter-spacing:.05em}
  /* speech bubble on the photo — organic blob, same language as the chat */
  .pdspeech{position:relative;max-width:280px;background:var(--c-me);border:none;
    border-radius:var(--bub);padding:14px 16px;font-size:var(--t-md);line-height:1.3;
    text-align:center}
  .pdstage{font-size:var(--t-sm);letter-spacing:.04em;font-weight:500;
    color:var(--mut);background:var(--card);border:none;border-radius:999px;
    padding:5px 12px}

  /* TIMELINE — a snap strip of the universal growth milestones; the centred one
     is the stage shown in the photo */
  .pdtl{position:absolute;left:0;right:0;z-index:8}
  .pdrail{height:1px;background:var(--line);margin:0 18px 6px}
  .pdtlstrip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;padding:0 calc(50% - 58px)}
  .pdtlstrip::-webkit-scrollbar{height:0;display:none}
  .pdtick{flex:0 0 116px;width:116px;scroll-snap-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .pdtick small{font-size:var(--t-sm);color:var(--mut);white-space:nowrap}
  .pdtick.on small{color:var(--sage-deep);font-weight:500}

  /* BOTTOM SHEET — peeks "Your bond", drags up to reveal the rest */
  .sheet{position:absolute;left:0;right:0;bottom:0;height:560px;z-index:14;
    background:var(--bg);border:none;
    border-top-left-radius:var(--r-sheet);border-top-right-radius:var(--r-sheet);
    display:flex;flex-direction:column}
  .sheetgrab{flex:0 0 auto;padding:9px 16px 12px;cursor:grab;touch-action:none;
    user-select:none;-webkit-user-select:none}
  .grabber{width:44px;height:5px;border-radius:999px;background:var(--line);
    margin:0 auto 11px}
  .sheetbody{flex:1 1 auto;overflow-y:auto;padding:0 16px 22px;
    display:flex;flex-direction:column;gap:12px}
  .sheetbody::-webkit-scrollbar{width:0}
  .tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tile{background:var(--card);border:none;border-radius:18px;
    padding:12px 8px;text-align:center}
  .tile small{display:block;color:var(--mut);font-size:var(--t-sm)}
  .tile b{font-size:var(--t-sm);display:block;margin-top:3px;line-height:1.25}

  /* progress */
  .bar{height:12px;background:var(--box);border-radius:999px;overflow:hidden;
    border:none}
  .bar > i{display:block;height:100%;background:var(--sage-deep);width:0}
  .bar > i.fill-anim{animation:fill 2.2s linear forwards}
  @keyframes fill{from{width:6%}to{width:100%}}

  /* spinner */
  .spin{width:30px;height:30px;border:3px solid var(--box);border-top-color:var(--sage-deep);
    border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* radar-ish searching pulse */
  .pulse{width:14px;height:14px;border-radius:50%;background:var(--sage-deep);
    animation:pulse 1.1s infinite ease-out;flex:0 0 auto}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(110,132,92,.4)}100%{box-shadow:0 0 0 12px rgba(110,132,92,0)}}

  /* ══════════ DASHBOARD — rebuilt from the Figma "concept2" frames ══════════
     Two states of ONE screen: a collapsed sage header pill over the group chat,
     and an expanded state where that same pill floods the screen. The green
     surface is a single element that morphs (shared-element feel); the chat is
     pushed down, desaturated and left peeking at the bottom edge. */
  .dash{padding:0;gap:0;overflow:hidden;position:relative;background:var(--bg)}

  /* the morphing sage surface: pill → full bleed */
  .gsurface{position:absolute;left:14px;right:14px;top:12px;height:74px;z-index:12;
    background:var(--sage);border-radius:var(--r-pill);cursor:pointer;
    transition:left .38s var(--soft),right .38s var(--soft),
      top .38s var(--soft),height .38s var(--soft),border-radius .38s var(--soft)}
  /* the green leads the sequence — it starts moving on frame 1, everything else
     is timed off it */
  .dash.open .gsurface{left:0;right:0;top:0;height:434px;border-radius:0;
    transition:left .5s var(--spring),right .5s var(--spring),
      top .5s var(--spring),height .5s var(--spring),border-radius .5s var(--spring)}
  /* sage underlay — only visible through the sheet's rounded corners once open */
  .gunder{position:absolute;inset:0;z-index:8;background:var(--sage);opacity:0;
    pointer-events:none;transition:opacity .2s ease-out}
  .dash.open .gunder{opacity:1;transition:opacity .24s ease-out .2s}

  /* display headline — slides from the pill's left edge to the centre and grows */
  /* left:41px = the pill's own left edge (14) + the mockup's 27px inner padding */
  .ghead{position:absolute;left:41px;top:23px;z-index:14;transform:translateX(0);
    font-family:'Riccione',Georgia,serif;font-weight:400;color:var(--serif-ink);
    font-size:var(--t-lg);line-height:1.18;letter-spacing:0;pointer-events:none;
    transition:left .38s var(--soft),top .38s var(--soft),
      font-size .38s var(--soft),transform .38s var(--soft)}
  /* travels WITH the surface (40ms behind it) so it reads as one shared element */
  .dash.open .ghead{left:50%;top:121px;transform:translateX(-50%);
    font-size:var(--t-xl);text-align:center;white-space:nowrap;
    transition:left .46s var(--spring) .04s,top .46s var(--spring) .04s,
      font-size .46s var(--spring) .04s,transform .46s var(--spring) .04s}

  /* date — only in the expanded state, fades in */
  /* date + CTA are the tail of the stagger: they fade and slide in once the green
     has most of the way expanded, and leave immediately on collapse */
  .gdate{position:absolute;left:14px;top:39px;z-index:14;font-size:var(--t-md);
    color:var(--ink);opacity:0;pointer-events:none;transform:translateY(-6px);
    transition:opacity .14s ease-in,transform .14s ease-in}
  .dash.open .gdate{opacity:.4;transform:translateY(0);
    transition:opacity .26s var(--soft) .2s,transform .26s var(--soft) .2s}

  /* header icons: plant · bell (+ dot) · avatar. They keep their vertical place
     and only slide out to the screen edge as the pill becomes full-bleed. */
  .gicons{position:absolute;right:31px;top:29px;z-index:16;display:flex;
    align-items:center;gap:14px;
    transition:right .38s var(--soft)}
  .dash.open .gicons{right:14px;transition:right .46s var(--spring)}
  .gicon{width:24px;height:24px;cursor:pointer;position:relative;display:block}
  .gicon svg{display:block}
  /* the badge sits ON the bell's top-right corner (Figma 314,84 against a bell at
     297,85) — it must not lean into the gap before the avatar */
  .gdot{position:absolute;top:-3px;right:-3px;width:12px;height:12px}
  .gava{width:40px;height:40px;border-radius:50%;cursor:pointer;flex:0 0 auto;
    object-fit:cover;display:block}

  /* white pill CTA — expanded state only */
  .gcta{position:absolute;left:50%;top:250px;transform:translateX(-50%);z-index:14;

    transition:opacity .28s var(--soft) .25s,transform .28s var(--soft) .25s}
  .gcta{transform:translateX(-50%) translateY(10px)}
  .dash.open .gcta:active{transform:translateX(-50%) translateY(1px);transition:transform .08s}

  /* the chat layer — the whole content in the collapsed state; pushed down,

  .gchat{position:absolute;left:0;right:0;top:0;bottom:0;z-index:10;
    border-radius:0;background:transparent;

    padding:100px 14px 100px;border-radius:inherit;
    filter:saturate(1) blur(0);transition:filter .34s var(--soft)}

     the sheet, so the sheet's edge and corners stay crisp */
  .dash.open .gscroll{padding-top:26px;overflow-y:hidden;
    filter:saturate(.45) blur(2.5px);transition:filter .46s var(--soft) .06s}
  /* soft fade where the chat runs under the header / the sheet's top edge.
     Only present when something is actually scrolled up behind it (.on). */
  .gfade{position:absolute;left:0;right:0;top:0;height:244px;z-index:11;
    pointer-events:none;opacity:0;
    background:linear-gradient(180deg,var(--bg) 0,var(--bg) 96px,rgba(237,238,233,0) 244px);

    background:linear-gradient(180deg,var(--bg2) 0%,rgba(239,239,239,0) 78%);

  /* message row — grey avatar circle + organic colour-coded bubble */
  .grow-row{display:flex;gap:5px;align-items:flex-start;margin-bottom:11px}
  .grow-row.me{flex-direction:row-reverse}
  .gmava{width:37.81px;height:37.81px;border-radius:50%;background:var(--ava);
    flex:0 0 auto;position:relative}
  /* an illustrated pot character brings its own circle — and its plant overhangs
     the circle upwards, exactly as the avatar frame draws it */
  .gmava.art{background:transparent}
  .gmava.art img{position:absolute;display:block;max-width:none;pointer-events:none}
  .gmava.art img.round{border-radius:50%;object-fit:cover}
  /* silhouette comes from the stretched Figma path (see blobBg), not border-radius.
     width:auto so a short line makes a short bubble; the mockup's 269px is the cap. */
  .gbub{position:relative;width:auto;max-width:min(269px,calc(100% - 48px));
    padding:15px;background-color:transparent;
    background-size:100% 100%;background-repeat:no-repeat;
    display:flex;flex-direction:column;gap:8px}
  /* reactions — messenger-style chips hooked over the bubble's bottom edge */
  .grx{position:absolute;bottom:-11px;display:flex;gap:4px;z-index:3}

  .grow-row.me .grx{right:15px}

  /* a row carrying chips needs room for them before the next message */
  .grow-row.rx{margin-bottom:24px}
  .gmeta{display:flex;gap:10px;align-items:center;font-size:var(--t-sm);

  .gmeta span{opacity:.4;color:#000}
  .gtext{font-size:var(--t-md);line-height:1.28;color:var(--ink)}
  /* inline CTA inside an alert bubble — plain text over a hairline, no box */
  .gline{height:1px;background:rgba(0,0,0,.1);margin:7px 0}
  .glink{font-size:var(--t-md);text-align:center;color:var(--ink);cursor:pointer}

  /* composer — elongated pill + microphone (no send arrow) */
  .gcomposer{position:absolute;left:14px;right:14px;bottom:14px;height:74px;z-index:20;

  /* auto-watering / reservoir controls (plant detail) */

  .resbar{height:14px;background:var(--box);border-radius:999px;overflow:hidden;

  /* inline text link inside a card (e.g. "Configure schedule") */

  /* bond hearts */

  /* unobtrusive text action (log out) — deliberately not a button */

  .listen{min-width:152px;height:42px;border:none;border-radius:999px;

    padding:0 18px;flex:0 0 auto}

  .listen.on{background:var(--sage);color:var(--serif-ink)}

  .eq i:nth-child(3){animation-delay:.3s}

  /* CREATE-CHARACTER hero — the top ~⅔ is the plant + its pot, mirroring the plant

  /* compact 3×2 personality preset grid */

  .galthumb{width:44px;height:44px;border-radius:14px;border:none;color:#ddd;

    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:var(--t-md)}
  .camspacer{width:44px;flex:0 0 auto}

  /* species reference image carousel (species-info screen)
     NOTE: an explicit min-height on the flex row is required — without it the

  .carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;

  .cslide{flex:0 0 358px;width:358px;max-width:calc(100vw - 40px);scroll-snap-align:center;

  .footer{position:sticky;bottom:0;margin:auto -16px 0;padding:12px 16px 6px;

  @media (max-width:1100px){ .flowindex{display:none} }
</style>

                   news, the congratulations and Margot's alert — still coherent)

     rx          → reactions, [emoji, count]; everyone reacts to everyone */

/* ───────────────── PERSONALITY MODEL (single source of truth) ─────────────────
   Six presets, each with default positions for THREE fixed sliders
   (warmth / drama / chattiness) and a small set of in-character line variants.
   Both the onboarding "create character" tuner and the plant-settings screen
   read from here. Slider values are CONTINUOUS 0–100. `words` is the spread of
   labels the handle passes through (index = which fifth of the range it's in). */
const SLIDERS = [
  { key:"warmth",     label:"Warmth",     words:["Dry","Reserved","Balanced","Warm","Affectionate"] },
  { key:"drama",      label:"Drama",      words:["Understated","Subtle","Balanced","Dramatic","Theatrical"] },
  { key:"chattiness", label:"Chattiness", words:["Rarely","Occasional","Balanced","Chatty","Often"] },
];
// map a 0–100 value to its word in a spread (equal buckets)
const wordFor = (words, val)=> words[Math.min(words.length-1, Math.floor(val/(100/words.length)))];
// thresholds that flip the sample-line variants (top / bottom fifth-ish)
const HI = 66, LO = 34;
const PERSONALITIES = {
  sliders: SLIDERS,
  presets: [
    { k:"Friendly", d:"Warm & easy", defaults:{warmth:84, drama:50, chattiness:84},
      lines:{

        base:"Morning! So good to see you today — how are we doing?",

      faces:{ base:"content", big:"greeting", terse:"content",

    { k:"Drama queen", d:"Season finale", defaults:{warmth:50, drama:84, chattiness:84},

    { k:"Grump", d:"Secretly caring", defaults:{warmth:16, drama:50, chattiness:16},
      lines:{

              warm:"content", dry:"cold" } },
    { k:"Calm", d:"Zen & gentle", defaults:{warmth:50, drama:16, chattiness:50},
      lines:{
        terse:"All is well.",
        base:"All is well. Breathe. We're okay, you and me.",
        big:"Feel how the light moves through the room — nothing to fix, nothing to chase, just this.",
        warm:"I'm glad we share this quiet.", dry:"It is fine." },
      faces:{ base:"sleeping", big:"content", terse:"sleeping",
              warm:"content", dry:"neutral" } },
    { k:"Cheerful", d:"Sunny & peppy", defaults:{warmth:84, drama:50, chattiness:84},
      lines:{
        terse:"Hi! Lovely day!",
        base:"Hey hey! What a great day to be a plant. Loving this light!",
        big:"WOOHOO best day EVER — sunshine, water, AND you showed up?! I could burst!",
        warm:"So happy you're here!", dry:"…nice day, I guess." },
      faces:{ base:"greeting", big:"urgent", terse:"content",
              warm:"greeting", dry:"neutral" } },
    { k:"Sassy", d:"Playful bite", defaults:{warmth:50, drama:84, chattiness:50},
      lines:{
        terse:"Oh, look who it is.",
        base:"Took you long enough. I'm thriving, thanks for finally asking.",
        big:"Absolutely SERVING chlorophyll realness today and you're lucky to witness it, darling.",
        warm:"…you're kind of my favourite, don't tell the cactus.", dry:"Cool. Great. You're back." },
      faces:{ base:"hot", big:"hot", terse:"neutral",
              warm:"content", dry:"cold" } },
  ],
};
const personaByName = (k)=> PERSONALITIES.presets.find(p=>p.k===k) || PERSONALITIES.presets[0];

/* Live in-character sample line from continuous slider values. High drama → the
   "big" variant; low chattiness → the "terse" variant; high/low warmth appends an
   affectionate / dry tag. So dragging ANY slider across a threshold changes it. */
// which line variant the current slider values select — one source of truth for
// both the sentence and the face, so the two can never drift apart
function lineVariant(t){
  return t.drama>=HI ? "big" : (t.chattiness<=LO ? "terse" : "base");
}
function sampleLine(k, t){
  const L = personaByName(k).lines;
  let line = L[lineVariant(t)];
  if(t.warmth>=HI && L.warm)      line += " " + L.warm;
  else if(t.warmth<=LO && L.dry)  line += " " + L.dry;
  return line;
}

/* The emotion the pot wears while it "says" that line. Every preset maps its
   variants onto the existing EMO set, so changing preset changes the face, and
   dragging a slider across a threshold changes it again.
   The warmth tag re-colours the parting mood, EXCEPT on the "big" line — a
   theatrical sentence dominates whatever gets appended to it, so the face keeps
   the theatrical read. */
function faceFor(k, t){
  const F = personaByName(k).faces || {};
  const v = lineVariant(t);
  let emo = F[v] || F.base || "neutral";
  if(v !== "big"){
    if(t.warmth>=HI && F.warm)     emo = F.warm;
    else if(t.warmth<=LO && F.dry) emo = F.dry;
  }
  return emo;
}

/* Low-fi CONTINUOUS range slider (native input, 0–100). Grey track, accent fill via
   an inline gradient, accent handle, no shadow. Drag (mouse/touch) or tap the track;
   the right-hand label maps to a spread of words as the handle moves. */
function RangeSlider({label, words, val, onChange}){
  const word = wordFor(words, val);

  const fill = `linear-gradient(to right, var(--accent) ${val}%, var(--line) ${val}%)`;

      onChange={e=>onChange(Number(e.target.value))}/>

const BUBBLE = {

/* ── BUBBLE SILHOUETTE ──────────────────────────────────────────────────────
   The mockup's bubbles are vector blobs (Ellipse 19/20/21), not rounded rects:
   their corners are superellipse-ish — the outline hugs the edge and turns late,
   which is what gives them the soft pebble character. border-radius cannot draw
   that curve at all, so each bubble is painted from the actual Figma path,
   stretched to the message box (preserveAspectRatio="none").
   Every corner keeps Figma's construction — both control points sitting on the
   corner vertex, which is what makes the curve hug the edge and turn late.
   Two edits: Figma runs all four corners at half the box (so three of them read
   the same), so the radii are staggered per corner (them 44/57/62/16,
   alert 62/82.7/74/16, me 24/35/28/16) for the uneven pebble silhouette the
   brief asks for; and the corner nearest the avatar is re-cut tight at 16px,

};
function blobBg(kind, fill){

/* "Wednesday, 12th August" — the expanded state shows today's real date. */
function todayLabel(){
  const d = new Date(), n = d.getDate(), t = n % 10, h = n % 100;
  const suf = (t===1&&h!==11) ? "st" : (t===2&&h!==12) ? "nd" : (t===3&&h!==13) ? "rd" : "th";
  return d.toLocaleDateString("en-GB",{weekday:"long"}) + ", " + n + suf + " "

}

/* WINDOWSILL — the group chat. Plants message the user, talk to each other, and
   thank the user once the pot senses a need was handled offline. An urgent need
   carries a plain-text inline CTA under a hairline (no outlined box) that taps
   through into the alert → diagnosis flow. `focus` comes from a notification tap
   and scrolls to that plant's most recent message. */
function GardenChat({focus, open, onCollapse}){
  const nav = useNav();
  const { chatCross } = useApp();
  const [msgs,setMsgs] = useState(CHAT_INIT);
  const [text,setText] = useState("");
  // the top fade only exists while there IS hidden content above the viewport —
  // at the very first message the bubble must be fully lit, not dimmed
  const [scrolled,setScrolled] = useState(true);
  const scroller = useRef(null);
  const target = useRef(null);
  const onScroll = (e)=> setScrolled(e.currentTarget.scrollTop > 4);

  // "plants talk to each other" is controlled from the profile's chat settings
  const shown = chatCross ? msgs : msgs.filter(m=>!m.cross);
  // index of the message a notification pointed at, if any
  const hot = focus ? shown.map(m=>m.who).lastIndexOf(focus) : -1;

  useEffect(()=>{
    const el = scroller.current;
    if(!el) return;
    // a focused message wins; otherwise land on the newest (the urgent one)
    if(target.current) el.scrollTop = Math.max(0, target.current.offsetTop - 120);
    else el.scrollTop = el.scrollHeight;
    setScrolled(el.scrollTop > 4);
  },[shown.length]);

  // while the hero expands/collapses the pane changes height — keep the stream
  // pinned to its newest message for the whole 460ms so it reads as "pushed down"
  useEffect(()=>{
    const el = scroller.current;
    if(!el || target.current) return;
    let raf, stop = false;
    const pin = ()=>{ if(stop) return; el.scrollTop = el.scrollHeight; raf = requestAnimationFrame(pin); };
    pin();
    const t = setTimeout(()=>{ stop = true; cancelAnimationFrame(raf);
      setScrolled(el.scrollTop > 4); }, 520);
    return ()=>{ stop = true; cancelAnimationFrame(raf); clearTimeout(t); };
  },[open]);

  const send = ()=>{
    if(!text.trim()) return;
    const t = text;
    setText("");
    setMsgs(m=>[...m,{who:"me",text:t,at:"now"}]);
    setTimeout(()=>setMsgs(m=>[...m,
      {who:"margo",at:"now",text:"love it when you message us 💚"}]),400);
  };

  return <>
    {/* while the hero is open the stream is frozen, so a scroll gesture over it is
        unambiguous: it means "give me the chat back" */}
    <div className="gchat" onClick={()=> open && onCollapse()}
      onWheel={()=> open && onCollapse()}
      onTouchMove={()=> open && onCollapse()}>
      <div className="gscroll" ref={scroller} onScroll={onScroll}>
        {shown.map((m,i)=>{
          const isMe = m.who==="me";
          const p = !isMe && plantById(m.who);
          const av = AVATAR[m.who];
          const shape = isMe ? "me" : (m.urgent ? "alert" : "them");
          return <div key={i} className={"grow-row "+(isMe?"me":"them")+(m.rx?" rx":"")}
            ref={i===hot ? target : null}>
            <div className={"gmava"+(av?" art":"")}>
              {av && <img src={av.src} alt="" className={av.round?"round":null}
                style={{width:av.w,height:av.h,left:av.l,top:av.t}}/>}
            </div>
            <div className="gbub" style={{backgroundImage:
              blobBg(shape, isMe ? BUBBLE.me : (BUBBLE[m.who]||BUBBLE.margo))}}>
              {!isMe && <div className="gmeta">
                <b>{p.name.split(" ")[0]}</b><span>{m.at}</span>
              </div>}
              <div className="gtext">{m.text}</div>
              {/* inline CTA — plain text over a hairline, never an outlined box */}
              {m.urgent && <>
                <div className="gline"/>
                <div className="glink" onClick={e=>{e.stopPropagation(); nav.go("alert");}}>
                  Check what happened
                </div>
              </>}
              {m.rx && <div className="grx">
                {m.rx.map(([e,n])=>(
                  <div className="grxchip" key={e}>{e}<span>{n}</span></div>
                ))}
              </div>}
            </div>
          </div>;
        })}
      </div>
    </div>
    <div className={"gfade"+(scrolled?" on":"")}/>

    {/* composer — elongated pill, microphone in place of a send arrow */}
    <div className="gcomposer" onClick={e=>e.stopPropagation()}>
      <input value={text} placeholder="Message to your plants"
        onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
      <span className="gmic" title="Hold to speak" onClick={send}><IconMic/></span>
    </div>
  </>;
}

/* ── PLANT DETAIL ── immersive: full-bleed photo + draggable "Your bond" sheet.
   Sheet geometry. PEEK is what stays visible when collapsed (the bond header);
   the sheet translates down by OFF ∈ [0, MAXOFF], so OFF=MAXOFF is collapsed. */
const SHEET_H = 560, PEEK = 96, MAXOFF = SHEET_H - PEEK;

function PlantDetail({params}){
  const nav = useNav();
  const p = plantById((params&&params.id)||"felix");
  const last = MILESTONES.length-1;

  const [idx,setIdx]   = useState(last);   // timeline position (starts at "Now")
  const [off,setOff]   = useState(MAXOFF); // sheet offset — starts collapsed
  const [menu,setMenu] = useState(false);
  const [auto,setAuto] = useState(p.autoOn);
  const strip = useRef(null);
  const drag  = useRef(null);

  const low = p.reservoir < 25;
  const e   = EMO[p.emotion] || EMO.neutral;
  const ms  = MILESTONES[idx];
  const atNow = idx === last;

  // 0 = collapsed, 1 = fully open. Drives the dim and hides the timeline.
  const t  = 1 - off/MAXOFF;
  const tl = Math.max(0, 1 - t*3);         // timeline fades out as the sheet rises

  /* TWO framings only — the camera does not zoom gradually.
     NOW  → the plant and the pot as they are right now, emotion on the pot.
     PAST → snap once to a zoomed-in framing: mostly plant, only the pot's top
            RIM in shot. That framing is IDENTICAL at every past milestone; the
            only thing that changes as you scrub is how big the PLANT is. */
  const pastG  = last>1 ? idx/(last-1) : 0;             // 0…1 across the past only
  const plantH = atNow ? 200 : Math.round(96 + pastG*200);
  const plantW = atNow ? 148 : 208;
  const potH   = atNow ? 150 : 26;                      // past: just the rim
  const potW   = atNow ? 188 : 246;
  const potRadius = atNow ? "7px 7px 24px 24px" : "8px 8px 0 0";

  // open the strip on "Now"; swiping it left walks back through the milestones
  useEffect(()=>{ const el=strip.current; if(el) el.scrollLeft = el.scrollWidth; },[]);

  const onStripScroll = (ev)=>{
    const el = ev.target, first = el.firstChild;
    const pitch = first ? first.offsetWidth : 116;
    setIdx(Math.max(0, Math.min(last, Math.round(el.scrollLeft/pitch))));
  };

  /* Sheet drag. Pointer events cover mouse + touch; the grab area sets
     touch-action:none so dragging never scrolls anything behind it. */
  const down = (ev)=>{
    ev.currentTarget.setPointerCapture(ev.pointerId);
    drag.current = { y:ev.clientY, off, moved:0 };
  };
  const move = (ev)=>{
    const d = drag.current; if(!d) return;
    const dy = ev.clientY - d.y;
    d.moved = Math.max(d.moved, Math.abs(dy));
    setOff(Math.max(0, Math.min(MAXOFF, d.off + dy)));
  };
  const up = ()=>{
    const d = drag.current; if(!d) return;
    drag.current = null;
    // a tap toggles; a real drag snaps to whichever end it is closer to
    setOff(o => (d.moved < 6 ? (o > MAXOFF/2 ? 0 : MAXOFF)
                             : (o < MAXOFF/2 ? 0 : MAXOFF)));
  };

  return <div className="pd" onClick={()=>menu&&setMenu(false)}>
    {/* 1 — the photo: fixed, full-bleed, never scrolls and never moves */}
    <div className="ph pdphoto"/>
    <div className="pddim" style={{opacity:(0.55*t).toFixed(3)}}/>

    {/* 2 — the plant + pot inside the photo */}
    <div className="pdstack" style={{bottom:PEEK+74}}>
      {atNow
        ? <div className="pdspeech">“{p.checkin}”</div>
        : <div className="pdstage">{ms.stage} · {ms.date}</div>}
      <div className="ph pdplant" style={{height:plantH,width:plantW}}>[PLANT]</div>
      <div className="pdpot" style={{width:potW,height:potH,borderRadius:potRadius}}>
        {/* the emotion belongs to "now" — a past frame is a photo, not a mood */}
        {atNow && <span style={{fontSize:32}}>{e.face}</span>}
      </div>
    </div>

    {/* 3 — top bar: name + the ⋯ context menu */}
    <div className="pdbar">
      <button className="back" onClick={nav.back}>‹ Back</button>
      <div className="pdname center"><b>{p.name}</b><small>{p.species} · {p.persona}</small></div>
      <div className="iconbtn" title="More" onClick={ev=>{ev.stopPropagation();setMenu(m=>!m);}}>⋯</div>
    </div>
    {/* one destination: everything about this plant lives on one settings screen */}
    {menu && <div className="pdmenu" onClick={ev=>ev.stopPropagation()}>
      <div onClick={()=>{setMenu(false);nav.go("plantSettings",{id:p.id});}}>
        Personality &amp; Settings</div>
    </div>}

    {/* 4 — the timeline: swipe it to change the plant shown in the photo */}
    <div className="pdtl" style={{bottom:PEEK+6, opacity:tl.toFixed(2),
      pointerEvents: tl<0.15 ? "none" : "auto"}}>
      <div className="pdrail"/>
      <div className="pdtlstrip" ref={strip} onScroll={onStripScroll}>
        {MILESTONES.map((m,n)=>(
          <div className={"pdtick"+(n===idx?" on":"")} key={m.stage}>
            <span className={"pgdot"+(n===idx?" on":"")}/>
            <small>{m.stage}</small>
          </div>
        ))}
      </div>
    </div>

    {/* 5 — the bottom sheet */}
    <div className="sheet" style={{transform:"translateY("+off+"px)"}}>
      <div className="sheetgrab" onPointerDown={down} onPointerMove={move}
        onPointerUp={up} onPointerCancel={up}>
        <div className="grabber"/>
        <div className="spread">
          <div><b>Your bond</b><br/>
            <small className="muted">Level {p.bondLevel} · {p.bondTitle}</small></div>
          <Hearts level={p.bondLevel}/>
        </div>
      </div>

      <div className="sheetbody">
        <div className="col" style={{gap:6}}>
          <div className="bar"><i style={{width:p.bondPct+"%"}}/></div>
          <small className="muted">{p.bondPct}% to the next level — keep checking in to grow closer.</small>
        </div>

        <div className="tiles">
          <div className="tile"><small>Last watering</small><b>{p.lastWatered}</b></div>
          <div className="tile"><small>Reservoir</small><b>{p.reservoir}%</b></div>
          <div className="tile"><small>Light</small><b>{p.light}</b></div>
        </div>

        {/* AUTO-WATERING — an in-app setting, so it needs a real tap. The schedule
            lives behind a text link in this same card rather than its own row. */}
        <div className="card col" style={{gap:10}}>
          <div className="spread">
            <b>Auto-watering</b>
            <Toggle on={auto} onClick={()=>setAuto(!auto)}/>
          </div>
          <div className="spread" style={{marginTop:2}}>
            <small className="muted">Reservoir {low?"running low":"level"}</small>
            <b style={low?{color:"var(--accent)"}:null}>{p.reservoir}%</b>
          </div>
          <div className={"resbar"+(low?" low":"")}><i style={{width:p.reservoir+"%"}}/></div>
          <a className="tlink" style={{opacity:auto?1:.5,pointerEvents:auto?"auto":"none"}}
            onClick={()=>nav.go("waterConfig",{id:p.id})}>Configure schedule ›</a>
        </div>
      </div>
    </div>
  </div>;
}

function speciesInfo(species){
  const shots = [1,2,3,4].map(n=> species+" · REF "+n);
  const ident = [
    ["Leaves",          "Leaf shape, edge and vein pattern"],
    ["Colour & texture","Surface colour, gloss and any variegation"],
    ["Growth habit",    "Upright, bushy, trailing or rosette"],
    ["Size at maturity","Typical height indoors"],
    ["Stem / trunk",    "Woody, fleshy or none"],
  ];
  const tells = [
    "Thicker, stiffer leaves",
    "Leaves rise straight from the base",
    "Smaller leaves on thin, drooping stems",
    "Paler colour and a matte surface",
  ];
  // three other species as look-alikes, each tappable through to its own screen
  const confused = SPECIES.filter(s=>s!==species).slice(0,3)
    .map((s,i)=>[s, tells[i%tells.length]]);
  return { shots, ident, confused };
}
function SpeciesDetail({params}){
  const nav = useNav();
  const species = (params&&params.species)||"your plant";
  const [pi,setPi] = useState(0);
  const { shots, ident, confused } = speciesInfo(species);
  return <div className="screen">
    <Top title={species} onBack={nav.back} kicker="New plant · is this your species?"/>

    {/* reference-photo carousel (swipe, dot indicators) */}
    <div className="carousel" onScroll={e=>{
      const w=e.target.clientWidth||1; setPi(Math.round(e.target.scrollLeft/w));
    }}>
      {shots.map((s,i)=><div key={i} className="cslide ph">[{s}]</div>)}
    </div>
    <div className="dots">{shots.map((_,i)=><span key={i} className={"pgdot"+(pi===i?" on":"")}/>)}</div>

    <div className="kicker">How to identify it</div>
    <div className="list card">
      {ident.map(([k,v])=>(
        <div key={k} className="li"><div style={{width:110,color:"var(--mut)",fontSize:"var(--t-sm)"}}>{k}</div>
          <div className="grow">{v}</div></div>
      ))}
    </div>

    <div className="kicker">Often confused with</div>
    <div className="col">
      {confused.map(([s,how])=>(
        <div key={s} className="card tap row" onClick={()=>nav.go("speciesDetail",{species:s})}>
          <Photo w={44} h={44} label="PIC"/>
          <div className="grow"><b>{s}</b><br/><small className="muted">{how}</small></div>
          <span className="muted">›</span></div>
      ))}
    </div>

    {/* bottom actions pinned as a sticky footer — visible without scrolling to the end.
        "Keep looking" pops all the way back to Best matches, even after the user has
        hopped through several "often confused with" species. */}
    <div className="footer">
      <button className="btn primary" onClick={()=>nav.go("create",{species})}>This is my plant</button>
      <button className="btn ghost" onClick={()=>nav.backTo("matches")}>Not quite — keep looking</button>
    </div>
  </div>;
}

/* Step 3 — create the character. The top ~⅔ is an immersive plant + pot, exactly
   like the plant card, with the live in-character line coming off the pot as a
   speech bubble and a text "Try it" button under it. Every control sits below.
   The bubble + button are sticky inside the scroll area, so the line you are
   tuning stays visible once the pot scrolls away. */
function CreateCharacter({params}){
  const nav = useNav();
  const species = (params&&params.species)||"your plant";
  const [name,setName]     = useState("");
  const [preset,setPreset] = useState("Friendly");
  const [tune,setTune]     = useState(personaByName("Friendly").defaults);
  const [voice,setVoice]   = useState("Warm");
  const [gender,setGender] = useState("Rather not say");
  const [previewPlaying,setPreviewPlaying] = useState(false);
  const finalName = name.trim() || "your plant";
  // any change to the character stops the mock preview playback
  const pickPreset = (k)=>{ setPreset(k); setTune(personaByName(k).defaults); setPreviewPlaying(false); };
  const setSlider  = (key,i)=>{ setTune(t=>({...t,[key]:i})); setPreviewPlaying(false); };

  return <div className="screen">
    <Top title="Create their character" onBack={nav.back} kicker={`New plant · step 3 of 3 · ${species}`}/>

    {/* 1 — IMMERSIVE HERO (~top ⅔): the line comes off the pot as a speech bubble */}
    <div className="cchero">
      <div className="ccbubble">
        <LinePreview preset={preset} tune={tune} playing={previewPlaying}
          onPlay={()=>setPreviewPlaying(p=>!p)}/>
      </div>
      <div className="ph pdplant" style={{height:214,width:148}}>[PLANT]</div>
      {/* the pot wears the emotion that matches the line in the bubble above it */}
      <div className="pdpot" style={{width:188,height:146}}>
        <span style={{fontSize:32}}>{(EMO[faceFor(preset,tune)]||EMO.neutral).face}</span>
      </div>
    </div>

    {/* 2 — NAME */}
    <div className="field"><label>Name</label>
      <input value={name} onChange={e=>setName(e.target.value)} placeholder="What should we call them?"/></div>

    {/* 2b — GENDER (three options; "Rather not say" is the default) */}
    <div className="field"><label>Gender</label>
      <div className="segrow">
        {["Male","Female","Rather not say"].map(g=>(
          <div key={g} className={"seg"+(gender===g?" on":"")} onClick={()=>setGender(g)}>{g}</div>
        ))}
      </div>
    </div>

    {/* 3 — PERSONALITY (6 presets, compact 3×2 grid) */}
    <div className="field"><label>Personality</label>
      <PresetGrid value={preset} onChange={pickPreset}/></div>

    {/* 4 — FINE-TUNING (revealed once a preset is chosen — always one selected) */}
    <div className="field"><label>Fine-tune {preset}</label>
      <FineTuning tune={tune} onChange={setSlider}/></div>

    {/* 5 — VOICE (timbre; simple selectable rows — playback lives in the preview) */}
    <VoicePicker value={voice} onChange={setVoice}/>

    {/* 6 — CTA */}
    <div style={{flex:1}}/>
    <button className="btn primary" onClick={()=>nav.go("meeting",{name:finalName})}>Say hello 👋</button>
  </div>;
}

/* DIAGNOSIS — ONE uniform list of steps under a single heading. Most are things
   you do in the room and the pot senses by itself; one of them is an in-app
   setting the pot cannot change for you, so that row (and only that row) carries
   an action button. Same row styling throughout — no split into two groups. */
function Diagnosis(){
  const nav = useNav();
  const [paused,setPaused] = useState(false);
  const steps = [
    { what:"Pause auto-watering for 5–7 days",
      how:"The pot won't change your watering settings on its own.", action:true },
    { what:"Move it away from the draughty window",
      how:"The pot will notice the temperature settle." },
    { what:"Put it somewhere warmer (18–22°C)",
      how:"It'll feel the change within a few hours." },
    { what:"Skip hand-watering for now",
      how:"The soil sensor will tell us when it's ready." },
  ];
  return <div className="screen">
    <Top title="What happened" onBack={nav.back} kicker="Felix · diagnosis"/>
    <div className="card row"><Face emotion="overwatered"/><div className="grow"><b>Overwatered</b><br/><small className="muted">Soil moisture 92% — that's too much water</small></div></div>
    <div className="card row"><Face emotion="cold"/><div className="grow"><b>Too cold</b><br/><small className="muted">14°C right next to the plant</small></div></div>

    <div className="kicker">What to do</div>
    <div className="card">
      {steps.map(s=>(
        <div className="adv" key={s.what}>
          <span className="leaf">🌿</span>
          <div className="grow">
            <div>{s.what}</div>
            <small className="muted">{s.how}</small>
            {s.action && (paused
              ? <div className="row" style={{gap:6,marginTop:8}}><span className="dot ok"/>
                  <small className="muted">Paused ✓ — resumes in 7 days</small></div>
              : <button className="btn sm primary" style={{marginTop:8}}
                  onClick={()=>setPaused(true)}>Pause auto-watering</button>)}
          </div>
        </div>
      ))}
    </div>

    <div className="footer">
      <button className="btn primary" onClick={()=>nav.go("alertDone")}>Got it</button>
    </div>
  </div>;
}
function AlertDone(){
  const nav = useNav();

/* Language picker — a plain LIST of options, not full-width card tiles. */
const LANGS = ["English","Русский","Español","Deutsch"];
function LangPick({params}){
  const nav = useNav();
  const which = (params&&params.which)||"ui";
  const { uiLang, setUiLang, convLang, setConvLang } = useApp();
  const value = which==="ui" ? uiLang : convLang;
  const set   = which==="ui" ? setUiLang : setConvLang;
  return <div className="screen">
    <Top title={which==="ui" ? "Interface language" : "Conversation language"}
      onBack={nav.back} kicker="Language"/>
    <div className="list card">
      {LANGS.map(l=>(
        <div key={l} className="li" style={{cursor:"pointer"}}
          onClick={()=>{ set(l); nav.back(); }}>
          <div className="grow">{l}</div>
          {value===l && <span style={{color:"var(--accent)",fontWeight:700}}>✓</span>}
        </div>
      ))}
    </div>
    <small className="muted center">{which==="ui"
      ? "The language of buttons, menus and screens."
      : "The language your plants chat with you in."}</small>
  </div>;
}

/* Pot renders (Figma assets frame 364:776), placed per the mockup 364:585.
   Each window crops its square source; values are card-relative, anchored to the
   card's RIGHT edge so they survive the 402→386 device width difference.
     right/top/w/h → the crop window;  img → the square render's rendered size;
     ix/iy        → where that square sits inside the window (negative = cropped) */
const POT_STEP = 140;   // how far one card is offset from the next
const SHOT = {
  felix:{ src:"assets/pot-felix.webp",  right:-46, top:0,   w:258, h:218, img:258, ix:0,   iy:-40  },
  margo:{ src:"assets/pot-margot.webp", right:0,   top:0,   w:265, h:172, img:363, ix:0,   iy:-144, tr:true },
  gosha:{ src:"assets/pot-gosha.webp",  right:9,   top:-4,  w:140, h:187, img:309, ix:-88, iy:-80  },
  vera: { src:"assets/pot-vera.webp",   right:-58, top:-55, w:282, h:282, img:282, ix:0,   iy:0    },
};
/* `hosted` shifts the window up by one card step: the pot belongs to the card
   above, but lives in this one so the stacking comes out right. */
function PotShot({who, hosted}){
  const p = SHOT[who];
  if(!p) return null;
  return <div className="plshot" style={{right:p.right, top:(hosted?p.top-POT_STEP:p.top),
      width:p.w, height:p.h, borderRadius:p.tr?"0 40px 0 0":0}}>
    <img src={p.src} alt="" style={{width:p.img,height:p.img,left:p.ix,top:p.iy}}/>
  </div>;
}

/* Plants list — reached from the expanded hero's "See your plants" (and from
   Profile). An edge-to-edge stack: every plant is a full-width card in its
   character gradient, tucked over the bottom of the card above, with its pot
   render breaking out of the card and spilling onto the one below. Tapping a
   card opens that plant's detail screen. */
function PlantsList(){
  const nav = useNav();
  return <div className="screen">
    <div className="plhead">
      <span className="plback" onClick={nav.back} title="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="#000" strokeWidth="2"
            strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </span>
      <h1 className="pltitle">My Plants</h1>
      <button className="pladd" onClick={()=>nav.go("pair")}>Add</button>
    </div>

    <div className="pstack">
      {PLANTS.map((it,i)=>{
        const e = EMO[it.emotion] || EMO.neutral;
        const above = PLANTS[i-1];                       // whose pot spills in here
        const isLast = i === PLANTS.length-1;
        return <div className="plcard" key={it.id}
          style={{zIndex:i+1, background:"var(--g-"+it.id+")"}}
          onClick={()=>nav.go("plant",{id:it.id})}>
          {above && <PotShot who={above.id} hosted/>}
          {isLast && <PotShot who={it.id}/>}
          <div className="plchip">{e.word}</div>
          {it.species !== it.name.split(" ")[0] &&
            <div className="plspecies">{it.species}</div>}
          <div className="plname">{it.name.split(" ")[0]}</div>
        </div>;
      })}
    </div>
  </div>;
}

/* ───────────────── APP STATE + ROUTER ───────────────── */
const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

const SCREENS = {
  dashboard:Dashboard, notifs:Notifications, profile:Profile, langPick:LangPick,
  plantsList:PlantsList,
  plant:PlantDetail, waterConfig:WaterConfig, plantSettings:PlantSettings,
  alert:Alert, diagnosis:Diagnosis, alertDone:AlertDone,
  pair:PairDevice, capture:CapturePhoto, matches:SpeciesMatches, species:SpeciesList,
  speciesDetail:SpeciesDetail, create:CreateCharacter, meeting:FirstMeeting,
};

/* Flow index — prototype-shell shortcut panel. Lives OUTSIDE the device.
   One entry per flow; `path` is the screen stack the shortcut builds, so an entry
   can land deep in a flow with Back still working. */
const FLOWS = [
  { label:"Add new plant",      path:[["pair"]] },
  { label:"Dashboard",          path:[["dashboard"]] },   // = hero + Windowsill chat
  { label:"Notifications",      path:[["notifs"]] },
  { label:"Plant card",         path:[["plant",{id:"felix"}]] },
  { label:"Alert simulation",   path:[["alert"]] },
  { label:"Profile & settings", path:[["profile"]] },
];
function FlowIndex({cur}){
  const nav = useNav();
  return <aside className="flowindex">
    {FLOWS.map(({label,path})=>{
      const dest = path[path.length-1][0];
      return <div key={label}
        className={"fi-link"+(cur.screen===dest?" on":"")}
        onClick={()=>nav.jump(path)}>{label}</div>;
    })}
  </aside>;
}

function App(){
  const [stack,setStack] = useState([{screen:"dashboard",params:{}}]);
  const [chatCross,setChatCross] = useState(true);
  const [freq,setFreq]           = useState("Moderate");
  const [uiLang,setUiLang]       = useState("English");
  const [convLang,setConvLang]   = useState("English");

  const cur = stack[stack.length-1];
  const nav = useMemo(()=>({
    go:(screen,params={})=> setStack(s=> screen==="dashboard"
      ? [{screen:"dashboard",params}]         // dashboard is the root — reset the stack
      : [...s,{screen,params}]),
    back:()=>setStack(s=>s.length>1?s.slice(0,-1):s),
    // pop back to a named screen — used by "keep looking" after hopping through
    // several look-alike species; falls back to a single step if it isn't in the stack
    backTo:(screen)=>setStack(s=>{
      const i = s.map(x=>x.screen).lastIndexOf(screen);
      return i>=0 ? s.slice(0,i+1) : (s.length>1?s.slice(0,-1):s);
    }),
    // replace the whole stack — lets the flow index land deep in a flow with Back intact
    jump:(path)=> setStack(path.map(([screen,params])=>({screen,params:params||{}}))),
  }),[]);

  const Screen = SCREENS[cur.screen] || Dashboard;

  return (
    <AppCtx.Provider value={{chatCross,setChatCross,freq,setFreq,
      uiLang,setUiLang,convLang,setConvLang}}>
    <Nav.Provider value={nav}>
      <div className="phone">
        <div className="device">
          <div className="island"/>
          <StatusBar/>
          <Screen params={cur.params} key={cur.screen+stack.length}/>
        </div>
      </div>
      <FlowIndex cur={cur}/>
    </Nav.Provider>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- Bootstrap: manual Babel transform, classic runtime, no ES modules -->
<script>
(function () {
  function fail(msg) {
    document.getElementById("root").innerHTML =
      '<div style="max-width:360px;margin:80px auto;font-family:\'Circular Std\',sans-serif;color:#333;text-align:center">'
      + '<h2>Could not start the prototype</h2><p style="color:#777">' + msg + '</p></div>';
  }
  if (!window.React || !window.ReactDOM || !window.Babel) {
    return fail("React / Babel failed to load from the CDN. An internet connection is needed the first time you open this file.");
  }
  try {
    var src = document.getElementById("app-src").textContent;
    // classic runtime => React.createElement, never `import {jsx} from 'react/jsx-runtime'`
    var out = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]]
    }).code;
    (0, eval)(out); // indirect eval => run in global scope
  } catch (e) {
    fail(String(e && e.message || e));
    throw e;
  }
})();
</script>
