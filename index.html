<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>[APP NAME] — wireframe</title>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  /* ── TYPEFACES ───────────────────────────────────────────────────────────
     Circular Std  → every piece of UI text (body 400, labels/names/buttons 500).
     Riccione Serial Light → DISPLAY HEADLINES ONLY (dashboard hero, moment
     screens). Never for UI text. Files are local; no webfont CDN. */
  @font-face{font-family:'Circular Std';src:url('fonts/CircularStd-Book.woff2') format('woff2');
    font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Circular Std';src:url('fonts/CircularStd-Medium.woff2') format('woff2');
    font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:'Circular Std';src:url('fonts/CircularStd-Bold.woff2') format('woff2');
    font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:'Riccione';src:url('fonts/Riccione-Serial-Light%20Regular.ttf') format('truetype');
    font-weight:400;font-style:normal;font-display:swap}

  :root{
    /* ── COLOUR — extracted from Figma "concept2" frames (see DECISIONS.md) ── */
    --bg:#EDEEE9;            /* milky off-white page                  (343:6)   */
    --bg2:#EFEFEF;           /* chat sheet / scrim                    (345:213) */
    --sage:#C9D6BC;          /* header pill + expanded hero flood     (343:60)  */
    --sage-deep:#6E845C;     /* DERIVED: readable sage for accents/active states */
    --sage-soft:#ACBA9F;     /* sage action text, "Customise"         (445:89)  */
    --accent:#6E845C;
    --ink:#050505;           /* body text                             (344:97)  */
    --serif-ink:#1E0C00;     /* display headline                      (344:125) */
    --icon:#1F1F1F;          /* icon strokes                          (mic/bell)*/
    --mut:rgba(5,5,5,.45);   /* timestamps / secondary — Figma 40% black        */
    --line:rgba(5,5,5,.12);
    --line2:rgba(5,5,5,.08); /* hairline divider — Figma black @10%   (350:235) */
    --card:#FFFFFF;
    --box:#E1E2DB;           /* DERIVED: warm neutral fill (tracks, tags)       */
    --input:#FFFAFA;         /* composer pill                         (344:74)  */
    --ava:#D9D9D9;           /* avatar placeholder                    (344:92)  */
    /* character-coded bubbles */
    --c-mary:#BCCAD7;        /* muted blue-grey        (Ellipse 19 fill) */
    --c-felix:#E3D2CA;       /* dusty terracotta       (Ellipse 20 fill) */
    --c-gosha:#E0D3B8;       /* DERIVED: warm sand/ochre — third tone     */
    --c-vera:#CBD5C9;        /* DERIVED: soft sage-grey                   */
    --c-basil:#D3D0DC;       /* DERIVED: muted lavender-grey              */
    --c-me:#FFFFFF;          /* user messages          (Ellipse 21 fill) */
    /* plants-overview card fills — two-stop gradients from the mockup (364:585),
       each running from the character's tint into that pot's glow colour */
    --g-felix:linear-gradient(126.35deg,#E7D1C9 38.007%,#E2F7CF 115.19%);
    --g-mary:linear-gradient(126.35deg,#B9CBD8 38.007%,#E39B84 115.19%);
    --g-gosha:linear-gradient(126.35deg,#D6D0BA 38.007%,#C3F5EE 115.19%);
    /* Vera's start stop was re-read off the current mockup (364:1078) — dusty
       pink, not the sage-grey the earlier frame carried */
    --g-vera:linear-gradient(113.89deg,#E7D1C9 38.007%,#E7FCD6 115.19%);
    --g-vlad:linear-gradient(113.89deg,#B9CBD8 38.007%,#E7FCD6 115.19%);

    /* ── TYPE SCALE — LOCKED to the two Figma frames. Four sizes, no others. ── */
    --t-sm:13px;             /* names, timestamps, labels, meta   (344:95)  */
    --t-md:16px;             /* body, buttons, inputs             (344:97)  */
    --t-lg:22px;             /* display headline, collapsed       (344:125) */
    --t-xl:44.7px;           /* display headline, expanded        (345:215) */

    /* ── RADII ── */
    --r-pill:36px;           /* header pill            (343:60)  */
    --r-input:37px;          /* composer pill 36.932px (344:74)  */
    --r-btn:28px;            /* white pill button      (345:216) */
    --r-sheet:36px;          /* chat sheet top corners (345:213) */
    /* the canonical settings/data-card radius — every white card in the app,
       lifted off the Plant Detail mockup (415:1433/1499/1512) */
    --r-card:40px;
    --r-sub:28px;            /* DERIVED: small cards nested inside a card */

    /* ── MOTION ── gentle ease-out-back for the hero (gets there fast, settles
       with a 2% overshoot); plain soft ease-out for everything reversing out. */
    --spring:cubic-bezier(.16,.84,.28,1.02);
    --soft:cubic-bezier(.22,1,.36,1);
    /* Organic blob bubble: four different large radii, tight corner by the avatar.
       Derived from the Ellipse 19/20/21 vectors (near-half-height corners). */
    --bub:10px 56px 44px 64px / 10px 44px 60px 52px;
    --bub-me:56px 10px 64px 44px / 44px 10px 52px 60px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#262521;
    font-family:'Circular Std',-apple-system,sans-serif;
    color:var(--ink)}
  /* form controls don't inherit type by default — route them to Circular too */
  input,button,textarea,select{font-family:inherit}
  /* Shell canvas: center the phone both axes. `safe center` falls back to
     top-alignment when the viewport is shorter than the phone, so it never
     clips out of reach — the page just scrolls. */
  #root{display:flex;justify-content:center;align-items:safe center;
    min-height:100vh;padding:24px 12px;box-sizing:border-box}

  /* phone frame — simplified iPhone mockup: dark body + bezel, dynamic island,
     status bar. This is prototype-shell chrome, NOT wireframe app UI. */
  .phone{width:412px;max-width:100%;height:844px;background:#0c0c0c;
    border-radius:56px;padding:13px;position:relative;display:flex;flex:0 0 auto}
  .device{flex:1;background:var(--bg);border-radius:44px;overflow:hidden;
    position:relative;display:flex;flex-direction:column;
    transition:background .46s cubic-bezier(.22,.9,.28,1)}
  .device:has(.dash.open){background:var(--sage)}
  /* dynamic island */
  .island{position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:112px;height:31px;background:#000;border-radius:16px;z-index:60}
  /* status bar — constant device chrome, solid ink (never dashed/wireframe) */
  .statusbar{flex:0 0 auto;height:48px;display:flex;align-items:center;
    justify-content:space-between;padding:0 26px;color:var(--ink);
    position:relative;z-index:40}
  /* the plant detail runs its photo under the status bar, so the device chrome
     goes white there — the only screen that needs it */
  .device:has(.pdscreen) .statusbar{color:#fff}
  .sb-time{font-size:var(--t-sm);font-weight:500;letter-spacing:.02em}
  .sb-right{display:flex;align-items:center;gap:6px}
  .sb-right svg{display:block}
  .screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 16px 24px;
    display:flex;flex-direction:column;gap:14px}
  .screen::-webkit-scrollbar{width:0}

  /* header */
  .topbar{display:flex;align-items:center;gap:10px;min-height:32px}
  .topbar h1{font-size:var(--t-lg);margin:0;font-weight:500;flex:1;letter-spacing:-.01em}
  .back{border:none;background:var(--card);border-radius:999px;
    padding:8px 14px;font-size:var(--t-sm);cursor:pointer;color:var(--ink)}
  .back:active{background:var(--box)}
  .kicker{font-size:var(--t-sm);letter-spacing:.04em;
    color:var(--mut);font-weight:500}

  /* [APP NAME] placeholder chip — name is undecided */
  .brand{display:inline-block;font-size:var(--t-sm);font-weight:500;letter-spacing:.04em;
    color:var(--mut);background:var(--box);
    border-radius:999px;padding:2px 9px}

  /* generic */
  .muted{color:var(--mut)}
  .center{text-align:center}
  .row{display:flex;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .grow{flex:1}
  h2{font-size:var(--t-md);margin:0 0 2px;font-weight:500}
  p{margin:0;line-height:1.4;font-size:var(--t-md)}
  small{font-size:var(--t-sm)}
  b,strong{font-weight:500}
  /* DISPLAY headline — the only place Riccione is allowed outside the dashboard:
     centred hero titles on the "moment" screens (first meeting, alert, thank-you). */
  .display{font-family:'Riccione',Georgia,serif;font-weight:400;color:var(--serif-ink);
    letter-spacing:0}

  .card{background:var(--card);border:none;border-radius:var(--r-card);
    padding:20px 22px}
  .card.tap{cursor:pointer}
  .card.tap:active{background:#f4f4f1}

  /* ── SETTINGS / DATA CARD — the canonical surface (Figma 415:1426) ─────────
     White, 40px radius, no shadow, 24px inset. Titles and values are Riccione;
     labels are Circular 16px at black 40%. This is the one card style for every
     settings / data surface in the app — plant detail, profile, plant settings,
     notifications. It sets surface + radius + type ROLES only; each screen keeps
     its own layout and content. */
  .scard{background:var(--card);border:none;border-radius:var(--r-card);padding:24px}
  .scard-t{font-family:'Riccione',Georgia,serif;font-weight:400;font-size:var(--t-lg);
    line-height:1.18;color:var(--serif-ink);margin:0}
  .scard-l{font-size:var(--t-md);color:#050505;opacity:.4;line-height:1.25}
  .scard-v{font-family:'Riccione',Georgia,serif;font-weight:400;font-size:var(--t-lg);
    line-height:1.18;color:var(--serif-ink)}
  .scard-v.xl{font-size:var(--t-xl);line-height:1.16}
  /* rolled onto the existing settings screens: a card tagged .scard promotes its
     row titles to the serif role and its captions to the 16px muted label role,
     without touching the markup around them */
  .card.scard b{font-family:'Riccione',Georgia,serif;font-weight:400;
    font-size:var(--t-lg);line-height:1.2;color:var(--serif-ink)}
  .card.scard small.muted{font-size:var(--t-md);color:rgba(5,5,5,.4)}
  /* the bond / progress bar from the mockup: 8px, page-tint track, sage fill */
  .sbar{height:8px;background:var(--bg);border-radius:40px;overflow:hidden}
  .sbar > i{display:block;height:100%;background:var(--sage);border-radius:40px}

  /* placeholder boxes (photos / charts) */
  .ph{background:repeating-linear-gradient(45deg,#E4E5DE,#E4E5DE 8px,#DCDDD6 8px,#DCDDD6 16px);
    border:1px dashed var(--line);border-radius:18px;display:flex;
    align-items:center;justify-content:center;color:var(--mut);font-size:var(--t-sm);
    letter-spacing:.04em;font-weight:500;min-height:64px}
  .ph.round{border-radius:50%}

  /* photo avatar badge (emotion glyph sits on the photo, never replaces it) */
  .badge{position:absolute;top:4px;right:4px;min-width:26px;height:26px;padding:0 4px;
    border-radius:999px;border:none;background:#fff;display:flex;
    align-items:center;justify-content:center;
    font-size:var(--t-sm);color:var(--ink)}

  /* buttons — white / sage pills, matching the dashboard */
  .btn{display:block;width:100%;text-align:center;border-radius:999px;padding:17px;
    font-size:var(--t-md);font-weight:500;cursor:pointer;border:none;
    background:var(--card);color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--sage);color:var(--serif-ink)}
  .btn.ghost{background:transparent;color:var(--mut)}
  .btn.sm{padding:10px 16px;width:auto;font-size:var(--t-sm)}
  .btn[disabled]{opacity:.5;pointer-events:none}

  /* face (expressive moments only — reactions, alerts) */
  .face{width:var(--fs,56px);height:var(--fs,56px);border-radius:50%;
    border:none;background:var(--card);display:flex;align-items:center;
    justify-content:center;font-size:var(--ff,18px);
    flex:0 0 auto;color:var(--ink)}
  .face.big{--fs:120px;--ff:40px}
  .face.accent{background:var(--sage)}

  /* header icon buttons + user avatar */
  .iconbtn{width:38px;height:38px;border-radius:50%;border:none;
    background:var(--card);display:flex;align-items:center;justify-content:center;
    font-size:17px;cursor:pointer;flex:0 0 auto;position:relative}
  .iconbtn:active{background:var(--box)}
  .ndot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;
    background:var(--icon);border:2px solid var(--ava)}

  /* status dot / pill */
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 auto}
  .dot.ok{background:var(--sage-deep)}
  .dot.warn{background:#B08968}
  .pill{display:inline-flex;align-items:center;gap:6px;border:none;
    border-radius:999px;padding:6px 12px;font-size:var(--t-sm);background:var(--card)}
  .pill.accent{background:var(--sage);color:var(--serif-ink);font-weight:500}

  /* list */
  .list{display:flex;flex-direction:column;gap:0}
  .li{display:flex;gap:12px;align-items:center;padding:13px 4px;
    border-bottom:1px solid var(--line2)}
  .li:last-child{border-bottom:none}

  /* advice row (diagnosis) — a recommendation the POT senses, never a tickable task */
  .adv{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;
    border-bottom:1px solid var(--line2)}
  .adv:last-child{border-bottom:none}
  .adv .leaf{color:var(--sage-deep);font-size:var(--t-sm);line-height:1.5;flex:0 0 auto}

  /* ── PLANTS OVERVIEW — inset card stack (Figma "concept2" 364:1065) ──
     Cards are 192px tall on a 140px step, so 140px of every card shows and the
     last one stands taller. 40px top corners only — every bottom is tucked under
     the next card. Cards paint in DOM order, which is what makes the stack read
     as a stack: no z-index anywhere, because nothing needs to escape any more. */
  .plhead{display:flex;align-items:center;gap:5px;margin:13px -2px 0;flex:0 0 auto;
    min-height:52px}   /* the title's own height, held when there is no title */
  .plback{width:24px;height:24px;flex:0 0 auto;cursor:pointer;opacity:.4;
    display:flex;align-items:center;justify-content:center}
  .plback:active{opacity:.75}
  .pltitle{flex:1;margin:0;font-family:'Riccione',Georgia,serif;font-weight:400;
    color:var(--serif-ink);font-size:var(--t-xl);line-height:1.16;letter-spacing:0}
  .pladd{flex:0 0 auto;background:#fff;border:none;border-radius:var(--r-btn);
    padding:15px 24px;font-size:var(--t-md);color:var(--ink);cursor:pointer}
  .pladd:active{transform:translateY(1px)}

  /* the mockup insets the stack 5px from each side of the 402px frame, so the
     -11px cancels 16px of screen padding down to 5. The negative bottom cancels
     the screen's padding so the last card runs off the bottom edge instead of
     ending on a strip of page. */
  .pstack{display:flex;flex-direction:column;flex:1 0 auto;margin:0 -11px -24px}
  /* The card clips its own contents: a pot may not spill onto its neighbours.
     The radius and the shadow live on the CARD, not on the surface — an inner
     element's outward shadow would be eaten by this same overflow, while an
     element's own shadow is drawn outside its border box and survives. The
     gradient stays on the surface so the press feedback has something to act on. */
  .plcard{position:relative;flex:0 0 auto;height:192px;margin-top:-52px;
    cursor:pointer;color:var(--serif-ink);overflow:hidden;
    border-radius:40px 40px 0 0;box-shadow:0 -4px 60px rgba(61,61,61,.2)}
  .plsurface{position:absolute;inset:0;transition:filter .18s var(--soft)}
  .plcard:first-child{margin-top:0;box-shadow:none}
  .plcard:active .plsurface{filter:brightness(.965)}
  /* the last card (now Vlad) runs on to the bottom of the screen, as in the
     mockup — and it is the ONLY one that lets its plant break out past the card's
     top edge. Vera lost that privilege when Vlad was added below her, so her pot
     is clipped to her own card like everyone else's. */
  .plcard:last-child{flex:1 0 auto;height:250px;overflow:visible}
  /* mood chip — a soft filled pill, no outline. Figma (403:1345) fills it white
     and drops the WHOLE chip to 40%, so the fill and the word wash back into the
     card gradient together; that group opacity is the style, not two separate
     alphas. */
  .plchip{position:absolute;left:43px;top:14px;border:none;background:#fff;opacity:.4;
    border-radius:24px;padding:2px 10px 5px;font-size:var(--t-md);
    color:#000;line-height:1.25}
  /* species sits 80px down and the name 101px (Figma 364:1087 / 364:1093 against
     a card top of 135) — a 21px step, tighter than the 25px it used to be */
  .plspecies{position:absolute;left:43px;top:80px;font-size:var(--t-md);
    color:var(--ink);opacity:.4;line-height:1.25}
  /* a plant whose species IS its name (Basil) drops the duplicate label, so the
     name moves up into the space the species would have used */
  .plcard:not(:has(.plspecies)) .plname{top:80px}
  .plname{position:absolute;left:43px;top:101px;font-family:'Riccione',Georgia,serif;
    font-weight:400;font-size:var(--t-lg);line-height:1.18;color:var(--serif-ink)}
  /* the pot render: a WINDOW anchored on the card's right edge, holding a square
     1024px source offset inside it. Window box + inner offset are lifted straight
     off the mockup's image frames, so the crop matches per plant; the card's own
     overflow then does the rest. Windows sit before the chip/species/name in the
     DOM, so the text paints over the render without needing a z-index. */
  .plwin{position:absolute;overflow:hidden;pointer-events:none}
  .plwin img{position:absolute;display:block;max-width:none}
  /* the header sits above every pot, so nothing can ride up over the title */
  .plhead{position:relative;z-index:100}

  /* compact, secondary "+ add plant" tile — sits above the stack, not a peer of the plant cards */
  .addtile{border:1px dashed var(--line);border-radius:999px;background:transparent;
    color:var(--sage-deep);
    display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;
    font-size:var(--t-sm);font-weight:500;cursor:pointer;flex:0 0 auto}
  .addtile:active{background:var(--box)}
  .addtile .plus{font-size:var(--t-md);line-height:1;font-weight:400}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:2px}
  .pgdot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .pgdot.on{background:var(--sage-deep)}

  /* ══════════ PLANT DETAIL — full-bleed (Figma "concept2" 417:1537) ══════════
     A 402×874 frame, i.e. a whole iPhone 16 Pro screen: the photo/video is the
     BACKGROUND, edge to edge and behind the status bar, and everything else
     floats on it. Two anchors are in play and they must not be confused:

       · the nav bar, species row and bubble are TOP-anchored — their mockup y
         lands on the device y unchanged (title 69, chip 132, bubble 161).
       · the timeline and the cards are BOTTOM-anchored, because the mockup's
         874px frame is 56px taller than this 818px device. Measured up from the
         frame's bottom edge they are: labels 190, rail 159, bond card 134,
         stat-card tops 12 — that last one is the "peeking" the brief asks for,
         and it only survives if you anchor from the bottom.

     The photo never scrolls. Everything else lives in one scroller that rides
     over it, so the cards climb the photo to reveal the stats and the toggle. */
  .pdscreen{flex:1 1 auto;position:relative;overflow:visible}

  /* ── the fixed photo layer ────────────────────────────────────────────────
     top:-48px reaches back up over the status bar, which is what makes the
     bleed reach the actual top of the screen; .device's own overflow+radius
     clip it back to the phone. */
  /* Whatever the film does not cover is simply the page. Nothing is painted
     over the film's bottom edge here any more — rev 30's .pdresolve is gone
     (see the note where it used to live), so the progressive blur under the
     cards is this screen's whole treatment, exactly as it was before. */
  .pdbg{position:absolute;left:0;right:0;top:-48px;bottom:0;overflow:hidden;
    background:var(--bg);z-index:0}

  /* ── the two films ────────────────────────────────────────────────────────
     Both are framed exactly as the mockup frames "still 1": x=-27, 457×995 on
     a 402px frame, i.e. -6.716% / 113.681% of the device width. The sources are
     976×2124 (ratio .45951) against that rect's .45930 — the rect IS the film
     at scale, so height comes from the intrinsic aspect and nothing is cropped.
     aspect-ratio states it up front so the box is right before metadata lands.

     Vertical placement is the whole mechanic and it is TWO numbers off Figma:
       ·  -184px  428:1782 "still 1" — the default framing, shifted up so the
                  pot and its face fill the stage.
       ·     0px  437:90   "still 1" — flush with the top of the screen, which
                  is where the growth film plays.
     Y is carried on `transform`, not `top`, so the glide between the two is a
     compositor-only animation. A CSS transition of a FIXED duration is what
     drives it: interrupt it half-way and it re-runs over the same 420ms from
     wherever it stands, which is exactly what the reversal logic assumes. */
  .pdvid{position:absolute;left:-6.716%;top:0;width:113.681%;
    aspect-ratio:976 / 2124;display:block;border:0;background:transparent;
    pointer-events:none;transform:translate3d(0,0,0);
    -webkit-backface-visibility:hidden;backface-visibility:hidden}
  .pdvid-still{will-change:transform;
    transition:transform 420ms cubic-bezier(.33,.72,.26,1)}
  /* the growth film is parked at 0 forever and only ever fades; it sits above
     the still one in the stack, so a single opacity drives the cross-fade */
  .pdvid-grow{opacity:0;will-change:opacity;transition:opacity 180ms linear}

  /* ── WHERE THE RESOLVE USED TO BE (458:65) ────────────────────────────────
     Rev 30 laid 88px of transparent-into-page over the film's bottom edge here,
     welded to it by the film's own box and transform. It is removed: as the
     cards climb the film the band reads as a second, competing edge over the
     one the blur is already softening, and two treatments doing one job is one
     too many. The progressive blur below is the whole of it now.
     Personality & Settings keeps its resolve — that screen has no blur, and
     there the band IS the treatment rather than a rival to one. */

  /* ── PROGRESSIVE BLUR UNDER THE CARDS ─────────────────────────────────────
     Four stacked backdrop-filters, each masked in over its own band, so the
     blur RAMPS instead of starting at an edge. Sibling backdrop-filters
     compose — layer 2 blurs what layer 1 already blurred — which is what turns
     four discrete radii into one continuous curve.

     It lives inside .pdbg, under the films, NOT in the scroller. Two reasons:
     the backdrop it samples is then unambiguously the film and nothing else
     (the timeline text rides in .pdscroll above it and is never touched), and
     its Y can be driven straight from the cards' measured position, which is
     what "tracks the cards live during scroll" asks for.

     `top` is written by syncBlur() on every scroll frame: the cards' own top
     edge minus PD_BLUR_LEAD. The lead is why there is no hard edge — the ramp
     has already started, gently, before the first card arrives. */
  .pdblur{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
  /* Opacity lives on each LAYER, never on the wrapper. An element with
     opacity < 1 forms a Backdrop Root for its descendants, so fading the parent
     would leave the children with an empty backdrop and blur nothing at all.
     On the element that carries the backdrop-filter itself it is exactly the
     cross-fade we want: the filtered result composited over the raw backdrop. */
  .pdblur > i{position:absolute;left:0;right:0;bottom:0;display:block;opacity:0}
  /* Mask ramps are measured from .pdblur's top, i.e. from PD_BLUR_LEAD above
     the cards' own edge, so the ramp is already under way before the first card
     arrives — that is what removes the hard edge. Radii compound as
     sqrt(a²+b²…) because each layer blurs what the one before it left. */
  /* All four layers now start INSIDE the lead, i.e. above the cards, because
     that band is the only part of the ramp anyone can see — under the cards the
     film is behind opaque white. Rev 25 spent two of its four layers below the
     card edge and the visible ramp was correspondingly thin. */
  .pdblur > i:nth-child(1){top:0;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 110px);
            mask-image:linear-gradient(180deg,transparent 0,#000 110px)}
  .pdblur > i:nth-child(2){top:34px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 120px);
            mask-image:linear-gradient(180deg,transparent 0,#000 120px)}
  .pdblur > i:nth-child(3){top:80px;
    -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 130px);
            mask-image:linear-gradient(180deg,transparent 0,#000 130px)}
  .pdblur > i:nth-child(4){top:150px;
    -webkit-backdrop-filter:blur(48px);backdrop-filter:blur(48px);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 140px);
            mask-image:linear-gradient(180deg,transparent 0,#000 140px)}
  /* Effective radius (they compound as √Σr²) measured from the cards' own top
     edge, which sits PD_BLUR_LEAD = 150px into the ramp:
        150px above the edge  ≈  0px   — the ramp's own start, no seam
         60px above the edge  ≈  9px
        at the edge           ≈ 21px   — rev 25 read 7px here
        deep under the cards  ≈ 57px   — rev 25 topped out at 40px */

  /* ── the static header layer ──────────────────────────────────────────────
     The nav row, species + mood chip and the speech blob used to be a
     position:sticky block INSIDE the scroller. Sticky holds a rest position
     only within the scroll range — a rubber-band overscroll is outside it, so
     the whole header travelled with the bounce. Lifting it out of the scroller
     entirely is the only way to make it truly immovable, and it is why the
     bounce now belongs to the cards alone.
     8px/16px reproduce the scroller's own padding so nothing shifts, and
     pointer-events:none hands the empty header area back to the scroller
     underneath, so a drag anywhere on the film still scrolls the cards. */
  .pdhead{position:absolute;left:0;right:0;top:0;z-index:2;padding:8px 16px 0;
    display:flex;flex-direction:column;pointer-events:none}
  .pdhead .plback,.pdhead .plmore,.pdhead .plmorewrap,
  .pdhead .pdmenu{pointer-events:auto}
  /* .plback carries opacity .4 by default but .plmore never did — it only ever
     appeared on light screens where it was already dark enough. 428:1809 comes
     back black at .4 like the chevron, so it is set here rather than on the
     shared rule, which the other screens use unchanged. */
  .pdhead .plmore{opacity:.4}
  .pdhead .plmore:active{opacity:.75}

  /* ── the scrolling layer ──────────────────────────────────────────────────
     inset:0 gives it a definite height, which is what lets .pdspacer size
     itself as a percentage and pin the lower block to the bottom edge.
     overscroll-behavior keeps the rubber-band from chaining out to the page. */
  .pdscroll{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;
    overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
    padding:8px 16px 0;display:flex;flex-direction:column}
  .pdscroll::-webkit-scrollbar{width:0}
  /* 190 is the labels' offset up from the bottom edge, and with the header gone
     from this box it is the whole of the constant: the lower block still opens
     at device 628. Total content height is unchanged (the 221px the header took
     came straight back out of the spacer), so the scroll range is the same. */
  .pdspacer{flex:0 0 auto;height:calc(100% - 190px);min-height:24px}
  .pdlower{flex:0 0 auto}

  /* ── THE ⋯ POPOVER ────────────────────────────────────────────────────────
     It used to be `top:104px;right:14px` against .pdhead — a SCREEN coordinate
     that merely happened to land near the ⋯, and drifted away from it whenever
     the header did. The menu now lives inside .plmorewrap, a zero-cost
     positioning shell around the icon, so its offsets read as what a popover
     actually is: `top:calc(100% + 10px); right:0` = ten pixels under the icon,
     right edges flush. The shell exists because .plmore itself carries
     opacity .4 on this screen — nesting the menu inside the icon would have
     faded the menu to 40% along with it. */
  .plmorewrap{position:relative;display:flex;flex:0 0 auto}
  .pdmenu{position:absolute;top:calc(100% + 10px);right:0;z-index:120;
    background:var(--card);
    border:none;border-radius:var(--r-sub);min-width:214px;overflow:hidden;
    box-shadow:0 10px 40px rgba(30,12,0,.14)}
  .pdmenu > div{padding:14px 18px;font-size:var(--t-md);cursor:pointer;
    border-bottom:1px solid var(--line2)}
  .pdmenu > div:last-child{border-bottom:none}
  .pdmenu > div:active{background:var(--box)}
  /* the ⋯ button sits opposite the chevron, on the title's baseline row */
  .plmore{width:24px;height:24px;flex:0 0 auto;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .plmore:active{opacity:.5}

  /* The nav is no longer white-on-a-scrim. With the top gradient gone (428:1782
     has none) the mockup sets the whole row in ink over the bright film, and
     every value it uses is already this file's default — title #1E0C00 is
     --serif-ink at --t-xl 44.7px against the mockup's 44.712, and both glyphs
     come back from Figma as black at opacity .4, which is .plback's own rest
     state. So the light-screen styles simply apply and there is nothing to
     override here any more. */

  /* species (left) + mood chip (right), 428:1824 / 428:1816. The species is
     #050505 at 40% — the same treatment as the light screens, now that the
     background is bright. The 29px indent lines it up under the title rather
     than under the chevron (mockup x=43 against a 14px chevron), and the 5px
     top offset is the mockup's own gap between the chip top (121) and the
     species baseline box (126). */
  /* margin-top 0: the mockup butts this row straight onto the title's box —
     title 69+52 = 121 is exactly the chip's top. The old 11px belonged to the
     old 27px chip; the chip is 33 now and the row moved up with it. */
  .pdrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    margin:0 -2px;min-height:33px;flex:0 0 auto;position:relative;z-index:5}
  .pdsp{margin-left:29px;font-size:var(--t-md);color:var(--ink);opacity:.4;
    line-height:1.25;padding-top:5px}
  /* 428:1816 — a 73×33 pill: 16px text in a 14px side padding, 5 over and 8
     under, radius 24, and a 15px glow in the SAME hex as the fill */
  .moodchip{border:none;border-radius:24px;padding:5px 14px 8px;font-size:var(--t-md);
    color:#000;line-height:1.25;flex:0 0 auto}

  /* speech blob — the mockup's Ellipse 18 path, painted by blobBg(). No quote
     marks: the shape already says it is speech. */
  /* 7px puts the blob's top on the mockup's 161 (121 + the 33px chip + 7). It
     had to be re-derived anyway once the row above it moved. */
  /* The blob is a "now, at rest" object: it belongs to the live plant, so it
     goes away the moment you scrub into the past or pull the cards up over the
     film. It fades and settles rather than cutting — 230ms ease-out, a 8px rise
     and a 4% shrink, played in both directions off one class. transform-origin
     is the TOP centre so the shrink reads as the blob withdrawing towards the
     plant rather than collapsing into thin air. Opacity, not display: the box
     keeps its size, so nothing under it in .pdhead ever moves. */
  /* ARRIVING is a keyframe, not a transition, because the overshoot has to be
     stated: 300ms that carries the blob 3.5% past full size and settles back.
     A back-out cubic on a .96 → 1 transition would have overshot by 0.4% — the
     spring is real but there is almost no travel for it to spring over.
     LEAVING keeps rev 26's plain ease-out: the .off rule brings its own
     transition, and a transition is what runs when a class is ADDED, so the two
     directions never borrow each other's curve. */
  .pdbubwrap{position:relative;margin:7px -16px 0;display:flex;justify-content:center;
    flex:0 0 auto;transform-origin:50% 0;
    transition:opacity 230ms ease-out,transform 230ms ease-out}
  .pdbubwrap:not(.off){animation:pdbubpop 300ms cubic-bezier(.22,1,.36,1) both}
  .pdbubwrap.off{opacity:0;transform:translateY(-8px) scale(.96);pointer-events:none}
  @keyframes pdbubpop{
    0%  {opacity:0;transform:translateY(-8px) scale(.94)}
    55% {opacity:1;transform:translateY(0)     scale(1.035)}
    100%{opacity:1;transform:translateY(0)     scale(1)}
  }
  .pdbub{position:relative;width:277px;max-width:calc(100% - 32px);min-height:116px;
    background-size:100% 100%;background-repeat:no-repeat;
    padding:26px 29px;font-size:var(--t-md);line-height:1.28;text-align:center;
    color:var(--ink);display:flex;align-items:center;justify-content:center}

  /* ── TIMELINE SCRUB (437:93 — the reworked rail) ──────────────────────────
     Rebuilt from the three reference states. Every number is measured on the
     mockup's own 402px frame:

       words       16px white. The stop you are standing on is at 100%, every
                   other word at 60% — 444:71 "thriving" against 444:21 "now",
                   441:576 "now" against 441:577 "seed". A flat opacity, not a
                   gradient: that is what the file says.
       label box   684 → 704, then a 5px gap to the rail band's top at 709.
       rail band   16px, the thumb's own height; the line's centre at 717.
       line        2px, PURE WHITE, and broken: a pixel probe across 441:633 at
                   y 716 reads white … 2px gap … thumb … 2px gap … white. It
                   stops 5px short of a dot's centre and 10px short of the
                   thumb's, i.e. 2px clear of both edges.
       dots        6px, white, centres at 17 and 385 → a 17px inset.
       thumb       16px, white.

     There is no track/fill pair any more. The rail is one colour end to end and
     the GAPS, not a tint, are what mark the stops — which is also why the line
     is drawn as segments between holes (see PlantDetail) rather than as a bar. */
  .pdtimeline{position:relative;margin:0 -16px;padding:0 14px;
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .pdtimeline:active{cursor:grabbing}
  /* Nothing inside may take a pointer. The press is picked up by the wrapper
     wherever it lands — on a dot, on the line, on a word, on the empty band
     around them — which is what makes the WHOLE length draggable instead of
     just the dots. */
  .pdtimeline *{pointer-events:none}
  .pdtllab{position:relative;height:20px;margin-bottom:5px}
  /* every word is always mounted, so arriving at a stop is a fade and not a
     pop; the two ends rest at .6 and the middle words rest at 0 */
  .pdtllab span{position:absolute;white-space:nowrap;font-size:var(--t-md);
    line-height:1.25;color:#fff;opacity:.6;transition:opacity 200ms ease-out}
  .pdtllab span.mid{opacity:0}
  .pdtllab span.on{opacity:1}
  .pdtlrail{position:relative;height:16px;margin:0 3px}
  .pdtlseg{position:absolute;top:7px;height:2px;border-radius:2px;background:#fff}
  .pdtldot{position:absolute;top:5px;width:6px;height:6px;margin-left:-3px;
    border-radius:50%;background:#fff}
  .pdtlthumb{position:absolute;top:0;width:16px;height:16px;margin-left:-8px;
    border-radius:50%;background:#fff}
  /* ── the drag indicator ───────────────────────────────────────────────────
     A soft white halo that blooms under the thumb the moment the rail is
     picked up and dissolves on release, so a scrub in progress is legible even
     when the thumb is standing still. It is drawn BEFORE the thumb, so the
     thumb keeps its hard 16px edge and the halo only spreads around it. Kept to
     a halo rather than a bubble because the rail's own bottom (725) sits 15px
     above the bond card — there is no room under it for anything with a box,
     and a glow is already this file's language for "active" (.moodchip). */
  .pdtlhalo{position:absolute;top:-9px;width:34px;height:34px;margin-left:-17px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.5) 0%,
      rgba(255,255,255,.34) 42%,rgba(255,255,255,0) 72%);
    opacity:0;transform:scale(.5);
    transition:opacity 200ms ease-out,transform 200ms ease-out}
  .pdtimeline.drag .pdtlhalo{opacity:1;transform:scale(1)}

  /* ── INFO CARDS ───────────────────────────────────────────────────────────
     The mockup insets them 5px from a 402px frame and stacks them on a 5px gap;
     -11px cancels the screen's 16px padding down to that 5. The 15px top margin
     is the mockup's own gap between the rail band (bottom 725, the thumb's own
     edge) and the bond card (740); the 24px bottom lets the auto-watering card
     clear the edge once the sheet is scrolled all the way up. */
  .pdcards{display:flex;flex-direction:column;gap:5px;margin:15px -11px 24px;
    flex:0 0 auto}
  .pdbondmeta{display:flex;align-items:center;gap:8px;margin:1px 0 14px}
  .pdsep{width:4px;height:4px;border-radius:50%;background:#050505;opacity:.2;
    flex:0 0 auto}
  .pdstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
  .pdstat{position:relative;overflow:hidden;background:var(--card);
    border-radius:var(--r-card);padding:24px 8px;text-align:center;min-height:125px}
  .pdstat .scard-l{margin-bottom:5px;position:relative}
  .pdstat .scard-v{position:relative}
  /* reservoir level — the mockup's own wave path, stretched to the fill height */
  .reswater{position:absolute;left:-9%;right:-9%;bottom:0;pointer-events:none;
    background-repeat:no-repeat;background-size:100% 100%}
  /* ── AUTO-WATERING (445:85) ───────────────────────────────────────────────
     Four rows in a 392×144 card on .scard's own 24px padding, and every inner
     gap is the mockup's: title box 1016→1042, the schedule line at 1043 (so a
     single pixel under it), the hairline at 1077, "Customise" at 1092, card
     bottom 1136. That makes both gaps around the rule exactly 14px.
     The schedule is the same muted ink as every other secondary label on this
     screen — rgba(5,5,5,.4), i.e. .scard-l — and the rule is black at 10%. */
  .pdauto{display:flex;align-items:center;justify-content:space-between;gap:10px}
  /* Everything under the title row belongs to auto-watering being ON: with the
     toggle off there is no schedule to state and nothing to customise, so the
     card collapses to its title row: 76px, .scard's two 24s round a row whose
     height is the 28px toggle's rather than the 26px of serif beside it.
     max-height rather than a grid-row or auto: the block's height is known and
     fixed (1 + 20 + 14 + 1 + 14 + 20 = 70), so a hard number is honest here and
     works everywhere, and overflow:hidden also gives the block its own BFC so
     .pdautosub's 1px margin cannot collapse out of it. */
  .pdautomore{overflow:hidden;max-height:80px;opacity:1;
    transition:max-height 200ms ease-out,opacity 200ms ease-out}
  .pdautomore.off{max-height:0;opacity:0;pointer-events:none}
  .pdautosub{margin-top:1px;font-size:var(--t-md);line-height:1.25;
    color:rgba(5,5,5,.4)}
  .pdautodiv{height:1px;margin-top:14px;background:rgba(5,5,5,.1)}
  /* the row, not just the word, is the tap target — invisible either way, and
     a 328px-wide target is the kind a thumb actually hits */
  .pdautoact{margin-top:14px;font-size:var(--t-md);line-height:1.25;
    color:var(--sage-soft);cursor:pointer}
  .pdautoact:active{opacity:.55}

  /* the plant + pot placeholders and the blob bubble the CREATE-CHARACTER hero
     and the plant-settings preview still build on */
  .pdplant{width:148px;border-radius:16px 16px 6px 6px;min-height:0}
  .pdpot{position:relative;border:none;border-radius:7px 7px 24px 24px;
    background:repeating-linear-gradient(45deg,#DCDDD6,#DCDDD6 8px,#D2D3CC 8px,#D2D3CC 16px);
    display:flex;align-items:center;justify-content:center;color:var(--ink);
    font-weight:500;letter-spacing:.05em}
  /* speech bubble on the photo — organic blob, same language as the chat */
  .pdspeech{position:relative;max-width:280px;background:var(--c-me);border:none;
    border-radius:var(--bub);padding:14px 16px;font-size:var(--t-md);line-height:1.3;
    text-align:center}

  /* ══════════ AUTO-WATERING SETTINGS (Figma "concept2" 447:131) ══════════
     A plain page — 447:197 reads #EDEEE9 at every corner and every margin, so
     the film that frames its two neighbours is deliberately absent here. Just
     the unified nav, two labelled choices and a Save.

     The mockup frame is 402×874 against this 386×818 device: the title and the
     groups are top-anchored so their y carries over unchanged, and Save is
     bottom-anchored (850 of 874 = 24 from the foot) so it comes off the bottom. */
  .awscreen{flex:1 1 auto;display:flex;flex-direction:column;
    padding:8px 16px 24px;overflow-y:auto;overflow-x:hidden}
  .awscreen::-webkit-scrollbar{width:0}
  /* 40px under the title's own box (69 + 52 = 121 → 161), and 40 between the
     groups (161 + 129 = 290 → 330). -11px cancels the screen's 16 down to the
     5px inset every card in this app is drawn on. */
  .awbody{margin:40px -11px 0;display:flex;flex-direction:column;gap:40px;
    flex:0 0 auto}
  .awgroup{display:flex;flex-direction:column;gap:14px}
  /* 447:234 pads the label row by 9, which lands the text on the device's 14 */
  .awlab{padding:0 9px;font-size:var(--t-md);line-height:1.25;color:var(--ink)}
  /* minmax(0,1fr), not 1fr: the middle card carries "best choice", which is
     wider than "1 day", and a bare 1fr floors each track at its content — the
     three cards came out 118/131/118 instead of the mockup's three equal 127. */
  .awopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;
    height:95px}
  /* 24px of padding round 26 + 1 + 20 of type is the mockup's own 95 */
  .awopt{background:var(--card);border-radius:40px;cursor:pointer;padding:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;transition:background 160ms ease-out}
  .awopt.on{background:var(--sage)}
  .awopt b{font-family:'Riccione',Georgia,serif;font-weight:400;
    font-size:var(--t-lg);line-height:1.18;color:var(--serif-ink);white-space:nowrap}
  .awopt small{font-size:var(--t-md);line-height:1.25;color:rgba(5,5,5,.4);
    white-space:nowrap}
  /* (447:238's Save is gone from both settings screens — every pick applies on
     the tap. The wide sage action it drew lives on in .actbtn, which the Add
     Plant flow needs and which is the same button: --sage, radius 28, 15px of
     padding round a 16px centred line in --ink.) */

  /* ══════════ PROFILE (460:144) ══════════
     The same plain page the auto-watering screen is: no film, the unified nav,
     and the canonical cards. 460:145 does carry a still of the pot, but the
     frame renders flat #EDEEE9 over every inch of it — it is a hidden layer,
     not a background, and the render is what is built.

     The whole screen is one rhythm and both numbers are the mockup's: 40px
     between sections (title box 121 → card 161, card 256 → header 296, seg 579
     → header 619, last card 889 → Log out 929) and 14px inside one (header 348
     → card 362, card 436 → label 450, label 470 → seg 484, card 780 → card
     794). -11px cancels the screen's 16 back to the 5px inset every card in
     this app is drawn on, exactly as .awbody does. */
  .pfscreen{flex:1 1 auto;display:flex;flex-direction:column;
    padding:8px 16px 24px;overflow-y:auto;overflow-x:hidden}
  .pfscreen::-webkit-scrollbar{width:0}
  .pfbody{margin:40px -11px 0;flex:0 0 auto}
  .pfsec{margin-top:40px}
  /* identity (460:201/208) — 95px is 24 of padding round a 47px row: a 40px
     avatar, 14px, then the name over the plant count. The count is the way into
     the plants list, so the whole card is the target. */
  .pfme{height:95px;padding:0 24px;background:var(--card);
    border-radius:var(--r-card);display:flex;align-items:center;gap:14px;
    cursor:pointer}
  .pfme:active{background:var(--box)}
  .pfava{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto}
  /* 460:183/187 — the same title/subtitle pair the Quiet-hours card sets,
     reused verbatim so every settings card across both screens is one object:
     .psqt over .psqsub, on 24px of padding, in a 95px card. */
  /* .psrowcard carries a 5px top margin for the settings screen's own stack;
     here the header's 14px is the whole gap, so the borrowed card gives it up */
  .pfsec .psrowcard{margin-top:0}
  .pfrow{min-height:95px;padding:24px;background:var(--card);
    border-radius:var(--r-card);margin-top:14px;cursor:pointer}
  .pfsec .pfrow:first-of-type{margin-top:0}
  .pfrow:active{background:var(--box)}
  /* 460:209 — --card at radius 28 round a centred 16px line, in the coral the
     palette already carries as Mary's second gradient stop. Not a --sage Save:
     this is the only destructive thing on the screen. */
  .pflogout{display:block;width:100%;margin-top:40px;background:var(--card);
    border:none;border-radius:var(--r-sub);padding:15px;text-align:center;
    font-size:var(--t-md);line-height:1.25;color:#E39B84;cursor:pointer}
  .pflogout:active{transform:translateY(1px)}

  /* ══════════ NOTIFICATIONS ══════════
     The canonical settings card, carrying a notification: 24px of padding, a
     meta line, the message, and a --sage-soft action. The avatar is the chat's
     own — the 37.81px circle with the illustrated pot and its plant overhanging
     upwards.

     NO NAME ROW. The serif name said what the avatar already says and what the
     sentence under it says again — three times in a 326px card. Losing it makes
     the MESSAGE the primary line, which is the thing you are actually being
     notified about, and the card drops from three type roles to two.

     The card does NOT clip that overhang. Mary's leaves reach 32px above her
     circle and about 8 of them clear the card, exactly as the plants list lets
     its pot renders break their cards; `position:relative` plus DOM order puts
     each card's overhang over the card above it rather than under. */
  .nfscreen{flex:1 1 auto;display:flex;flex-direction:column;
    padding:8px 16px 24px;overflow-y:auto;overflow-x:hidden}
  .nfscreen::-webkit-scrollbar{width:0}
  .nflist{margin:40px -11px 0;display:flex;flex-direction:column;gap:5px;
    flex:0 0 auto}
  .nfcard{position:relative;display:flex;gap:14px;padding:24px;
    background:var(--card);border-radius:var(--r-card);cursor:pointer}
  .nfcard:active{background:var(--box)}
  .nfbody{flex:1 1 auto;min-width:0}
  /* the meta line: the chip where there is one, and the time right-aligned to
     the card's own edge rather than floating beside the message. min-height is
     the chip's own 22, held on the cards that have no chip, so all three keep
     the same internal rhythm and the avatars line up down the list. */
  .nfmeta{display:flex;align-items:center;gap:8px;min-height:22px}
  .nftime{margin-left:auto;flex:0 0 auto;font-size:var(--t-sm);line-height:1.25;
    color:rgba(5,5,5,.4);white-space:nowrap}
  /* the mood chip the detail screen already uses, drawn small: an "Urgent" here
     is the same statement its glowing pill makes there */
  .nfchip{border:none;border-radius:24px;padding:2px 10px 4px;
    font-size:var(--t-sm);line-height:1.25;color:#000;flex:0 0 auto}
  /* the message is the card now: the UI face at body size, in --ink rather than
     the 40% grey it wore while a serif name was the headline above it. Not
     --t-sm: it would come out smaller than the action link under it, which is
     the wrong way round for the thing the card exists to say.
     6px under the meta line rather than 1 — the 1 was a serif name's own
     tight-set descender gap, and this is two separate lines of UI type. */
  .nftext{margin-top:6px;font-size:var(--t-md);line-height:1.25;
    color:var(--ink)}
  /* no chevron: it is a link, not a disclosure, and the whole card is the tap
     target anyway */
  .nfact{margin-top:14px;font-size:var(--t-md);line-height:1.25;
    color:var(--sage-soft)}

  /* ══════════ ADD NEW PLANT (465:312) ══════════
     Five frames, one shape: the pot's own film full-bleed behind everything, a
     back chevron and nothing else at the top, a centred serif line at 187, an
     optional muted line 14 under it, and the actions either following the text
     or sitting 40px off the bottom edge. Every frame renders flat #EDEEE9 — the
     457×818 still each one carries is a hidden layer, exactly as on Profile.

     66px is what puts the headline on the mockup's 187: the head box ends at
     121 (8 of screen padding + 13 of margin + its own 52), which is where every
     other screen's title box ends too. */
  /* overflow VISIBLE, and .apbg does the clipping — the detail screen's exact
     arrangement. With the clip on the screen instead, .apbg's -48 was simply
     cut off and every film in this flow started a status bar's height below the
     top edge, with a band of flat page above it. Now they are flush with the
     top of the device and run behind the status bar, which is what "full-bleed"
     has meant everywhere else in this app. */
  .apscreen{flex:1 1 auto;position:relative;display:flex;flex-direction:column;
    padding:8px 16px 40px;overflow:visible;background:var(--bg)}
  .apbg{position:absolute;left:0;right:0;top:-48px;bottom:0;overflow:hidden;
    background:var(--bg);z-index:0}
  /* bt.mp4 is 976×2124 and there is no window to place it in: drawn at the
     MOCKUP FRAME'S size — 402×874, from its top-left corner — its pot lands
     exactly on the 582px pot 462:262 draws. Measured, not assumed: the mockup's
     pot occupies x 65…337 / y 372…685 of the frame, the film's occupies
     x 158…819 / y 904…1681 of 976×2124, and 272/661 scales 976 to 401.6 and
     2124 to 874.0. The "image slot" is just where the pot falls in a full-bleed
     film.

     Sized by HEIGHT, and that is the whole reason this is a fixed 874 rather
     than width:100%: the device is 336×818 against the mockup's 402×874, so it
     is proportionally taller, and a film scaled to the width would ride 60px up
     the screen while the type — top-anchored at the mockup's own y, like every
     other screen here — stayed put. The headline landed on the pot. Pinning the
     film's height to the frame's keeps every vertical the mockup drew, and the
     33px it then overhangs either side is clipped by .apbg, exactly as the
     detail screen's 457px film is clipped to 402. */
  .apvid{position:absolute;left:50%;top:0;transform:translateX(-50%);
    height:874px;aspect-ratio:976 / 2124;
    display:block;border:0;background:transparent;pointer-events:none}
  /* 40px up. On every frame that shows the PAIRING film — the pot sat low once
     the film reached the top edge, and the three frames carry one continuous
     take, so shifting two of the three would make it jump on `ended` — and on
     the meeting screen, where the same 40px does the same job for the same
     reason. */
  .apvid.up40{top:-40px}
  .aphead{position:relative;z-index:1;flex:0 0 auto;height:52px;margin:13px -2px 0;
    display:flex;align-items:center}
  .aptitle{position:relative;z-index:1;flex:0 0 auto;margin:66px auto 0;
    max-width:310px;font-family:'Riccione',Georgia,serif;font-weight:400;
    color:var(--serif-ink);font-size:var(--t-xl);line-height:1.16;
    letter-spacing:0;text-align:center}
  .apsub{position:relative;z-index:1;flex:0 0 auto;margin:14px auto 0;
    max-width:310px;font-size:var(--t-md);line-height:1.25;
    color:rgba(5,5,5,.4);text-align:center}
  /* 374 of 402 is 14 either side, and -2 cancels the screen's 16 down to it.
     The stack is 5px apart (779 → 784) and sits 40px off the foot (834 → 874),
     which is this screen's own bottom padding. */
  .apacts{position:relative;z-index:1;flex:0 0 auto;margin:auto -2px 0;
    display:flex;flex-direction:column;gap:5px}
  .apacts.inflow{margin-top:40px}          /* 417 → 457 on the opening frame */
  .actbtn{display:block;width:100%;background:var(--sage);border:none;
    border-radius:var(--r-sub);padding:15px;text-align:center;
    font-size:var(--t-md);line-height:1.25;color:var(--ink);cursor:pointer}
  .actbtn.ghost{background:var(--card)}    /* 462:259, the secondary of the pair */
  .actbtn:active{transform:translateY(1px)}

  /* the steps the mockups stop short of, drawn in the same language ─────────
     the viewfinder: the app has no camera, so it draws the frame it would fill */
  .apframe{position:relative;z-index:1;flex:0 0 auto;margin:40px auto 0;
    width:280px;max-width:100%;height:340px;border-radius:var(--r-card);
    border:1px solid var(--sage-soft);background:rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;
    font-size:var(--t-md);line-height:1.25;color:rgba(5,5,5,.4)}
  /* the read photo — the app's own render of that species, in the card shape
     the rest of the flow is drawn in */
  .apshot{position:relative;z-index:1;flex:0 0 auto;margin:24px auto 0;
    width:240px;height:240px;border-radius:var(--r-card);overflow:hidden;
    background:var(--card)}
  .apshot img{display:block;width:100%;height:100%;object-fit:contain}
  /* the first-meeting bubble — the app's own pebble, drawn at reading size
     rather than the 193×89 the settings screen packs in beside its title */
  .apbub{position:relative;z-index:1;flex:0 0 auto;margin:24px auto 0;
    width:260px;max-width:100%;min-height:96px;
    background-size:100% 100%;background-repeat:no-repeat;
    padding:18px 26px;font-size:var(--t-md);line-height:1.3;text-align:center;
    color:var(--ink);display:flex;align-items:center;justify-content:center}
  /* the two scrolling steps borrow .pfscreen's shell; -11 is the same cancel
     .pfbody and .awbody make, back to the 5px inset every card is drawn on */
  .apbody{position:relative;z-index:1;margin:0 -11px}
  .apsec{margin-top:40px}
  .aplist{position:relative;z-index:1;margin:24px -11px 0;
    display:flex;flex-direction:column;gap:5px}
  /* the recognised photo, when it is a photo rather than a render: 4:3 portrait
     and cropped to fill, because a photograph has no transparent margin to sit
     politely inside one */
  .apshot.photo{width:240px;height:320px}
  .apshot.photo img{object-fit:cover}

  /* ── THE WORKING ELLIPSIS ─────────────────────────────────────────────────
     One dot, two, three, then all three go and it starts again — 450ms a step,
     1.8s a cycle. OPACITY, not content: the three dots are always in the line,
     so its width never changes and the centred headline never jumps as the
     animation runs. Three keyframe sets rather than one with delays, because
     each dot appears at its own moment but they all leave together, which a
     single set plus animation-delay cannot express. */
  .apdots{display:inline}
  .apdots i{font-style:normal;opacity:0;animation:apdot1 1.8s ease-in-out infinite}
  .apdots i:nth-child(2){animation-name:apdot2}
  .apdots i:nth-child(3){animation-name:apdot3}
  @keyframes apdot1{0%{opacity:0} 8%,72%{opacity:1} 80%,100%{opacity:0}}
  @keyframes apdot2{0%,25%{opacity:0} 33%,72%{opacity:1} 80%,100%{opacity:0}}
  @keyframes apdot3{0%,50%{opacity:0} 58%,72%{opacity:1} 80%,100%{opacity:0}}

  /* ══════════ CAMERA (417:1591) ══════════
     A full-bleed viewfinder and a shutter, and nothing else — the mockup draws
     no chrome at all. The film is sized by HEIGHT to the mockup frame's own 874
     and centred, the same rule the pairing film follows and for the same
     reason: it keeps every vertical the mockup drew on a device that is
     proportionally taller. 874 × 1176/1756 = 585.4, which is 472:319's own
     width to half a pixel. */
  .camscreen{flex:1 1 auto;position:relative;overflow:visible}
  /* the viewfinder reaches back over the status bar — 472:319 starts at the
     frame's own y 0 — so it needs its own clipping box, exactly as .pdbg is
     one for the detail screen's film. The screen itself must not clip, or the
     -48 would simply be cut off. */
  .cambg{position:absolute;left:0;right:0;top:-48px;bottom:0;overflow:hidden;
    background:#000;z-index:0}
  .camvid{position:absolute;left:50%;top:0;transform:translateX(-50%);
    height:874px;aspect-ratio:1176 / 1756;display:block;border:0;
    pointer-events:none}
  /* 472:315/316 — a 70px white disc inside an 84px ring of 2px white, both
     centred on the frame's 201 with the disc's own centre on 809. Anchored to
     the BOTTOM, at the 65px the mockup leaves under it (874 − 809), not to the
     top: the device is 818 tall against a 874 frame, so an absolute 809 would
     hang the shutter off the bottom edge. 65 − 42 = 23. */
  .camshutter{position:absolute;left:50%;bottom:23px;
    transform:translateX(-50%);width:84px;height:84px;border-radius:50%;
    padding:0;cursor:pointer;background:transparent;border:2px solid #FFF;
    display:flex;align-items:center;justify-content:center;z-index:2}
  .camshutter::after{content:"";width:70px;height:70px;border-radius:50%;
    background:#FFF;transition:transform 120ms ease-out}
  .camshutter:active::after{transform:scale(.88)}
  /* the chevron the mockup does not draw and the flow cannot do without —
     white, with a shadow, because what is behind it is a photograph */
  .camback{position:absolute;left:14px;top:37px;width:24px;height:24px;
    cursor:pointer;color:#FFF;z-index:2;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));
    display:flex;align-items:center;justify-content:center}
  .camback:active{opacity:.6}
  /* recognising — the app's own .spin geometry in white, so it reads on a
     photograph, over a scrim that dims the frozen frame just enough to say the
     viewfinder has stopped being live */
  .camwait{position:absolute;left:0;right:0;top:-48px;bottom:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;background:rgba(5,5,5,.45);color:#FFF;
    font-size:var(--t-md);line-height:1.25;
    text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .camwait > i{width:48px;height:48px;border-radius:50%;
    border:3px solid rgba(255,255,255,.35);border-top-color:#FFF;
    animation:spin .8s linear infinite}

  /* ══════════ PERSONALITY & SETTINGS — full-bleed (Figma 446:93) ══════════
     A 402×818 frame in the mockup against this file's 386×818 device, so every
     VERTICAL number below is the mockup's own, unchanged, and only widths are
     re-expressed as percentages.

     Three layers, same construction as Plant Detail: a pinned nav that never
     moves, a scrim under it that only exists once there is content to hide, and
     one scroller carrying everything else — the video stage first, then the
     settings. The video is IN the scroller, not behind it: the brief has it
     scrolling away under the header, which is the opposite of the detail
     screen's fixed film. */
  /* overflow is VISIBLE, not hidden: the scroller and the scrim both reach 48px
     back up over the status bar so that the mockup's y=0 is the real top of the
     screen, and .device's own overflow+radius is what clips them again. */
  .psscreen{flex:1 1 auto;position:relative;overflow:visible}

  /* ── the pinned nav ───────────────────────────────────────────────────────
     Identical geometry to Plant Detail's header (chevron 14/85, title 43/69),
     except that the title is TWO lines here — 438:98 breaks it "Personality &"
     / "Settings" and the 44.712px/1.16 face gives exactly the mockup's 104px
     box. align-items:center would then centre the chevron against both lines;
     the mockup keeps it on the first, so the row aligns to the top and the
     chevron takes the same 14px nudge that centring gave it on one line. */
  .pshead{position:absolute;left:0;right:0;top:0;z-index:3;padding:8px 16px 0;
    pointer-events:none}
  .pshead .plhead{align-items:flex-start}
  .pshead .plback{pointer-events:auto;margin-top:14px}
  /* the title wraps on its own; nowrap would push it off the screen */
  .pshead .pltitle{white-space:normal}

  /* ── the scrim under the nav ──────────────────────────────────────────────
     441:566: `#EDEEE9 → transparent` over 120px, sitting at y 176 — i.e. solid
     page colour behind the title itself and a 120px dissolve under it, 296px in
     total. It is NOT in the rest state (the video runs to the top of the screen
     behind the title, 440:330), so its opacity is a scroll state: it arrives as
     the video's own gradient leaves the header band and is solid by the time
     settings alone are underneath. */
  .psscrim{position:absolute;left:0;right:0;top:-48px;height:296px;z-index:2;
    pointer-events:none;opacity:0;
    background:linear-gradient(180deg,var(--bg) 0,var(--bg) 59.46%,
      rgba(237,238,233,0) 100%)}

  /* ── the scroller ─────────────────────────────────────────────────────────
     5px of padding, because the mockup insets every card 5px from a 402px frame
     (Frame 60 at x=5, cards 392 wide inside it). The stage and its gradient
     cancel that back out to run full-bleed. */
  .psscroll{position:absolute;left:0;right:0;top:-48px;bottom:0;z-index:1;
    overflow-y:auto;overflow-x:hidden;
    overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:0 5px}
  .psscroll::-webkit-scrollbar{width:0}

  /* ── the video stage ──────────────────────────────────────────────────────
     662px tall: the mockup's own film bottom edge at rest, which is also where
     the gradient starts. The film is settings-<plant>.mp4 — 1340×1544 (0.86788)
     for Vlad, whom the mockup was drawn from, 1292×1604 for the other four. The
     ratio below is Vlad's as the default; every screen writes its own inline.

     The film is anchored by its BOTTOM — that edge is the seam with the
     gradient and it must never move — and its SIZE is written by syncVid() on
     every scroll frame, because the two reference states say the film shrinks
     as well as scrolls. See PS_ZOOM for the rule and the arithmetic. */
  .psstage{position:relative;height:662px;margin:0 -5px;overflow:hidden}
  .psvid{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    display:block;border:0;pointer-events:none;
    aspect-ratio:1340 / 1544;background:transparent}   /* overridden inline */
  /* ── THE RESOLVE (441:421) ────────────────────────────────────────────────
     The same object the detail screen carries, and it moved the same way: no
     longer a band UNDER the film but 88px of transparent-into-page laid OVER
     it, on the mockup's own stops.

     440:330 — the one state whose film is drawn at the size the cover rule
     actually produces — puts it at 592…680 against a film bottom of 662: 70px
     up into the film, 18px past it. A -70px top margin says exactly that, and
     because the stage is what it follows in the flow it stays welded to the
     film's bottom edge at every scroll position for free.
     (438:96 draws the same 88px band at -60/+28 of its own film bottom. The
     rest state is the one measured from — it is the state the screen opens in,
     and the only one whose film is drawn to the rule.)

     No z-index on any of the three: .psstage, .psfade and .pscontent are all
     positioned and paint in DOM order, which is the order the mockup stacks
     them — film, resolve, then the settings ON TOP of both. A z-index here put
     the resolve over the "Personality" header and half-dissolved it. */
  .psfade{height:88px;margin:-70px -5px 0;position:relative;
    flex:0 0 auto;pointer-events:none;
    background:linear-gradient(180deg,rgba(237,238,233,0) 16.837%,#EDEEE9 50%)}

  /* ── the plant's reaction bubble (438:175/176) ────────────────────────────
     193×89 at 11px from the right edge, top 163 — the same pebble as the detail
     screen's blob, drawn smaller, so it is the same object in both places. 12px
     type is the mockup's and it has to be: the smallest step of the locked
     scale would not fit this sentence in an 89px blob.
     It rides in the pinned layer rather than in the stage, so its 163 is a
     screen position and not a scroll position — and it fades on the same 230ms
     curve as the detail screen's, off one class, so the two read as one
     behaviour. What it fades on is now only depth: see PS_TALK_MAX. */
  /* 163 on the mockup, less the 48px status bar this box already starts under */
  .psbub{position:absolute;top:115px;right:11px;width:193px;max-width:calc(100% - 32px);
    min-height:89px;z-index:4;pointer-events:none;
    background-size:100% 100%;background-repeat:no-repeat;
    padding:16px 22px;font-size:12px;line-height:1.25;text-align:center;
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    transform-origin:50% 0;
    transition:opacity 230ms ease-out,transform 230ms ease-out}
  .psbub.off{opacity:0;transform:translateY(-8px) scale(.96)}

  /* ── the settings themselves ──────────────────────────────────────────────
     -84px is the mockup's own overlap, restated for the resolve's new place:
     Frame 60 still opens at 596, but the stage (662) plus the 18px of resolve
     that now hangs below it run to 680 rather than to 750. The header still
     sits ON the video and the chip row still rides the gradient — the content
     has not moved a pixel, only the box above it has. 72px at the foot is the
     frame's own tail under the last card (1674 → 1746). */
  .pscontent{position:relative;margin-top:-84px;padding-bottom:72px}
  /* sections are 40px apart (Frame 59 → 51 → 52 at 0 / 423 / 787) and each
     header clears its first card by 14px (52 → 66) */
  .pssec{margin-top:40px}
  .pssec:first-child{margin-top:0}
  .pssech{margin:0 0 14px 24px;font-family:'Riccione',Georgia,serif;font-weight:400;
    color:var(--serif-ink);font-size:var(--t-xl);line-height:1.16;letter-spacing:0}

  /* ── preset chips (440:356) ───────────────────────────────────────────────
     74px pills on 24px of padding and a 5px gap, serif 22px, white until
     chosen and --sage when. The row is wider than the screen (774 against 402)
     and scrolls sideways; the negative margin lets it bleed to both edges while
     the first chip still lines up with the cards. */
  .pschips{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;
    margin:0 -5px;padding:0 5px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch}
  .pschips::-webkit-scrollbar{height:0}
  .pschip{flex:0 0 auto;height:74px;padding:0 24px;border-radius:40px;
    background:var(--card);color:var(--serif-ink);cursor:pointer;
    font-family:'Riccione',Georgia,serif;font-weight:400;font-size:var(--t-lg);
    line-height:1.18;display:flex;align-items:center;white-space:nowrap;
    transition:background 160ms ease-out}
  .pschip.on{background:var(--sage)}

  /* ── the three sliders (440:337) ──────────────────────────────────────────
     A 229px card on .scard's own 24px padding: label row 20, then 5, then the
     22px thumb band, and 20 between rows. 344px of track is 392 less the two
     paddings. */
  .pscard{background:var(--card);border-radius:var(--r-card);padding:24px}
  .psrow{margin-top:20px}
  .psrow:first-child{margin-top:0}
  .pslab{display:flex;align-items:center;justify-content:space-between;
    height:20px;font-size:var(--t-md);line-height:1.25;color:var(--ink)}
  .pslab span{opacity:.4}
  /* A native range, so the drag, the keyboard and the a11y come free. The track
     is painted as the input's own background (8px, --bg, --sage up to the
     value) and the thumb is the mockup's 22px --sage circle. */
  .psrange{-webkit-appearance:none;appearance:none;display:block;width:100%;
    height:22px;margin:5px 0 0;background:transparent;cursor:pointer}
  .psrange::-webkit-slider-runnable-track{height:8px;border-radius:40px;
    background:linear-gradient(to right,var(--sage) var(--v,0%),var(--bg) var(--v,0%))}
  .psrange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:22px;height:22px;border-radius:50%;background:var(--sage);border:none;
    margin-top:-7px}
  .psrange::-moz-range-track{height:8px;border-radius:40px;background:var(--bg)}
  .psrange::-moz-range-progress{height:8px;border-radius:40px;background:var(--sage)}
  .psrange::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
    background:var(--sage);border:none}

  /* ── name / species rows (440:380) and the voice chips (440:373) ──────────
     74px cards, serif 22px at 24px in, the pencil 24px at 24px from the right.
     The voice chips are a 3-up grid of 100px pills on a 4px gap — 128·3 + 4·2
     is the mockup's own 392. */
  .psfield{height:74px;padding:0 24px;background:var(--card);
    border-radius:var(--r-card);display:flex;align-items:center;gap:12px;
    margin-top:5px;cursor:text}
  .pssec .psfield:first-of-type{margin-top:0}
  .psfield b,.psfield input{flex:1 1 auto;min-width:0;
    font-family:'Riccione',Georgia,serif;font-weight:400;font-size:var(--t-lg);
    line-height:1.18;color:var(--serif-ink)}
  .psfield input{border:none;background:transparent;padding:0;outline:none;
    -webkit-appearance:none;appearance:none}
  .psedit{flex:0 0 auto;width:24px;height:24px;opacity:.4;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .psedit:active{opacity:.75}
  .psvoice{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:5px}
  .psvopt{height:100px;border-radius:40px;background:var(--card);cursor:pointer;
    color:var(--serif-ink);font-family:'Riccione',Georgia,serif;font-weight:400;
    font-size:var(--t-lg);line-height:1.18;text-align:center;
    display:flex;align-items:center;justify-content:center;padding:0 15px;
    transition:background 160ms ease-out}
  .psvopt.on{background:var(--sage)}

  /* ── activity (439:187 / 446:102) ─────────────────────────────────────────
     One 74px row with a toggle, then the quiet-hours card — the Auto-watering
     card's exact pattern: title + toggle, a muted line, a hairline, then the
     sage action. The mockup's own gaps here are 15px either side of the rule
     (subtitle ends 71, rule 86, action 102) rather than the detail screen's 14. */
  /* gap:0, not 12: both mockups run the title box from 24 to the switch's own
     left edge at 318 with nothing between them (439:189/460:191 against
     439:191/460:192). The 12px gap cost "Plants talk to each other" its single
     line on a 386px device, where the card is 16px narrower than the frame it
     was drawn on and every one of those pixels counts. */
  .psrowcard{min-height:74px;padding:0 24px;background:var(--card);
    border-radius:var(--r-card);display:flex;align-items:center;gap:0;
    margin-top:5px}
  .pssec .psrowcard:first-of-type{margin-top:0}
  .psrowcard b{flex:1 1 auto;font-family:'Riccione',Georgia,serif;font-weight:400;
    font-size:var(--t-lg);line-height:1.18;color:var(--serif-ink)}
  .psquiet{background:var(--card);border-radius:var(--r-card);padding:24px;
    margin-top:5px}
  .psqtop{display:flex;align-items:center;gap:12px}
  /* .psqtxt, not `> div`: the switch is a <div> too, and a bare child selector
     handed it flex:1 1 auto at a higher specificity than its own flex:0 0. */
  .psqtxt{flex:1 1 auto;min-width:0}
  .psqt{font-family:'Riccione',Georgia,serif;font-weight:400;font-size:var(--t-lg);
    line-height:1.18;color:var(--serif-ink)}
  .psqsub{margin-top:1px;font-size:var(--t-md);line-height:1.25;color:rgba(5,5,5,.4)}
  /* Everything but the title row belongs to Quiet hours being ON — with the
     switch off there is no window to state and nothing to customise. The
     Auto-watering card's exact pattern, and deliberately the same numbers:
     max-height over a known height, 200ms, and overflow:hidden so the block
     gets its own BFC and .psqsub's 1px margin cannot collapse out of it.
     Two blocks rather than one, because the subtitle lives inside the title
     column (so the switch stays centred on what is left) while the rule and
     the action sit under the whole row.
       sub   1 + 20 = 21, or 41 on the second line → 60
       tail  15 + 1 + 15 + 20 = 51                   → 80, .pdautomore's own
     The subtitle gets room for two lines because on a 386px device it takes
     them: it is 254px of body copy and the text column here is 228, where the
     402px frame it was drawn on gives 294. Body copy wrapping is fine; the
     serif TITLE wrapping is not, which is why .psrowcard gave up its gap and
     this card keeps its 12px of air beside the switch. */
  .psqmore{overflow:hidden;opacity:1;max-height:60px;
    transition:max-height 200ms ease-out,opacity 200ms ease-out}
  .psqmore.tail{max-height:80px}
  .psqmore.off{max-height:0;opacity:0;pointer-events:none}
  .psqdiv{height:1px;margin-top:15px;background:rgba(5,5,5,.1)}
  .psqact{margin-top:15px;font-size:var(--t-md);line-height:1.25;
    color:var(--sage-soft);cursor:pointer}
  .psqact:active{opacity:.55}
  /* ("Customise" opens the Quiet hours screen now — 447:131's design, the same
     one Auto-watering is drawn on — so the window presets no longer live inside
     this card and the collapsing tail is always the fixed 51px it is cut for.) */

  /* progress */
  .bar{height:12px;background:var(--box);border-radius:999px;overflow:hidden;
    border:none}
  .bar > i{display:block;height:100%;background:var(--sage-deep);width:0}
  .bar > i.fill-anim{animation:fill 2.2s linear forwards}
  @keyframes fill{from{width:6%}to{width:100%}}

  /* spinner */
  .spin{width:30px;height:30px;border:3px solid var(--box);border-top-color:var(--sage-deep);
    border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* radar-ish searching pulse */
  .pulse{width:14px;height:14px;border-radius:50%;background:var(--sage-deep);
    animation:pulse 1.1s infinite ease-out;flex:0 0 auto}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(110,132,92,.4)}100%{box-shadow:0 0 0 12px rgba(110,132,92,0)}}

  /* ══════════ DASHBOARD — rebuilt from the Figma "concept2" frames ══════════
     Two states of ONE screen: a collapsed sage header pill over the group chat,
     and an expanded state where that same pill floods the screen. The green
     surface is a single element that morphs (shared-element feel); the chat is
     pushed down, desaturated and left peeking at the bottom edge. */
  .dash{padding:0;gap:0;overflow:hidden;position:relative;background:var(--bg)}

  /* the morphing sage surface: pill → full bleed */
  .gsurface{position:absolute;left:14px;right:14px;top:12px;height:74px;z-index:12;
    background:var(--sage);border-radius:var(--r-pill);cursor:pointer;
    transition:left .38s var(--soft),right .38s var(--soft),
      top .38s var(--soft),height .38s var(--soft),border-radius .38s var(--soft)}
  /* the green leads the sequence — it starts moving on frame 1, everything else
     is timed off it */
  .dash.open .gsurface{left:0;right:0;top:0;height:434px;border-radius:0;
    transition:left .5s var(--spring),right .5s var(--spring),
      top .5s var(--spring),height .5s var(--spring),border-radius .5s var(--spring)}
  /* sage underlay — only visible through the sheet's rounded corners once open */
  .gunder{position:absolute;inset:0;z-index:8;background:var(--sage);opacity:0;
    pointer-events:none;transition:opacity .2s ease-out}
  .dash.open .gunder{opacity:1;transition:opacity .24s ease-out .2s}

  /* display headline — slides from the pill's left edge to the centre and grows */
  /* left:41px = the pill's own left edge (14) + the mockup's 27px inner padding */
  .ghead{position:absolute;left:41px;top:23px;z-index:14;transform:translateX(0);
    font-family:'Riccione',Georgia,serif;font-weight:400;color:var(--serif-ink);
    font-size:var(--t-lg);line-height:1.18;letter-spacing:0;pointer-events:none;
    transition:left .38s var(--soft),top .38s var(--soft),
      font-size .38s var(--soft),transform .38s var(--soft)}
  /* travels WITH the surface (40ms behind it) so it reads as one shared element */
  .dash.open .ghead{left:50%;top:121px;transform:translateX(-50%);
    font-size:var(--t-xl);text-align:center;white-space:nowrap;
    transition:left .46s var(--spring) .04s,top .46s var(--spring) .04s,
      font-size .46s var(--spring) .04s,transform .46s var(--spring) .04s}

  /* date — only in the expanded state, fades in */
  /* date + CTA are the tail of the stagger: they fade and slide in once the green
     has most of the way expanded, and leave immediately on collapse */
  .gdate{position:absolute;left:14px;top:39px;z-index:14;font-size:var(--t-md);
    color:var(--ink);opacity:0;pointer-events:none;transform:translateY(-6px);
    transition:opacity .14s ease-in,transform .14s ease-in}
  .dash.open .gdate{opacity:.4;transform:translateY(0);
    transition:opacity .26s var(--soft) .2s,transform .26s var(--soft) .2s}

  /* header icons: plant · bell (+ dot) · avatar. They keep their vertical place
     and only slide out to the screen edge as the pill becomes full-bleed. */
  .gicons{position:absolute;right:31px;top:29px;z-index:16;display:flex;
    align-items:center;gap:14px;
    transition:right .38s var(--soft)}
  .dash.open .gicons{right:14px;transition:right .46s var(--spring)}
  .gicon{width:24px;height:24px;cursor:pointer;position:relative;display:block}
  .gicon svg{display:block}
  /* the badge sits ON the bell's top-right corner (Figma 314,84 against a bell at
     297,85) — it must not lean into the gap before the avatar */
  .gdot{position:absolute;top:-3px;right:-3px;width:12px;height:12px}
  .gava{width:40px;height:40px;border-radius:50%;cursor:pointer;flex:0 0 auto;
    object-fit:cover;display:block}

  /* white pill CTA — expanded state only */
  .gcta{position:absolute;left:50%;top:250px;transform:translateX(-50%);z-index:14;
    width:269px;padding:15px;border:none;border-radius:var(--r-btn);background:#fff;
    color:var(--ink);font-size:var(--t-md);text-align:center;cursor:pointer;
    opacity:0;pointer-events:none;
    transition:opacity .14s ease-in,transform .14s ease-in}
  .dash.open .gcta{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);
    transition:opacity .28s var(--soft) .25s,transform .28s var(--soft) .25s}
  .gcta{transform:translateX(-50%) translateY(10px)}
  .dash.open .gcta:active{transform:translateX(-50%) translateY(1px);transition:transform .08s}

  /* the chat layer — the whole content in the collapsed state; pushed down,
     desaturated and peeking at the bottom edge when expanded */
  .gchat{position:absolute;left:0;right:0;top:0;bottom:0;z-index:10;
    border-radius:0;background:transparent;
    transition:top .38s var(--soft),background .38s ease-out,border-radius .38s ease-out}
  .dash.open .gchat{top:434px;background:var(--bg2);cursor:pointer;
    border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    transition:top .5s var(--spring),background .5s ease-out,border-radius .5s ease-out}
  .gscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
