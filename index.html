<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>[APP NAME] — wireframe</title>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  /* ── TYPEFACES ───────────────────────────────────────────────────────────
     Circular Std  → every piece of UI text (body 400, labels/names/buttons 500).
     Riccione Serial Light → DISPLAY HEADLINES ONLY (dashboard hero, moment
     screens). Never for UI text. Files are local; no webfont CDN. */
  @font-face{font-family:'Circular Std';src:url('fonts/CircularStd-Book.woff2') format('woff2');
    font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Circular Std';src:url('fonts/CircularStd-Medium.woff2') format('woff2');
    font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:'Circular Std';src:url('fonts/CircularStd-Bold.woff2') format('woff2');
    font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:'Riccione';src:url('fonts/Riccione-Serial-Light%20Regular.ttf') format('truetype');
    font-weight:400;font-style:normal;font-display:swap}

  :root{
    /* ── COLOUR — extracted from Figma "concept2" frames (see DECISIONS.md) ── */
    --bg:#EDEEE9;            /* milky off-white page                  (343:6)   */
    --bg2:#EFEFEF;           /* chat sheet / scrim                    (345:213) */
    --sage:#C9D6BC;          /* header pill + expanded hero flood     (343:60)  */
    --sage-deep:#6E845C;     /* DERIVED: readable sage for accents/active states */
    --accent:#6E845C;
    --ink:#050505;           /* body text                             (344:97)  */
    --serif-ink:#1E0C00;     /* display headline                      (344:125) */
    --icon:#1F1F1F;          /* icon strokes                          (mic/bell)*/
    --mut:rgba(5,5,5,.45);   /* timestamps / secondary — Figma 40% black        */
    --line:rgba(5,5,5,.12);
    --line2:rgba(5,5,5,.08); /* hairline divider — Figma black @10%   (350:235) */
    --card:#FFFFFF;
    --box:#E1E2DB;           /* DERIVED: warm neutral fill (tracks, tags)       */
    --input:#FFFAFA;         /* composer pill                         (344:74)  */
    --ava:#D9D9D9;           /* avatar placeholder                    (344:92)  */
    /* character-coded bubbles */
    --c-margo:#BCCAD7;       /* muted blue-grey        (Ellipse 19 fill) */
    --c-felix:#E3D2CA;       /* dusty terracotta       (Ellipse 20 fill) */
    --c-gosha:#E0D3B8;       /* DERIVED: warm sand/ochre — third tone     */
    --c-vera:#CBD5C9;        /* DERIVED: soft sage-grey                   */
    --c-basil:#D3D0DC;       /* DERIVED: muted lavender-grey              */
    --c-me:#FFFFFF;          /* user messages          (Ellipse 21 fill) */
    /* plants-overview card fills — two-stop gradients from the mockup (364:585),
       each running from the character's tint into that pot's glow colour */
    --g-felix:linear-gradient(126.35deg,#E7D1C9 38.007%,#E2F7CF 115.19%);
    --g-margo:linear-gradient(126.35deg,#B9CBD8 38.007%,#E39B84 115.19%);
    --g-gosha:linear-gradient(126.35deg,#D6D0BA 38.007%,#C3F5EE 115.19%);
    /* Vera's start stop was re-read off the current mockup (364:1078) — dusty
       pink, not the sage-grey the earlier frame carried */
    --g-vera:linear-gradient(113.89deg,#E7D1C9 38.007%,#E7FCD6 115.19%);
    --g-vlad:linear-gradient(113.89deg,#B9CBD8 38.007%,#E7FCD6 115.19%);

    /* ── TYPE SCALE — LOCKED to the two Figma frames. Four sizes, no others. ── */
    --t-sm:13px;             /* names, timestamps, labels, meta   (344:95)  */
    --t-md:16px;             /* body, buttons, inputs             (344:97)  */
    --t-lg:22px;             /* display headline, collapsed       (344:125) */
    --t-xl:44.7px;           /* display headline, expanded        (345:215) */

    /* ── RADII ── */
    --r-pill:36px;           /* header pill            (343:60)  */
    --r-input:37px;          /* composer pill 36.932px (344:74)  */
    --r-btn:28px;            /* white pill button      (345:216) */
    --r-sheet:36px;          /* chat sheet top corners (345:213) */
    /* the canonical settings/data-card radius — every white card in the app,
       lifted off the Plant Detail mockup (415:1433/1499/1512) */
    --r-card:40px;
    --r-sub:28px;            /* DERIVED: small cards nested inside a card */

    /* ── MOTION ── gentle ease-out-back for the hero (gets there fast, settles
       with a 2% overshoot); plain soft ease-out for everything reversing out. */
    --spring:cubic-bezier(.16,.84,.28,1.02);
    --soft:cubic-bezier(.22,1,.36,1);
    /* Organic blob bubble: four different large radii, tight corner by the avatar.
       Derived from the Ellipse 19/20/21 vectors (near-half-height corners). */
    --bub:10px 56px 44px 64px / 10px 44px 60px 52px;
    --bub-me:56px 10px 64px 44px / 44px 10px 52px 60px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#262521;
    font-family:'Circular Std',-apple-system,sans-serif;
    color:var(--ink)}
  /* form controls don't inherit type by default — route them to Circular too */
  input,button,textarea,select{font-family:inherit}
  /* Shell canvas: center the phone both axes. `safe center` falls back to
     top-alignment when the viewport is shorter than the phone, so it never
     clips out of reach — the page just scrolls. */
  #root{display:flex;justify-content:center;align-items:safe center;
    min-height:100vh;padding:24px 12px;box-sizing:border-box}

  /* phone frame — simplified iPhone mockup: dark body + bezel, dynamic island,
     status bar. This is prototype-shell chrome, NOT wireframe app UI. */
  .phone{width:412px;max-width:100%;height:844px;background:#0c0c0c;
    border-radius:56px;padding:13px;position:relative;display:flex;flex:0 0 auto}
  .device{flex:1;background:var(--bg);border-radius:44px;overflow:hidden;
    position:relative;display:flex;flex-direction:column;
    transition:background .46s cubic-bezier(.22,.9,.28,1)}
  .device:has(.dash.open){background:var(--sage)}
  /* dynamic island */
  .island{position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:112px;height:31px;background:#000;border-radius:16px;z-index:60}
  /* status bar — constant device chrome, solid ink (never dashed/wireframe) */
  .statusbar{flex:0 0 auto;height:48px;display:flex;align-items:center;
    justify-content:space-between;padding:0 26px;color:var(--ink);
    position:relative;z-index:40}
  /* the plant detail runs its photo under the status bar, so the device chrome
     goes white there — the only screen that needs it */
  .device:has(.pdscreen) .statusbar{color:#fff}
  .sb-time{font-size:var(--t-sm);font-weight:500;letter-spacing:.02em}
  .sb-right{display:flex;align-items:center;gap:6px}
  .sb-right svg{display:block}
  .screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 16px 24px;
    display:flex;flex-direction:column;gap:14px}
  .screen::-webkit-scrollbar{width:0}

  /* header */
  .topbar{display:flex;align-items:center;gap:10px;min-height:32px}
  .topbar h1{font-size:var(--t-lg);margin:0;font-weight:500;flex:1;letter-spacing:-.01em}
  .back{border:none;background:var(--card);border-radius:999px;
    padding:8px 14px;font-size:var(--t-sm);cursor:pointer;color:var(--ink)}
  .back:active{background:var(--box)}
  .kicker{font-size:var(--t-sm);letter-spacing:.04em;
    color:var(--mut);font-weight:500}

  /* [APP NAME] placeholder chip — name is undecided */
  .brand{display:inline-block;font-size:var(--t-sm);font-weight:500;letter-spacing:.04em;
    color:var(--mut);background:var(--box);
    border-radius:999px;padding:2px 9px}

  /* generic */
  .muted{color:var(--mut)}
  .center{text-align:center}
  .row{display:flex;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .grow{flex:1}
  h2{font-size:var(--t-md);margin:0 0 2px;font-weight:500}
  p{margin:0;line-height:1.4;font-size:var(--t-md)}
  small{font-size:var(--t-sm)}
  b,strong{font-weight:500}
  /* DISPLAY headline — the only place Riccione is allowed outside the dashboard:
     centred hero titles on the "moment" screens (first meeting, alert, thank-you). */
  .display{font-family:'Riccione',Georgia,serif;font-weight:400;color:var(--serif-ink);
    letter-spacing:0}

  .card{background:var(--card);border:none;border-radius:var(--r-card);
    padding:20px 22px}
  .card.tap{cursor:pointer}
  .card.tap:active{background:#f4f4f1}

  /* ── SETTINGS / DATA CARD — the canonical surface (Figma 415:1426) ─────────
     White, 40px radius, no shadow, 24px inset. Titles and values are Riccione;
     labels are Circular 16px at black 40%. This is the one card style for every
     settings / data surface in the app — plant detail, profile, plant settings,
     notifications. It sets surface + radius + type ROLES only; each screen keeps
     its own layout and content. */
  .scard{background:var(--card);border:none;border-radius:var(--r-card);padding:24px}
  .scard-t{font-family:'Riccione',Georgia,serif;font-weight:400;font-size:var(--t-lg);
    line-height:1.18;color:var(--serif-ink);margin:0}
  .scard-l{font-size:var(--t-md);color:#050505;opacity:.4;line-height:1.25}
  .scard-v{font-family:'Riccione',Georgia,serif;font-weight:400;font-size:var(--t-lg);
    line-height:1.18;color:var(--serif-ink)}
  .scard-v.xl{font-size:var(--t-xl);line-height:1.16}
  /* rolled onto the existing settings screens: a card tagged .scard promotes its
     row titles to the serif role and its captions to the 16px muted label role,
     without touching the markup around them */
  .card.scard b{font-family:'Riccione',Georgia,serif;font-weight:400;
    font-size:var(--t-lg);line-height:1.2;color:var(--serif-ink)}
  .card.scard small.muted{font-size:var(--t-md);color:rgba(5,5,5,.4)}
  /* the bond / progress bar from the mockup: 8px, page-tint track, sage fill */
  .sbar{height:8px;background:var(--bg);border-radius:40px;overflow:hidden}
  .sbar > i{display:block;height:100%;background:var(--sage);border-radius:40px}

  /* placeholder boxes (photos / charts) */
  .ph{background:repeating-linear-gradient(45deg,#E4E5DE,#E4E5DE 8px,#DCDDD6 8px,#DCDDD6 16px);
    border:1px dashed var(--line);border-radius:18px;display:flex;
    align-items:center;justify-content:center;color:var(--mut);font-size:var(--t-sm);
    letter-spacing:.04em;font-weight:500;min-height:64px}
  .ph.round{border-radius:50%}

  /* photo avatar badge (emotion glyph sits on the photo, never replaces it) */
  .badge{position:absolute;top:4px;right:4px;min-width:26px;height:26px;padding:0 4px;
    border-radius:999px;border:none;background:#fff;display:flex;
    align-items:center;justify-content:center;
    font-size:var(--t-sm);color:var(--ink)}

  /* buttons — white / sage pills, matching the dashboard */
  .btn{display:block;width:100%;text-align:center;border-radius:999px;padding:17px;
    font-size:var(--t-md);font-weight:500;cursor:pointer;border:none;
    background:var(--card);color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--sage);color:var(--serif-ink)}
  .btn.ghost{background:transparent;color:var(--mut)}
  .btn.sm{padding:10px 16px;width:auto;font-size:var(--t-sm)}
  .btn[disabled]{opacity:.5;pointer-events:none}

  /* face (expressive moments only — reactions, alerts) */
  .face{width:var(--fs,56px);height:var(--fs,56px);border-radius:50%;
    border:none;background:var(--card);display:flex;align-items:center;
    justify-content:center;font-size:var(--ff,18px);
    flex:0 0 auto;color:var(--ink)}
  .face.big{--fs:120px;--ff:40px}
  .face.accent{background:var(--sage)}

  /* header icon buttons + user avatar */
  .iconbtn{width:38px;height:38px;border-radius:50%;border:none;
    background:var(--card);display:flex;align-items:center;justify-content:center;
    font-size:17px;cursor:pointer;flex:0 0 auto;position:relative}
  .iconbtn:active{background:var(--box)}
  .ndot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;
    background:var(--icon);border:2px solid var(--ava)}

  /* status dot / pill */
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 auto}
  .dot.ok{background:var(--sage-deep)}
  .dot.warn{background:#B08968}
  .pill{display:inline-flex;align-items:center;gap:6px;border:none;
    border-radius:999px;padding:6px 12px;font-size:var(--t-sm);background:var(--card)}
  .pill.accent{background:var(--sage);color:var(--serif-ink);font-weight:500}

  /* list */
  .list{display:flex;flex-direction:column;gap:0}
  .li{display:flex;gap:12px;align-items:center;padding:13px 4px;
    border-bottom:1px solid var(--line2)}
  .li:last-child{border-bottom:none}

  /* advice row (diagnosis) — a recommendation the POT senses, never a tickable task */
  .adv{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;
    border-bottom:1px solid var(--line2)}
  .adv:last-child{border-bottom:none}
  .adv .leaf{color:var(--sage-deep);font-size:var(--t-sm);line-height:1.5;flex:0 0 auto}

  /* ── PLANTS OVERVIEW — inset card stack (Figma "concept2" 364:1065) ──
     Cards are 192px tall on a 140px step, so 140px of every card shows and the
     last one stands taller. 40px top corners only — every bottom is tucked under
     the next card. Cards paint in DOM order, which is what makes the stack read
     as a stack: no z-index anywhere, because nothing needs to escape any more. */
  .plhead{display:flex;align-items:center;gap:5px;margin:13px -2px 0;flex:0 0 auto}
  .plback{width:24px;height:24px;flex:0 0 auto;cursor:pointer;opacity:.4;
    display:flex;align-items:center;justify-content:center}
  .plback:active{opacity:.75}
  .pltitle{flex:1;margin:0;font-family:'Riccione',Georgia,serif;font-weight:400;
    color:var(--serif-ink);font-size:var(--t-xl);line-height:1.16;letter-spacing:0}
  .pladd{flex:0 0 auto;background:#fff;border:none;border-radius:var(--r-btn);
    padding:15px 24px;font-size:var(--t-md);color:var(--ink);cursor:pointer}
  .pladd:active{transform:translateY(1px)}

  /* the mockup insets the stack 5px from each side of the 402px frame, so the
     -11px cancels 16px of screen padding down to 5. The negative bottom cancels
     the screen's padding so the last card runs off the bottom edge instead of
     ending on a strip of page. */
  .pstack{display:flex;flex-direction:column;flex:1 0 auto;margin:0 -11px -24px}
  /* The card clips its own contents: a pot may not spill onto its neighbours.
     The radius and the shadow live on the CARD, not on the surface — an inner
     element's outward shadow would be eaten by this same overflow, while an
     element's own shadow is drawn outside its border box and survives. The
     gradient stays on the surface so the press feedback has something to act on. */
  .plcard{position:relative;flex:0 0 auto;height:192px;margin-top:-52px;
    cursor:pointer;color:var(--serif-ink);overflow:hidden;
    border-radius:40px 40px 0 0;box-shadow:0 -4px 60px rgba(61,61,61,.2)}
  .plsurface{position:absolute;inset:0;transition:filter .18s var(--soft)}
  .plcard:first-child{margin-top:0;box-shadow:none}
  .plcard:active .plsurface{filter:brightness(.965)}
  /* the last card (now Vlad) runs on to the bottom of the screen, as in the
     mockup — and it is the ONLY one that lets its plant break out past the card's
     top edge. Vera lost that privilege when Vlad was added below her, so her pot
     is clipped to her own card like everyone else's. */
  .plcard:last-child{flex:1 0 auto;height:250px;overflow:visible}
  /* mood chip — a soft filled pill, no outline. Figma (403:1345) fills it white
     and drops the WHOLE chip to 40%, so the fill and the word wash back into the
     card gradient together; that group opacity is the style, not two separate
     alphas. */
  .plchip{position:absolute;left:43px;top:14px;border:none;background:#fff;opacity:.4;
    border-radius:24px;padding:2px 10px 5px;font-size:var(--t-md);
    color:#000;line-height:1.25}
  /* species sits 80px down and the name 101px (Figma 364:1087 / 364:1093 against
     a card top of 135) — a 21px step, tighter than the 25px it used to be */
  .plspecies{position:absolute;left:43px;top:80px;font-size:var(--t-md);
    color:var(--ink);opacity:.4;line-height:1.25}
  /* a plant whose species IS its name (Basil) drops the duplicate label, so the
     name moves up into the space the species would have used */
  .plcard:not(:has(.plspecies)) .plname{top:80px}
  .plname{position:absolute;left:43px;top:101px;font-family:'Riccione',Georgia,serif;
    font-weight:400;font-size:var(--t-lg);line-height:1.18;color:var(--serif-ink)}
  /* the pot render: a WINDOW anchored on the card's right edge, holding a square
     1024px source offset inside it. Window box + inner offset are lifted straight
     off the mockup's image frames, so the crop matches per plant; the card's own
     overflow then does the rest. Windows sit before the chip/species/name in the
     DOM, so the text paints over the render without needing a z-index. */
  .plwin{position:absolute;overflow:hidden;pointer-events:none}
  .plwin img{position:absolute;display:block;max-width:none}
  /* the header sits above every pot, so nothing can ride up over the title */
  .plhead{position:relative;z-index:100}

  /* compact, secondary "+ add plant" tile — sits above the stack, not a peer of the plant cards */
  .addtile{border:1px dashed var(--line);border-radius:999px;background:transparent;
    color:var(--sage-deep);
    display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;
    font-size:var(--t-sm);font-weight:500;cursor:pointer;flex:0 0 auto}
  .addtile:active{background:var(--box)}
  .addtile .plus{font-size:var(--t-md);line-height:1;font-weight:400}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:2px}
  .pgdot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .pgdot.on{background:var(--sage-deep)}

  /* ══════════ PLANT DETAIL — full-bleed (Figma "concept2" 417:1537) ══════════
     A 402×874 frame, i.e. a whole iPhone 16 Pro screen: the photo/video is the
     BACKGROUND, edge to edge and behind the status bar, and everything else
     floats on it. Two anchors are in play and they must not be confused:

       · the nav bar, species row and bubble are TOP-anchored — their mockup y
         lands on the device y unchanged (title 69, chip 132, bubble 161).
       · the timeline and the cards are BOTTOM-anchored, because the mockup's
         874px frame is 56px taller than this 818px device. Measured up from the
         frame's bottom edge they are: labels 190, rail 159, bond card 134,
         stat-card tops 12 — that last one is the "peeking" the brief asks for,
         and it only survives if you anchor from the bottom.

     The photo never scrolls. Everything else lives in one scroller that rides
     over it, so the cards climb the photo to reveal the stats and the toggle. */
  .pdscreen{flex:1 1 auto;position:relative;overflow:visible}

  /* ── the fixed photo layer ────────────────────────────────────────────────
     top:-48px reaches back up over the status bar, which is what makes the
     bleed reach the actual top of the screen; .device's own overflow+radius
     clip it back to the phone. */
  /* The films stop 95px short of the bottom edge in the default framing (see
     .pdvid), so the layer under them is painted in the studio backdrop rather
     than the app's --bg: sampled off the mp4's own bottom row, #D4D0C8 at the
     left and #CDC9BD at the right. Only ever visible as a sliver at the very
     end of the scroll, and there it reads as more floor, not as a band. */
  .pdbg{position:absolute;left:0;right:0;top:-48px;bottom:0;overflow:hidden;
    background:linear-gradient(90deg,#D4D0C8 0%,#CDC9BD 100%);z-index:0}

  /* ── the two films ────────────────────────────────────────────────────────
     Both are framed exactly as the mockup frames "still 1": x=-27, 457×995 on
     a 402px frame, i.e. -6.716% / 113.681% of the device width. The sources are
     976×2124 (ratio .45951) against that rect's .45930 — the rect IS the film
     at scale, so height comes from the intrinsic aspect and nothing is cropped.
     aspect-ratio states it up front so the box is right before metadata lands.

     Vertical placement is the whole mechanic and it is TWO numbers off Figma:
       ·  -184px  428:1782 "still 1" — the default framing, shifted up so the
                  pot and its face fill the stage.
       ·     0px  437:90   "still 1" — flush with the top of the screen, which
                  is where the growth film plays.
     Y is carried on `transform`, not `top`, so the glide between the two is a
     compositor-only animation. A CSS transition of a FIXED duration is what
     drives it: interrupt it half-way and it re-runs over the same 420ms from
     wherever it stands, which is exactly what the reversal logic assumes. */
  .pdvid{position:absolute;left:-6.716%;top:0;width:113.681%;
    aspect-ratio:976 / 2124;display:block;border:0;background:transparent;
    pointer-events:none;transform:translate3d(0,0,0);
    -webkit-backface-visibility:hidden;backface-visibility:hidden}
  .pdvid-still{will-change:transform;
    transition:transform 420ms cubic-bezier(.33,.72,.26,1)}
  /* the growth film is parked at 0 forever and only ever fades; it sits above
     the still one in the stack, so a single opacity drives the cross-fade */
  .pdvid-grow{opacity:0;will-change:opacity;transition:opacity 180ms linear}
  /* 417:1587 — the top scrim that carries the white nav over a bright photo */
  .pdscrimt{position:absolute;left:0;right:0;top:0;height:266px;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 103.57%)}
  /* 417:1589 — the bottom scrim, drawn flipped in Figma: transparent down to
     21.94%, then ramping to black at 20%. It runs 5px past the frame's bottom. */
  .pdscrimb{position:absolute;left:0;right:0;bottom:-5px;height:271px;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,0) 21.939%,rgba(0,0,0,.2) 100%)}

  /* ── the scrolling layer ──────────────────────────────────────────────────
     inset:0 gives it a definite height, which is what lets .pdspacer size
     itself as a percentage and pin the lower block to the bottom edge. */
  .pdscroll{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;
    padding:8px 16px 0;display:flex;flex-direction:column}
  .pdscroll::-webkit-scrollbar{width:0}
  /* The top block is pinned to an exact 221px (device 56→277, i.e. the mockup's
     bubble bottom) so the spacer below it is a single constant no matter how
     many lines this plant's greeting runs to.
     position:sticky is what makes "only the cards area scrolls" literally true:
     the block holds its rest position for the whole scroll range, so the back
     chevron never leaves and the white bubble never rides up under the white
     title. top:0 resolves against the scroller's CONTENT box, which already
     starts below its 8px padding — so this pins the block exactly where it
     already sits and it never moves at all. The lower block tops out at device
     410, well clear of this block's 277, so the two never collide. */
  .pdtop{flex:0 0 auto;height:221px;display:flex;flex-direction:column;
    position:sticky;top:0;z-index:2}
  /* 411 = 221 (top block) + 190 (the labels' offset up from the bottom edge) */
  .pdspacer{flex:0 0 auto;height:calc(100% - 411px);min-height:24px}
  .pdlower{flex:0 0 auto}

  .pdmenu{position:absolute;top:104px;right:14px;z-index:120;background:var(--card);
    border:none;border-radius:var(--r-sub);min-width:214px;overflow:hidden;
    box-shadow:0 10px 40px rgba(30,12,0,.14)}
  .pdmenu > div{padding:14px 18px;font-size:var(--t-md);cursor:pointer;
    border-bottom:1px solid var(--line2)}
  .pdmenu > div:last-child{border-bottom:none}
  .pdmenu > div:active{background:var(--box)}
  /* the ⋯ button sits opposite the chevron, on the title's baseline row */
  .plmore{width:24px;height:24px;flex:0 0 auto;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .plmore:active{opacity:.5}

  /* the whole nav row now sits on the photo, so it is set in white (417:1538,
     and both nav glyphs come back from Figma with stroke="white") */
  .pdscreen .pltitle{color:#fff}
  .pdscreen .plback,.pdscreen .plmore{opacity:1;color:#fff}

  /* species (left) + mood chip (right). Figma 417:1580 / 417:1572. Over the
     photo the species is plain white — the 40% black it wears on the light
     screens would disappear here. The 29px indent lines it up under the title
     rather than under the chevron (mockup x=43 against a 14px chevron). */
  .pdrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    margin:11px -2px 0;min-height:27px;flex:0 0 auto;position:relative;z-index:5}
  .pdsp{margin-left:29px;font-size:var(--t-md);color:#fff;line-height:1.25;
    padding-top:2px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
  /* soft filled pill with a gentle glow in the plant's own emotion colour —
     fill and drop-shadow are the SAME hex, exactly as the mockup builds it */
  .moodchip{border:none;border-radius:24px;padding:2px 10px 5px;font-size:var(--t-md);
    color:#000;line-height:1.25;flex:0 0 auto}

  /* speech blob — the mockup's Ellipse 18 path, painted by blobBg(). No quote
     marks: the shape already says it is speech. */
  .pdbubwrap{position:relative;margin:2px -16px 0;display:flex;justify-content:center;
    flex:0 0 auto}
  .pdbub{position:relative;width:277px;max-width:calc(100% - 32px);min-height:116px;
    background-size:100% 100%;background-repeat:no-repeat;
    padding:26px 29px;font-size:var(--t-md);line-height:1.28;text-align:center;
    color:var(--ink);display:flex;align-items:center;justify-content:center}

  /* ── TIMELINE SCRUB ───────────────────────────────────────────────────────
     Now in the scrolling layer rather than pinned to a stage box, sitting 19px
     above the bond card exactly as the mockup measures it (rail 715 → card 740),
     so the relationship holds at every scroll position instead of only at rest.
     Position maps linearly to video currentTime, the right end being "now".
     Pointer events cover touch and mouse in one path; touch-action:none keeps a
     scrub from scrolling the sheet under it. */
  .pdtimeline{position:relative;margin:0 -16px;padding:0 20px;
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .pdtimeline:active{cursor:grabbing}
  /* labels 684→704, dots 711→721: a 7px gap */
  .pdtllab{position:relative;height:20px;margin-bottom:7px}
  .pdtllab span{position:absolute;white-space:nowrap;font-size:var(--t-md);
    line-height:1.25;color:#fff;text-shadow:0 1px 8px rgba(30,12,0,.45)}
  .pdtlrail{position:relative;height:10px}
  .pdtltrack{position:absolute;left:0;right:0;top:4px;height:2px;border-radius:2px;
    background:rgba(255,255,255,.42)}
  .pdtlfill{position:absolute;left:0;top:4px;height:2px;border-radius:2px;background:#fff}
  .pdtldot{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;
    border-radius:50%;background:rgba(255,255,255,.55)}
  .pdtldot.on{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.20)}

  /* ── INFO CARDS ───────────────────────────────────────────────────────────
     The mockup insets them 5px from a 402px frame and stacks them on a 5px gap;
     -11px cancels the screen's 16px padding down to that 5. The 19px top margin
     is the mockup's own gap between the timeline dots (bottom 721) and the bond
     card (740); the 24px bottom lets the auto-watering card clear the edge once
     the sheet is scrolled all the way up. */
  .pdcards{display:flex;flex-direction:column;gap:5px;margin:19px -11px 24px;
    flex:0 0 auto}
  .pdbondmeta{display:flex;align-items:center;gap:8px;margin:1px 0 14px}
  .pdsep{width:4px;height:4px;border-radius:50%;background:#050505;opacity:.2;
    flex:0 0 auto}
  .pdstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
  .pdstat{position:relative;overflow:hidden;background:var(--card);
    border-radius:var(--r-card);padding:24px 8px;text-align:center;min-height:125px}
  .pdstat .scard-l{margin-bottom:5px;position:relative}
  .pdstat .scard-v{position:relative}
  /* reservoir level — the mockup's own wave path, stretched to the fill height */
  .reswater{position:absolute;left:-9%;right:-9%;bottom:0;pointer-events:none;
    background-repeat:no-repeat;background-size:100% 100%}
  .pdauto{display:flex;align-items:center;justify-content:space-between;gap:10px}

  /* the plant + pot placeholders and the blob bubble the CREATE-CHARACTER hero
     and the plant-settings preview still build on */
  .pdplant{width:148px;border-radius:16px 16px 6px 6px;min-height:0}
  .pdpot{position:relative;border:none;border-radius:7px 7px 24px 24px;
    background:repeating-linear-gradient(45deg,#DCDDD6,#DCDDD6 8px,#D2D3CC 8px,#D2D3CC 16px);
    display:flex;align-items:center;justify-content:center;color:var(--ink);
    font-weight:500;letter-spacing:.05em}
  /* speech bubble on the photo — organic blob, same language as the chat */
  .pdspeech{position:relative;max-width:280px;background:var(--c-me);border:none;
    border-radius:var(--bub);padding:14px 16px;font-size:var(--t-md);line-height:1.3;
    text-align:center}

  /* progress */
  .bar{height:12px;background:var(--box);border-radius:999px;overflow:hidden;
    border:none}
  .bar > i{display:block;height:100%;background:var(--sage-deep);width:0}
  .bar > i.fill-anim{animation:fill 2.2s linear forwards}
  @keyframes fill{from{width:6%}to{width:100%}}

  /* spinner */
  .spin{width:30px;height:30px;border:3px solid var(--box);border-top-color:var(--sage-deep);
    border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* radar-ish searching pulse */
  .pulse{width:14px;height:14px;border-radius:50%;background:var(--sage-deep);
    animation:pulse 1.1s infinite ease-out;flex:0 0 auto}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(110,132,92,.4)}100%{box-shadow:0 0 0 12px rgba(110,132,92,0)}}

  /* ══════════ DASHBOARD — rebuilt from the Figma "concept2" frames ══════════
     Two states of ONE screen: a collapsed sage header pill over the group chat,
     and an expanded state where that same pill floods the screen. The green
     surface is a single element that morphs (shared-element feel); the chat is
     pushed down, desaturated and left peeking at the bottom edge. */
  .dash{padding:0;gap:0;overflow:hidden;position:relative;background:var(--bg)}

  /* the morphing sage surface: pill → full bleed */
  .gsurface{position:absolute;left:14px;right:14px;top:12px;height:74px;z-index:12;
    background:var(--sage);border-radius:var(--r-pill);cursor:pointer;
    transition:left .38s var(--soft),right .38s var(--soft),
      top .38s var(--soft),height .38s var(--soft),border-radius .38s var(--soft)}
  /* the green leads the sequence — it starts moving on frame 1, everything else
     is timed off it */
  .dash.open .gsurface{left:0;right:0;top:0;height:434px;border-radius:0;
    transition:left .5s var(--spring),right .5s var(--spring),
      top .5s var(--spring),height .5s var(--spring),border-radius .5s var(--spring)}
  /* sage underlay — only visible through the sheet's rounded corners once open */
  .gunder{position:absolute;inset:0;z-index:8;background:var(--sage);opacity:0;
    pointer-events:none;transition:opacity .2s ease-out}
  .dash.open .gunder{opacity:1;transition:opacity .24s ease-out .2s}

  /* display headline — slides from the pill's left edge to the centre and grows */
  /* left:41px = the pill's own left edge (14) + the mockup's 27px inner padding */
  .ghead{position:absolute;left:41px;top:23px;z-index:14;transform:translateX(0);
    font-family:'Riccione',Georgia,serif;font-weight:400;color:var(--serif-ink);
    font-size:var(--t-lg);line-height:1.18;letter-spacing:0;pointer-events:none;
    transition:left .38s var(--soft),top .38s var(--soft),
      font-size .38s var(--soft),transform .38s var(--soft)}
  /* travels WITH the surface (40ms behind it) so it reads as one shared element */
  .dash.open .ghead{left:50%;top:121px;transform:translateX(-50%);
    font-size:var(--t-xl);text-align:center;white-space:nowrap;
    transition:left .46s var(--spring) .04s,top .46s var(--spring) .04s,
      font-size .46s var(--spring) .04s,transform .46s var(--spring) .04s}

  /* date — only in the expanded state, fades in */
  /* date + CTA are the tail of the stagger: they fade and slide in once the green
     has most of the way expanded, and leave immediately on collapse */
  .gdate{position:absolute;left:14px;top:39px;z-index:14;font-size:var(--t-md);
    color:var(--ink);opacity:0;pointer-events:none;transform:translateY(-6px);
    transition:opacity .14s ease-in,transform .14s ease-in}
  .dash.open .gdate{opacity:.4;transform:translateY(0);
    transition:opacity .26s var(--soft) .2s,transform .26s var(--soft) .2s}

  /* header icons: plant · bell (+ dot) · avatar. They keep their vertical place
     and only slide out to the screen edge as the pill becomes full-bleed. */
  .gicons{position:absolute;right:31px;top:29px;z-index:16;display:flex;
    align-items:center;gap:14px;
    transition:right .38s var(--soft)}
  .dash.open .gicons{right:14px;transition:right .46s var(--spring)}
  .gicon{width:24px;height:24px;cursor:pointer;position:relative;display:block}
  .gicon svg{display:block}
  /* the badge sits ON the bell's top-right corner (Figma 314,84 against a bell at
     297,85) — it must not lean into the gap before the avatar */
  .gdot{position:absolute;top:-3px;right:-3px;width:12px;height:12px}
  .gava{width:40px;height:40px;border-radius:50%;cursor:pointer;flex:0 0 auto;
    object-fit:cover;display:block}

  /* white pill CTA — expanded state only */
  .gcta{position:absolute;left:50%;top:250px;transform:translateX(-50%);z-index:14;
    width:269px;padding:15px;border:none;border-radius:var(--r-btn);background:#fff;
    color:var(--ink);font-size:var(--t-md);text-align:center;cursor:pointer;
    opacity:0;pointer-events:none;
    transition:opacity .14s ease-in,transform .14s ease-in}
  .dash.open .gcta{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);
    transition:opacity .28s var(--soft) .25s,transform .28s var(--soft) .25s}
  .gcta{transform:translateX(-50%) translateY(10px)}
  .dash.open .gcta:active{transform:translateX(-50%) translateY(1px);transition:transform .08s}

  /* the chat layer — the whole content in the collapsed state; pushed down,
     desaturated and peeking at the bottom edge when expanded */
  .gchat{position:absolute;left:0;right:0;top:0;bottom:0;z-index:10;
    border-radius:0;background:transparent;
    transition:top .38s var(--soft),background .38s ease-out,border-radius .38s ease-out}
  .dash.open .gchat{top:434px;background:var(--bg2);cursor:pointer;
    border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    transition:top .5s var(--spring),background .5s ease-out,border-radius .5s ease-out}
  .gscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    padding:100px 14px 100px;border-radius:inherit}
  .gscroll::-webkit-scrollbar{width:0}
  /* The conversation is NOT blurred or desaturated behind the hero. The only
     thing over it is .gfade — the very same top scroll gradient the collapsed
     state uses, at the same intensity. Expanding the hero must not make the chat
     any harder to read than scrolling it does. */
  .dash.open .gscroll{padding-top:26px;overflow-y:hidden}
  /* soft fade where the chat runs under the header / the sheet's top edge.
     Only present when something is actually scrolled up behind it (.on). */
  .gfade{position:absolute;left:0;right:0;top:0;height:244px;z-index:11;
    pointer-events:none;opacity:0;
    background:linear-gradient(180deg,var(--bg) 0,var(--bg) 96px,rgba(237,238,233,0) 244px);
    transition:top .38s var(--soft),height .38s var(--soft),
      background .38s ease-out,opacity .22s ease-out}
  .gfade.on{opacity:1}
  /* Same character as the collapsed gradient above — an opaque cap, then a ramp
     to nothing, tinted to the sheet's own surface so its top edge has no seam —
     but MUCH shorter, and proportionally less of it solid (27% against 39%).
     The sheet opens at device 482 and the composer starts at 730, so the chat
     that is actually readable is 248px; 52px veils its top fifth and is fully
     transparent by device 534. That number is set by the alert bubble, which
     begins at 541: it and its CTA have to read at full clarity, so the ramp has
     to be finished before it. At 244px it was not — the gradient was still at
     FULL opacity where that bubble started, which is what washed it out. */
  .dash.open .gfade{top:434px;height:52px;opacity:1;
    background:linear-gradient(180deg,var(--bg2) 0,var(--bg2) 14px,rgba(239,239,239,0) 52px);
    border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    transition:top .5s var(--spring),height .5s var(--spring),
      background .5s ease-out,opacity .22s ease-out}

  /* message row — grey avatar circle + organic colour-coded bubble */
  .grow-row{display:flex;gap:5px;align-items:flex-start;margin-bottom:11px}
  .grow-row.me{flex-direction:row-reverse}
  .gmava{width:37.81px;height:37.81px;border-radius:50%;background:var(--ava);
    flex:0 0 auto;position:relative}
  /* an illustrated pot character brings its own circle — and its plant overhangs
     the circle upwards, exactly as the avatar frame draws it */
  .gmava.art{background:transparent}
  .gmava.art img{position:absolute;display:block;max-width:none;pointer-events:none}
  .gmava.art img.round{border-radius:50%;object-fit:cover}
  /* a plant's avatar taps through to its card */
  .gmava.tap{cursor:pointer}
  .gmava.tap:active{opacity:.7}
  /* silhouette comes from the stretched Figma path (see blobBg), not border-radius.
     width:auto so a short line makes a short bubble; the mockup's 269px is the cap. */
  .gbub{position:relative;width:auto;max-width:min(269px,calc(100% - 48px));
    padding:15px;background-color:transparent;
    background-size:100% 100%;background-repeat:no-repeat;
    display:flex;flex-direction:column;gap:8px}
  /* reactions — messenger-style chips hooked over the bubble's bottom edge */
  .grx{position:absolute;bottom:-11px;display:flex;gap:4px;z-index:3}
  .grow-row.them .grx{left:15px}
  .grow-row.me .grx{right:15px}
  .grxchip{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 8px;
    border-radius:999px;background:var(--card);font-size:var(--t-sm);line-height:1;
    box-shadow:0 1px 4px rgba(30,12,0,.10)}
  .grxchip span{opacity:.5;font-weight:500}
  /* a row carrying chips needs room for them before the next message */
  .grow-row.rx{margin-bottom:24px}
  .gmeta{display:flex;gap:10px;align-items:center;font-size:var(--t-sm);
    letter-spacing:.52px;line-height:1.2}
  .gmeta b{font-weight:500;color:var(--ink)}
  .gmeta span{opacity:.4;color:#000}
  .gtext{font-size:var(--t-md);line-height:1.28;color:var(--ink)}
  /* inline CTA inside an alert bubble — plain text over a hairline, no box */
  .gline{height:1px;background:rgba(0,0,0,.1);margin:7px 0}
  .glink{font-size:var(--t-md);text-align:center;color:var(--ink);cursor:pointer}
  .glink:active{opacity:.55}

  /* composer — elongated pill + microphone (no send arrow) */
  .gcomposer{position:absolute;left:14px;right:14px;bottom:14px;height:74px;z-index:20;
    background:var(--input);border-radius:var(--r-input);display:flex;align-items:center;
    gap:10px;padding:0 25px 0 27px}
  .gcomposer input{flex:1;min-width:0;border:none;background:transparent;outline:none;
    font-size:var(--t-md);color:var(--ink)}
  .gcomposer input::placeholder{color:var(--ink);opacity:.5}
  .gmic{flex:0 0 auto;width:24px;height:24px;cursor:pointer}

  /* segmented choice rows (watering schedule, quiet hours, message frequency) */
  .segrow{display:flex;gap:6px}
  .seg{flex:1;text-align:center;border:none;background:var(--card);
    border-radius:999px;padding:11px 8px;font-size:var(--t-sm);cursor:pointer;color:var(--ink)}
  .seg.on{background:var(--sage);color:var(--serif-ink);font-weight:500}

  /* choice chips / options / toggle */
  .chip{border:none;background:var(--card);border-radius:999px;padding:13px;
    cursor:pointer;font-size:var(--t-md);flex:1;text-align:center}
  .chip.on{background:var(--sage);color:var(--serif-ink);font-weight:500}
  .opt{border:none;border-radius:var(--r-sub);padding:15px 18px;cursor:pointer;
    background:var(--card)}
  .opt.on{background:var(--sage);color:var(--serif-ink)}
  .opt.on small{color:var(--serif-ink);opacity:.65}
  .opt b{font-size:var(--t-md)}
  .opt small{display:block;color:var(--mut);margin-top:2px}
  .field label{font-size:var(--t-sm);color:var(--mut);display:block;margin-bottom:6px;
    letter-spacing:.04em;font-weight:500}
  .field input{width:100%;border:none;border-radius:999px;padding:15px 18px;
    font-size:var(--t-md);background:var(--card);outline:none;color:var(--ink)}
  .field input::placeholder{color:var(--mut)}
  /* switch — the settings-card control from the mockup (415:1523/1524): a page-tint
     track with a sage knob when on. One switch for every settings card in the app. */
  .toggle{width:50px;height:28px;border-radius:40px;background:var(--bg);
    border:none;position:relative;cursor:pointer;flex:0 0 auto}
  .toggle > i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#C6C7C0;border:none;
    transition:left .14s var(--soft),background .14s var(--soft)}
  .toggle.on > i{left:25px;background:var(--sage)}

  /* unobtrusive text action (log out) — deliberately not a button */
  .linkbtn{background:none;border:none;padding:6px;font-size:var(--t-sm);color:var(--mut);
    text-decoration:underline;cursor:pointer;align-self:center}
  .linkbtn:active{color:var(--ink)}

  /* text playback button — fixed size, so mock playback never shifts the layout */
  .listen{min-width:152px;height:42px;border:none;border-radius:999px;
    background:var(--card);color:var(--sage-deep);font-size:var(--t-sm);font-weight:500;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:0 18px;flex:0 0 auto}
  .listen:active{background:var(--box)}
  .listen.on{background:var(--sage);color:var(--serif-ink)}
  .eq{display:inline-flex;gap:2px;align-items:center;height:14px}
  .eq i{width:3px;height:6px;background:currentColor;border-radius:1px;
    animation:eq .7s infinite ease-in-out}
  .eq i:nth-child(2){animation-delay:.15s}
  .eq i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:5px}50%{height:14px}}

  /* CREATE-CHARACTER hero — the top ~⅔ is the plant + its pot, mirroring the plant
     card. The bubble + "Try it" button stay sticky so the line you're tuning is still
     on screen once the pot has scrolled away. */
  .cchero{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;
    margin:0 -16px;padding:0 16px 14px;border-bottom:1px solid var(--line2)}
  .ccbubble{position:sticky;top:0;z-index:6;width:100%;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 0 10px}

  /* compact 3×2 personality preset grid */
  .pgrid6{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ptile{border:none;border-radius:var(--r-sub);background:var(--card);cursor:pointer;
    padding:11px 5px;text-align:center;min-height:58px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px}
  .ptile:active{background:var(--box)}
  .ptile.on{background:var(--sage);color:var(--serif-ink)}
  .ptile b{font-size:var(--t-sm);line-height:1.15;font-weight:500}
  .ptile small{font-size:var(--t-sm);color:var(--mut);line-height:1.15}
  .ptile.on small{color:var(--serif-ink);opacity:.65}

  /* low-fi CONTINUOUS range slider (native input) — warm track, sage fill via an
     inline gradient, sage handle, no shadow. touch-action:none so dragging the
     handle never scrolls the screen. */
  .range{display:flex;flex-direction:column;gap:3px}
  .range-lab{display:flex;justify-content:space-between;font-size:var(--t-sm)}
  .range-lab b{font-weight:500}
  .range-lab small{color:var(--mut)}
  input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;
    border:0;padding:0;margin:12px 0;border-radius:999px;background:var(--box);
    outline:none;cursor:pointer;touch-action:none}
  input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:20px;height:20px;border-radius:50%;background:var(--sage-deep);border:2px solid #fff;cursor:pointer}
  input[type=range].rng::-moz-range-thumb{width:20px;height:20px;border:2px solid #fff;
    border-radius:50%;background:var(--sage-deep);cursor:pointer}
  input[type=range].rng::-moz-range-track{height:6px;border-radius:999px;background:var(--box)}
  input[type=range].rng::-moz-range-progress{height:6px;border-radius:999px;background:var(--sage-deep)}

  .camctrls{display:flex;align-items:center;justify-content:space-between;padding:16px 26px 22px}
  .shutter{width:66px;height:66px;border-radius:50%;background:#fff;border:4px solid #C9D6BC;

  .camspacer{width:44px;flex:0 0 auto}

  /* species reference image carousel (species-info screen)
     NOTE: an explicit min-height on the flex row is required — without it the

     as the plant pager), leaving only the dot indicators visible. */
  .carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;

     scroll container, sticks to the bottom, and stays visible without scrolling */

    display:flex;flex-direction:column;gap:10px;z-index:5}

  /* ── PROTOTYPE SHELL: flow index / shortcuts panel (dev/review tool, not app UI)
     A flat list of flow entry points — no container, text sits on the dark canvas,
     vertically centered against the phone. Warm-neutral tints so it reads as
     shell chrome next to the milky app palette without clashing. */
  .flowindex{position:fixed;top:50%;right:28px;transform:translateY(-50%);

  .fi-link{padding:7px 2px;cursor:pointer;color:#A6A49C}

  @media (max-width:1100px){ .flowindex{display:none} }

<!-- App source: type="text/plain" so Babel does NOT auto-process it.
     The bootstrap at the bottom transforms it with the CLASSIC runtime
     (React.createElement) so no `import` statements are ever emitted. -->
<script type="text/plain" id="app-src">
const { useState, useMemo, useEffect, useRef, createContext, useContext } = React;

/* ───────────────── EMOTION ENUM ─────────────────
   `glow` is the mood chip's fill AND its drop-shadow on the plant detail screen —
   one hex doing both jobs, exactly as the mockup builds it (415:1487). Only
   `content` is a measured value; the rest are derived in the same bright-pastel
   register, each pulling towards the colour that emotion already wears elsewhere
   in the app (warm coral for thirst, cool teal for the grump, and so on). */
// content, thirsty, overwatered, low-light, sleeping, greeting, cold, hot, urgent, neutral
const EMO = {
  content:      { face:"^‿^",  label:"All good",     tone:"ok",   word:"happy",   glow:"#CCF5B0" },
  thirsty:      { face:">_<",  label:"Thirsty",      tone:"warn", word:"thirsty", glow:"#F5C9B0" },
  overwatered:  { face:"@_@",  label:"Overwatered",  tone:"warn", word:"soggy",   glow:"#B0D9F5" },
  "low-light":  { face:"-_-",  label:"Needs light",  tone:"warn", word:"gloomy",  glow:"#DCD6B4" },

/* ───────────────── MOCK DATA ───────────────── */
const PLANTS = [

const plantById = (id) => PLANTS.find(p=>p.id===id) || PLANTS[0];

/* NOTIFICATIONS = a digest of what actually needs the user OFFLINE. Social chatter
   ("Felix says hi") belongs in the chat and is deliberately absent here.
     kind:"urgent" → taps into the alert → diagnosis flow
     kind:"need"   → taps into the chat, focused on that plant's message */
const NOTIFS = [
  { id:"n1", plant:"felix", emo:"urgent",  kind:"urgent", time:"just now",
    text:"Felix needs a look — soggy soil and a cold draught" },
  { id:"n2", plant:"margo", emo:"thirsty", kind:"need",   time:"10 min ago",
    text:"Margot's reservoir is empty — she'd love a refill" },
  { id:"n3", plant:"gosha", emo:"low-light", kind:"need", time:"2 h ago",
    text:"Gosha needs more light — a brighter spot would do it" },
];

/* Universal growth milestones — the same six for every plant, so the timeline
   reads consistently across the whole garden. */
const MILESTONES = [
  { stage:"Seed",        date:"2 Mar"  },
  { stage:"Sprout",      date:"12 Mar" },
  { stage:"Young plant", date:"18 Apr" },
  { stage:"Established", date:"24 May" },
  { stage:"Thriving",    date:"21 Jun" },
  { stage:"Now",         date:"Today"  },
];

/* The pot is self-aware: it already knows the reservoir was refilled and that the
   plant was moved, so the plants never hand out chores — they talk, they react,
   and they thank you. Message flags:
     cross:true  → the plant-to-plant banter thread, including the user's reply to it
                   (hidden when "plants talk to each other" is off, leaving Felix's
                   news, the congratulations and Margot's alert — still coherent)
     urgent:true → carries the inline "Check what happened" CTA into the alert flow
     rx          → reactions, [emoji, count]; everyone reacts to everyone */
const CHAT_INIT = [
  { who:"felix", at:"09:02",
    text:"New leaf today! The pot's already taking pictures — get my good side 🌿",
    rx:[["💚",2],["🎉",1]] },
  { who:"me",    at:"09:04", text:"Congrats, Felix! Looking great", rx:[["🌿",1]] },
  { who:"margo", at:"09:06", cross:true,
    text:"Wait — nobody told me there was a photoshoot?! I would have turned my leaves.",
    rx:[["😂",2]] },
  { who:"gosha", at:"09:09", cross:true,
    text:"A leaf. Everyone's celebrating a leaf. It happens, you know.",
    rx:[["💅",1],["😂",1]] },
  { who:"me",    at:"09:11", cross:true,
    text:"Calm down, Gosha. It's just a leaf. Be happy for him.", rx:[["👍",1]] },
  { who:"margo", at:"17:30", urgent:true,
    text:"Something's off — my soil's soggy and it's cold by this window. Can you take a look?" },
];

/* ───────────────── PERSONALITY MODEL (single source of truth) ─────────────────
   Six presets, each with default positions for THREE fixed sliders
   (warmth / drama / chattiness) and a small set of in-character line variants.
   Both the onboarding "create character" tuner and the plant-settings screen
   read from here. Slider values are CONTINUOUS 0–100. `words` is the spread of
   labels the handle passes through (index = which fifth of the range it's in). */
const SLIDERS = [
  { key:"warmth",     label:"Warmth",     words:["Dry","Reserved","Balanced","Warm","Affectionate"] },
  { key:"drama",      label:"Drama",      words:["Understated","Subtle","Balanced","Dramatic","Theatrical"] },
  { key:"chattiness", label:"Chattiness", words:["Rarely","Occasional","Balanced","Chatty","Often"] },
];
// map a 0–100 value to its word in a spread (equal buckets)
const wordFor = (words, val)=> words[Math.min(words.length-1, Math.floor(val/(100/words.length)))];
// thresholds that flip the sample-line variants (top / bottom fifth-ish)
const HI = 66, LO = 34;
const PERSONALITIES = {
  sliders: SLIDERS,
  presets: [
    { k:"Friendly", d:"Warm & easy", defaults:{warmth:84, drama:50, chattiness:84},
      lines:{
        terse:"Hey! Good to see you.",
        base:"Morning! So good to see you today — how are we doing?",
        big:"There you are! Honestly, you just made my whole day.",
        warm:"Missed you, you know.", dry:"Oh. Hello." },
      faces:{ base:"content", big:"greeting", terse:"content",
              warm:"greeting", dry:"neutral" } },
    { k:"Drama queen", d:"Season finale", defaults:{warmth:50, drama:84, chattiness:84},
      lines:{
        terse:"Ugh. Fine. Alive. Barely.",
        base:"This is, without question, the WORST day of my entire life. Probably.",
        big:"Call the papers — this is my FINAL act! One leaf left! Farewell, cruel windowsill!",
        warm:"…but I'm glad it's you who found me.", dry:"Whatever. You're here, I suppose." },
      faces:{ base:"thirsty", big:"urgent", terse:"overwatered",
              warm:"content", dry:"neutral" } },
    { k:"Grump", d:"Secretly caring", defaults:{warmth:16, drama:50, chattiness:16},
      lines:{
        terse:"Hmph. You again.",
        base:"Oh. It's you. …fine, I suppose it's good you came by.",
        big:"In MY day we didn't 'check in' — we just stood there and coped! Now shut the blinds.",
        warm:"…don't let it go to your head, but I did miss you.", dry:"Don't touch anything." },
      faces:{ base:"low-light", big:"hot", terse:"low-light",
              warm:"content", dry:"cold" } },
    { k:"Calm", d:"Zen & gentle", defaults:{warmth:50, drama:16, chattiness:50},
      lines:{
        terse:"All is well.",
        base:"All is well. Breathe. We're okay, you and me.",
        big:"Feel how the light moves through the room — nothing to fix, nothing to chase, just this.",
        warm:"I'm glad we share this quiet.", dry:"It is fine." },
      faces:{ base:"sleeping", big:"content", terse:"sleeping",
              warm:"content", dry:"neutral" } },
    { k:"Cheerful", d:"Sunny & peppy", defaults:{warmth:84, drama:50, chattiness:84},
      lines:{
        terse:"Hi! Lovely day!",
        base:"Hey hey! What a great day to be a plant. Loving this light!",
        big:"WOOHOO best day EVER — sunshine, water, AND you showed up?! I could burst!",
        warm:"So happy you're here!", dry:"…nice day, I guess." },
      faces:{ base:"greeting", big:"urgent", terse:"content",
              warm:"greeting", dry:"neutral" } },
    { k:"Sassy", d:"Playful bite", defaults:{warmth:50, drama:84, chattiness:50},
      lines:{
        terse:"Oh, look who it is.",
        base:"Took you long enough. I'm thriving, thanks for finally asking.",
        big:"Absolutely SERVING chlorophyll realness today and you're lucky to witness it, darling.",
        warm:"…you're kind of my favourite, don't tell the cactus.", dry:"Cool. Great. You're back." },
      faces:{ base:"hot", big:"hot", terse:"neutral",
              warm:"content", dry:"cold" } },
  ],
};
const personaByName = (k)=> PERSONALITIES.presets.find(p=>p.k===k) || PERSONALITIES.presets[0];

/* Live in-character sample line from continuous slider values. High drama → the
   "big" variant; low chattiness → the "terse" variant; high/low warmth appends an
   affectionate / dry tag. So dragging ANY slider across a threshold changes it. */
// which line variant the current slider values select — one source of truth for
// both the sentence and the face, so the two can never drift apart
function lineVariant(t){
  return t.drama>=HI ? "big" : (t.chattiness<=LO ? "terse" : "base");
}
function sampleLine(k, t){
  const L = personaByName(k).lines;
  let line = L[lineVariant(t)];
  if(t.warmth>=HI && L.warm)      line += " " + L.warm;
  else if(t.warmth<=LO && L.dry)  line += " " + L.dry;
  return line;
}

/* The emotion the pot wears while it "says" that line. Every preset maps its
   variants onto the existing EMO set, so changing preset changes the face, and
   dragging a slider across a threshold changes it again.
   The warmth tag re-colours the parting mood, EXCEPT on the "big" line — a
   theatrical sentence dominates whatever gets appended to it, so the face keeps
   the theatrical read. */
function faceFor(k, t){
  const F = personaByName(k).faces || {};
  const v = lineVariant(t);
  let emo = F[v] || F.base || "neutral";
  if(v !== "big"){
    if(t.warmth>=HI && F.warm)     emo = F.warm;
    else if(t.warmth<=LO && F.dry) emo = F.dry;
  }
  return emo;
}

/* Voice = timbre of the spoken sample (distinct from personality). */
const VOICES = [
  { k:"Warm",    d:"Gentle and reassuring" },

];
const SPECIES = [
  "Ficus","Monstera","Cactus","Aloe","Basil","Snake plant","Pothos","Peace lily",
  "Fern","Succulent","Orchid","Spider plant","Rubber plant","Philodendron","Calathea",
  "ZZ plant","Jade plant","Bamboo","English ivy","Lavender","Rosemary","Mint","Parlour palm",
];
// placeholder identity — comes from sign-up / social login in the real app
const USER_NAME = "Alexandra";
const USER_AVATAR = "assets/avatar-user.png";   // Figma 364:1064, exported at 4×

/* ───────────────── NAV ───────────────── */
const Nav = createContext(null);
const useNav = () => useContext(Nav);

/* ───────────────── SMALL COMPONENTS ───────────────── */
function Brand(){ return <span className="brand">[APP NAME]</span>; }

/* Device status bar — part of the phone chrome, constant on every screen.
   Solid-ink icons (time, cellular, wi-fi, battery); never wireframe-styled. */
function StatusBar(){
  /* currentColor, not a literal: the status bar inherits --ink everywhere, and
     the full-bleed plant detail flips it to white with a single CSS rule */

    <span className="sb-time">9:41</span>

}

function Face({emotion, big, accent}){
  const e = EMO[emotion] || EMO.neutral;
  return <div className={"face"+(big?" big":"")+(accent?" accent":"")}>{e.face}</div>;
}

// Photo placeholder — the avatar. Emotion (if any) rides along as a corner badge.
function Photo({label="PHOTO", w, h=90, round, badge, style}){
  const e = badge && (EMO[badge] || EMO.neutral);
  return <div className={"ph"+(round?" round":"")}
    style={Object.assign({height:h, width:w, position:"relative", flex:w?"0 0 auto":undefined}, style||{})}>

function StatusPill({emotion}){
  const e = EMO[emotion] || EMO.neutral;
  return <span className={"pill"+(e.tone==="ok"?" accent":"")}>
    <span className={"dot "+(e.tone==="ok"?"ok":e.tone==="warn"?"warn":"")}></span>{e.label}

function Toggle({on, onClick}){
  return <div className={"toggle"+(on?" on":"")} onClick={onClick}><i/></div>;
}

/* Low-fi CONTINUOUS range slider (native input, 0–100). Grey track, accent fill via
   an inline gradient, accent handle, no shadow. Drag (mouse/touch) or tap the track;
   the right-hand label maps to a spread of words as the handle moves. */
function RangeSlider({label, words, val, onChange}){
  const word = wordFor(words, val);
  const lo = words[0], hi = words[words.length-1];
  const fill = `linear-gradient(to right, var(--accent) ${val}%, var(--line) ${val}%)`;
  return <div className="range">
    <div className="range-lab"><b>{label}</b><small>{word}</small></div>
    <input type="range" className="rng" min="0" max="100" step="1" value={val}
      style={{background:fill}} aria-label={label+": "+word}
      onChange={e=>onChange(Number(e.target.value))}/>
    <div className="range-lab"><small>{lo}</small><small>{hi}</small></div>
  </div>;
}

/* Compact 3×2 personality preset grid (6 presets). */
function PresetGrid({value, onChange}){
  return <div className="pgrid6">
    {PERSONALITIES.presets.map(x=>(
      <div key={x.k} className={"ptile"+(value===x.k?" on":"")} onClick={()=>onChange(x.k)}>
        <b>{x.k}</b><small>{x.d}</small>
      </div>
    ))}
  </div>;
}

/* The three fixed fine-tune sliders (warmth / drama / chattiness). */
function FineTuning({tune, onChange}){
  return <div className="card col" style={{gap:16}}>
    {PERSONALITIES.sliders.map(s=>(
      <RangeSlider key={s.key} label={s.label} words={s.words}
        val={tune[s.key]} onChange={i=>onChange(s.key,i)}/>
    ))}
  </div>;
}

/* Live in-character line as a speech bubble + a TEXT playback button beneath it.
   The button is fixed-size so mock playback never shifts the layout. Shared by the
   create-character hero (bubble coming off the pot) and plant settings. */
function LinePreview({preset, tune, playing, onPlay}){
  return <>
    <div className="pdspeech">{sampleLine(preset,tune)}</div>
    <button className={"listen"+(playing?" on":"")} onClick={onPlay}

   their corners are superellipse-ish — the outline hugs the edge and turns late,
   which is what gives them the soft pebble character. border-radius cannot draw
   that curve at all, so each bubble is painted from the actual Figma path,
   stretched to the message box (preserveAspectRatio="none").

   corner vertex, which is what makes the curve hug the edge and turn late.
   Two edits: Figma runs all four corners at half the box (so three of them read
   the same), so the radii are staggered per corner (them 44/57/62/16,
   alert 62/82.7/74/16, me 24/35/28/16) for the uneven pebble silhouette the
   brief asks for; and the corner nearest the avatar is re-cut tight at 16px,
   mirrored to the right on user messages. */

  them: { w:269.327, h:114, d:"M16 0L179.327 0C269.327 0 269.327 0 269.327 44L269.327 57C269.327 114 269.327 114 133.327 114L70 114C0 114 0 114 0 62L0 16C0 0 0 0 16 0Z" },
  alert:{ w:269.383, h:165.181, d:"M16 0L169.383 0C269.383 0 269.383 0 269.383 62L269.383 82.5C269.383 165.181 269.383 165.181 133.383 165.181L64 165.181C0 165.181 0 165.181 0 91.181L0 16C0 0 0 0 16 0Z" },
  me:   { w:268.673, h:70, d:"M268.673 16L268.673 42C268.673 70 268.673 70 148.673 70L70 70C0 70 0 70 0 35L0 24C0 0 0 0 90 0L252.673 0C268.673 0 268.673 0 268.673 16Z" },
  /* the plant's own bubble on the detail screen (Ellipse 18, 415:1463) — the
     same pebble construction, but symmetric: it points at nobody, it just floats */
  speech:{ w:277, h:116, d:"M277 58C277 90.0325 277 116 138.5 116C0 116 0 90.0325 0 58C0 25.9675 7.29157 0 138.5 0C269.709 0 277 25.9675 277 58Z" },

/* WINDOWSILL — the group chat. Plants message the user, talk to each other, and
   thank the user once the pot senses a need was handled offline. An urgent need
   carries a plain-text inline CTA under a hairline (no outlined box) that taps
   through into the alert → diagnosis flow. `focus` comes from a notification tap
   and scrolls to that plant's most recent message. */
function GardenChat({focus, open, onCollapse}){
  const nav = useNav();
  const { chatCross } = useApp();
  const [msgs,setMsgs] = useState(CHAT_INIT);
  const [text,setText] = useState("");
  // the top fade only exists while there IS hidden content above the viewport —
  // at the very first message the bubble must be fully lit, not dimmed
  const [scrolled,setScrolled] = useState(true);
  const scroller = useRef(null);
  const target = useRef(null);
  const onScroll = (e)=> setScrolled(e.currentTarget.scrollTop > 4);

  // "plants talk to each other" is controlled from the profile's chat settings
  const shown = chatCross ? msgs : msgs.filter(m=>!m.cross);
  // index of the message a notification pointed at, if any
  const hot = focus ? shown.map(m=>m.who).lastIndexOf(focus) : -1;

  useEffect(()=>{
    const el = scroller.current;
    if(!el) return;
    // a focused message wins; otherwise land on the newest (the urgent one)
    if(target.current) el.scrollTop = Math.max(0, target.current.offsetTop - 120);
    else el.scrollTop = el.scrollHeight;
    setScrolled(el.scrollTop > 4);
  },[shown.length]);

  // while the hero expands/collapses the pane changes height — keep the stream
  // pinned to its newest message for the whole 460ms so it reads as "pushed down"
  useEffect(()=>{
    const el = scroller.current;
    if(!el || target.current) return;
    let raf, stop = false;
    const pin = ()=>{ if(stop) return; el.scrollTop = el.scrollHeight; raf = requestAnimationFrame(pin); };
    pin();
    const t = setTimeout(()=>{ stop = true; cancelAnimationFrame(raf);
      setScrolled(el.scrollTop > 4); }, 520);
    return ()=>{ stop = true; cancelAnimationFrame(raf); clearTimeout(t); };
  },[open]);

  const send = ()=>{
    if(!text.trim()) return;
    const t = text;
    setText("");
    setMsgs(m=>[...m,{who:"me",text:t,at:"now"}]);
    setTimeout(()=>setMsgs(m=>[...m,
      {who:"margo",at:"now",text:"love it when you message us 💚"}]),400);
  };

  return <>
    {/* while the hero is open the stream is frozen, so a scroll gesture over it is
        unambiguous: it means "give me the chat back" */}
    <div className="gchat" onClick={()=> open && onCollapse()}
      onWheel={()=> open && onCollapse()}
      onTouchMove={()=> open && onCollapse()}>
      <div className="gscroll" ref={scroller} onScroll={onScroll}>
        {shown.map((m,i)=>{
          const isMe = m.who==="me";
          const p = !isMe && plantById(m.who);
          const av = AVATAR[m.who];
          const shape = isMe ? "me" : (m.urgent ? "alert" : "them");
          return <div key={i} className={"grow-row "+(isMe?"me":"them")+(m.rx?" rx":"")}
            ref={i===hot ? target : null}>
            {/* a plant's avatar is the way from the chat into its card */}
            <div className={"gmava"+(av?" art":"")+(isMe?"":" tap")}
              title={isMe?null:("Open "+p.name.split(" ")[0]+"'s card")}
              onClick={isMe?null:(ev=>{ev.stopPropagation();nav.go("plant",{id:m.who});})}>
              {av && <img src={av.src} alt="" className={av.round?"round":null}
                style={{width:av.w,height:av.h,left:av.l,top:av.t}}/>}
            </div>
            <div className="gbub" style={{backgroundImage:
              blobBg(shape, isMe ? BUBBLE.me : (BUBBLE[m.who]||BUBBLE.margo))}}>
              {!isMe && <div className="gmeta">
                <b>{p.name.split(" ")[0]}</b><span>{m.at}</span>
              </div>}
              <div className="gtext">{m.text}</div>
              {/* inline CTA — plain text over a hairline, never an outlined box */}
              {m.urgent && <>
                <div className="gline"/>
                <div className="glink" onClick={e=>{e.stopPropagation(); nav.go("alert");}}>
                  Check what happened
                </div>
              </>}
              {m.rx && <div className="grx">
                {m.rx.map(([e,n])=>(
                  <div className="grxchip" key={e}>{e}<span>{n}</span></div>
                ))}
              </div>}
            </div>
          </div>;
        })}
      </div>
    </div>
    <div className={"gfade"+(scrolled?" on":"")}/>

    {/* composer — elongated pill, microphone in place of a send arrow */}
    <div className="gcomposer" onClick={e=>e.stopPropagation()}>
      <input value={text} placeholder="Message to your plants"
        onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
      <span className="gmic" title="Hold to speak" onClick={send}><IconMic/></span>
    </div>
  </>;
}
