    padding:100px 14px 100px;border-radius:inherit}
  .gscroll::-webkit-scrollbar{width:0}
  /* The conversation is NOT blurred or desaturated behind the hero. The only
     thing over it is .gfade — the very same top scroll gradient the collapsed
     state uses, at the same intensity. Expanding the hero must not make the chat
     any harder to read than scrolling it does. */
  .dash.open .gscroll{padding-top:26px;overflow-y:hidden}
  /* soft fade where the chat runs under the header / the sheet's top edge.
     Only present when something is actually scrolled up behind it (.on). */
  .gfade{position:absolute;left:0;right:0;top:0;height:244px;z-index:11;
    pointer-events:none;opacity:0;
    background:linear-gradient(180deg,var(--bg) 0,var(--bg) 96px,rgba(237,238,233,0) 244px);
    transition:top .38s var(--soft),height .38s var(--soft),
      background .38s ease-out,opacity .22s ease-out}
  .gfade.on{opacity:1}
  /* Same character as the collapsed gradient above — an opaque cap, then a ramp
     to nothing, tinted to the sheet's own surface so its top edge has no seam —
     but MUCH shorter, and proportionally less of it solid (27% against 39%).
     The sheet opens at device 482 and the composer starts at 730, so the chat
     that is actually readable is 248px; 52px veils its top fifth and is fully
     transparent by device 534. That number is set by the alert bubble, which
     begins at 541: it and its CTA have to read at full clarity, so the ramp has
     to be finished before it. At 244px it was not — the gradient was still at
     FULL opacity where that bubble started, which is what washed it out. */
  .dash.open .gfade{top:434px;height:52px;opacity:1;
    background:linear-gradient(180deg,var(--bg2) 0,var(--bg2) 14px,rgba(239,239,239,0) 52px);
    border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    transition:top .5s var(--spring),height .5s var(--spring),
      background .5s ease-out,opacity .22s ease-out}

  /* message row — grey avatar circle + organic colour-coded bubble */
  .grow-row{display:flex;gap:5px;align-items:flex-start;margin-bottom:11px}
  .grow-row.me{flex-direction:row-reverse}
  .gmava{width:37.81px;height:37.81px;border-radius:50%;background:var(--ava);
    flex:0 0 auto;position:relative}
  /* an illustrated pot character brings its own circle — and its plant overhangs
     the circle upwards, exactly as the avatar frame draws it */
  .gmava.art{background:transparent}
  .gmava.art img{position:absolute;display:block;max-width:none;pointer-events:none}
  .gmava.art img.round{border-radius:50%;object-fit:cover}
  /* a plant's avatar taps through to its card */
  .gmava.tap{cursor:pointer}
  .gmava.tap:active{opacity:.7}
  /* silhouette comes from the stretched Figma path (see blobBg), not border-radius.
     width:auto so a short line makes a short bubble; the mockup's 269px is the cap. */
  .gbub{position:relative;width:auto;max-width:min(269px,calc(100% - 48px));
    padding:15px;background-color:transparent;
    background-size:100% 100%;background-repeat:no-repeat;
    display:flex;flex-direction:column;gap:8px}
  /* reactions — messenger-style chips hooked over the bubble's bottom edge */
  .grx{position:absolute;bottom:-11px;display:flex;gap:4px;z-index:3}
  .grow-row.them .grx{left:15px}
  .grow-row.me .grx{right:15px}
  .grxchip{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 8px;
    border-radius:999px;background:var(--card);font-size:var(--t-sm);line-height:1;
    box-shadow:0 1px 4px rgba(30,12,0,.10)}
  .grxchip span{opacity:.5;font-weight:500}
  /* a row carrying chips needs room for them before the next message */
  .grow-row.rx{margin-bottom:24px}
  .gmeta{display:flex;gap:10px;align-items:center;font-size:var(--t-sm);
    letter-spacing:.52px;line-height:1.2}
  .gmeta b{font-weight:500;color:var(--ink)}
  .gmeta span{opacity:.4;color:#000}
  .gtext{font-size:var(--t-md);line-height:1.28;color:var(--ink)}
  /* inline CTA inside an alert bubble — plain text over a hairline, no box */
  .gline{height:1px;background:rgba(0,0,0,.1);margin:7px 0}
  .glink{font-size:var(--t-md);text-align:center;color:var(--ink);cursor:pointer}
  .glink:active{opacity:.55}

  /* composer — elongated pill + microphone (no send arrow) */
  .gcomposer{position:absolute;left:14px;right:14px;bottom:14px;height:74px;z-index:20;
    background:var(--input);border-radius:var(--r-input);display:flex;align-items:center;
    gap:10px;padding:0 25px 0 27px}
  .gcomposer input{flex:1;min-width:0;border:none;background:transparent;outline:none;
    font-size:var(--t-md);color:var(--ink)}
  .gcomposer input::placeholder{color:var(--ink);opacity:.5}
  .gmic{flex:0 0 auto;width:24px;height:24px;cursor:pointer}

  /* segmented choice rows (watering schedule, quiet hours, message frequency) */
  .segrow{display:flex;gap:6px}
  .seg{flex:1;text-align:center;border:none;background:var(--card);
    border-radius:999px;padding:11px 8px;font-size:var(--t-sm);cursor:pointer;color:var(--ink)}
  .seg.on{background:var(--sage);color:var(--serif-ink);font-weight:500}

  /* choice chips / options / toggle */
  .chip{border:none;background:var(--card);border-radius:999px;padding:13px;
    cursor:pointer;font-size:var(--t-md);flex:1;text-align:center}
  .chip.on{background:var(--sage);color:var(--serif-ink);font-weight:500}
  .opt{border:none;border-radius:var(--r-sub);padding:15px 18px;cursor:pointer;
    background:var(--card)}
  .opt.on{background:var(--sage);color:var(--serif-ink)}
  .opt.on small{color:var(--serif-ink);opacity:.65}
  .opt b{font-size:var(--t-md)}
  .opt small{display:block;color:var(--mut);margin-top:2px}
  .field label{font-size:var(--t-sm);color:var(--mut);display:block;margin-bottom:6px;
    letter-spacing:.04em;font-weight:500}
  .field input{width:100%;border:none;border-radius:999px;padding:15px 18px;
    font-size:var(--t-md);background:var(--card);outline:none;color:var(--ink)}
  .field input::placeholder{color:var(--mut)}
  /* switch — the settings-card control from the mockup (415:1523/1524): a page-tint
     track with a sage knob when on. One switch for every settings card in the app. */
  /* flex:0 0 50px, not 0 0 auto: as a bare <div> the switch is an easy target
     for a container's own `> div` rule, and one of those (.psqtop's text-column
     rule) beat `flex:0 0 auto` on specificity and grew the Quiet-hours switch
     into the whole row. A stated basis makes the width the switch's own
     property rather than something its parent gets a vote on. */
  .toggle{width:50px;height:28px;border-radius:40px;background:var(--bg);
    border:none;position:relative;cursor:pointer;flex:0 0 50px;box-sizing:border-box}
  .toggle > i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#C6C7C0;border:none;
    transition:left .14s var(--soft),background .14s var(--soft)}
  .toggle.on > i{left:25px;background:var(--sage)}

  /* unobtrusive text action (log out) — deliberately not a button */
  .linkbtn{background:none;border:none;padding:6px;font-size:var(--t-sm);color:var(--mut);
    text-decoration:underline;cursor:pointer;align-self:center}
  .linkbtn:active{color:var(--ink)}

  /* text playback button — fixed size, so mock playback never shifts the layout */
  .listen{min-width:152px;height:42px;border:none;border-radius:999px;
    background:var(--card);color:var(--sage-deep);font-size:var(--t-sm);font-weight:500;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:0 18px;flex:0 0 auto}
  .listen:active{background:var(--box)}
  .listen.on{background:var(--sage);color:var(--serif-ink)}
  .eq{display:inline-flex;gap:2px;align-items:center;height:14px}
  .eq i{width:3px;height:6px;background:currentColor;border-radius:1px;
    animation:eq .7s infinite ease-in-out}
  .eq i:nth-child(2){animation-delay:.15s}
  .eq i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:5px}50%{height:14px}}

  /* CREATE-CHARACTER hero — the top ~⅔ is the plant + its pot, mirroring the plant
     card. The bubble + "Try it" button stay sticky so the line you're tuning is still
     on screen once the pot has scrolled away. */
  .cchero{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;
    margin:0 -16px;padding:0 16px 14px;border-bottom:1px solid var(--line2)}
  .ccbubble{position:sticky;top:0;z-index:6;width:100%;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 0 10px}

  /* compact 3×2 personality preset grid */
  .pgrid6{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ptile{border:none;border-radius:var(--r-sub);background:var(--card);cursor:pointer;
    padding:11px 5px;text-align:center;min-height:58px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px}
  .ptile:active{background:var(--box)}
  .ptile.on{background:var(--sage);color:var(--serif-ink)}
  .ptile b{font-size:var(--t-sm);line-height:1.15;font-weight:500}
  .ptile small{font-size:var(--t-sm);color:var(--mut);line-height:1.15}
  .ptile.on small{color:var(--serif-ink);opacity:.65}

  /* low-fi CONTINUOUS range slider (native input) — warm track, sage fill via an
     inline gradient, sage handle, no shadow. touch-action:none so dragging the
     handle never scrolls the screen. */
  .range{display:flex;flex-direction:column;gap:3px}
  .range-lab{display:flex;justify-content:space-between;font-size:var(--t-sm)}
  .range-lab b{font-weight:500}
  .range-lab small{color:var(--mut)}
  input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;
    border:0;padding:0;margin:12px 0;border-radius:999px;background:var(--box);
    outline:none;cursor:pointer;touch-action:none}
  input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:20px;height:20px;border-radius:50%;background:var(--sage-deep);border:2px solid #fff;cursor:pointer}
  input[type=range].rng::-moz-range-thumb{width:20px;height:20px;border:2px solid #fff;
    border-radius:50%;background:var(--sage-deep);cursor:pointer}
  input[type=range].rng::-moz-range-track{height:6px;border-radius:999px;background:var(--box)}
  input[type=range].rng::-moz-range-progress{height:6px;border-radius:999px;background:var(--sage-deep)}

  /* banner / push */
  .push{position:absolute;top:56px;left:12px;right:12px;background:var(--card);
    border:none;border-radius:var(--r-card);padding:14px 16px;z-index:20;
    display:flex;gap:10px;align-items:center;cursor:pointer;
    box-shadow:0 8px 24px rgba(30,12,0,.12)}
  .push .app{width:26px;height:26px;border-radius:9px;background:var(--sage);
    color:var(--serif-ink);display:flex;align-items:center;justify-content:center;
    font-size:var(--t-sm);flex:0 0 auto;border:none}

  /* modal overlay + bottom-anchored dialog (plant ⋯ menu actions) */
  .overlay{position:absolute;inset:0;background:rgba(30,12,0,.45);z-index:30;
    display:flex;align-items:flex-end;padding:18px}
  .dlg{background:var(--card);border-radius:var(--r-sheet);padding:20px;width:100%;
    display:flex;flex-direction:column;gap:10px}
  .divider{height:1px;background:var(--line2);margin:2px 0}
  .tag{font-size:var(--t-sm);background:var(--box);border-radius:999px;padding:3px 9px;color:var(--mut)}

  /* full-screen camera (add-plant photo step) */
  .camwrap{flex:1 1 auto;display:flex;flex-direction:column;background:#2B2A26;
    overflow:hidden;position:relative}
  .camtop{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#EDEEE9}
  .camtop .camhint{font-size:var(--t-sm);color:#C6C7C0}
  .camx{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:999px;
    padding:8px 14px;font-size:var(--t-sm);cursor:pointer}
  .camx:active{background:rgba(255,255,255,.28)}
  .camguide{flex:1;margin:6px 22px;border:2px dashed rgba(255,255,255,.5);border-radius:var(--r-card);
    display:flex;align-items:center;justify-content:center;color:#C6C7C0;font-size:var(--t-sm);
    letter-spacing:.04em;font-weight:500;text-align:center;
    background:repeating-linear-gradient(45deg,#37362F,#37362F 10px,#2F2E28 10px,#2F2E28 20px)}
  .camctrls{display:flex;align-items:center;justify-content:space-between;padding:16px 26px 22px}
  .shutter{width:66px;height:66px;border-radius:50%;background:#fff;border:4px solid #C9D6BC;
    cursor:pointer;padding:0}
  .shutter:active{transform:scale(.94)}
  .galthumb{width:44px;height:44px;border-radius:14px;border:none;color:#ddd;
    background:repeating-linear-gradient(45deg,#4A4941,#4A4941 6px,#3F3E37 6px,#3F3E37 12px);
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:var(--t-md)}
  .camspacer{width:44px;flex:0 0 auto}

  /* species reference image carousel (species-info screen)
     NOTE: an explicit min-height on the flex row is required — without it the
     row collapses to zero height under scroll-snap (same Safari flex-child bug
     as the plant pager), leaving only the dot indicators visible. */
  .carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    margin:0 -16px;padding:0 16px;gap:10px;min-height:180px;
    -webkit-overflow-scrolling:touch}
  .carousel::-webkit-scrollbar{height:0;display:none}
  .cslide{flex:0 0 358px;width:358px;max-width:calc(100vw - 40px);scroll-snap-align:center;
    height:180px;min-height:180px}

  /* pinned bottom action footer (species-info / long screens) — sits inside the
     scroll container, sticks to the bottom, and stays visible without scrolling */
  .footer{position:sticky;bottom:0;margin:auto -16px 0;padding:12px 16px 6px;
    background:var(--bg);border-top:1px solid var(--line2);
    display:flex;flex-direction:column;gap:10px;z-index:5}

  /* ── PROTOTYPE SHELL: flow index / shortcuts panel (dev/review tool, not app UI)
     A flat list of flow entry points — no container, text sits on the dark canvas,
     vertically centered against the phone. Warm-neutral tints so it reads as
     shell chrome next to the milky app palette without clashing. */
  .flowindex{position:fixed;top:50%;right:28px;transform:translateY(-50%);
    max-height:calc(100vh - 32px);overflow-y:auto;
    font-size:var(--t-md);line-height:1.7;color:#A6A49C}
  .fi-link{padding:7px 2px;cursor:pointer;color:#A6A49C}
  .fi-link:hover{color:#EDEEE9}

<!-- App source: type="text/plain" so Babel does NOT auto-process it.
     The bootstrap at the bottom transforms it with the CLASSIC runtime
     (React.createElement) so no `import` statements are ever emitted. -->
<script type="text/plain" id="app-src">
const { useState, useMemo, useEffect, useRef, createContext, useContext } = React;

/* ───────────────── EMOTION ENUM ─────────────────
   `glow` is the mood chip's fill AND its drop-shadow on the plant detail screen —
   one hex doing both jobs, exactly as the mockup builds it (415:1487). Only
   `content` is a measured value; the rest are derived in the same bright-pastel
   register, each pulling towards the colour that emotion already wears elsewhere
   in the app (warm coral for thirst, cool teal for the grump, and so on). */
// content, thirsty, overwatered, low-light, sleeping, greeting, cold, hot, urgent, neutral
const EMO = {
  content:      { face:"^‿^",  label:"All good",     tone:"ok",   word:"happy",   glow:"#CCF5B0" },
  thirsty:      { face:">_<",  label:"Thirsty",      tone:"warn", word:"thirsty", glow:"#F5C9B0" },
  overwatered:  { face:"@_@",  label:"Overwatered",  tone:"warn", word:"soggy",   glow:"#B0D9F5" },
  "low-light":  { face:"-_-",  label:"Needs light",  tone:"warn", word:"gloomy",  glow:"#DCD6B4" },
  sleeping:     { face:"-.-",  label:"Sleeping",     tone:"",     word:"sleepy",  glow:"#CDD2EA" },
  greeting:     { face:"^o^",  label:"Hi there!",    tone:"ok",   word:"chirpy",  glow:"#CCF5B0" },
  cold:         { face:":<",   label:"Cold",         tone:"warn", word:"cold",    glow:"#BFD6F5" },
  hot:          { face:">~<",  label:"Too hot",      tone:"warn", word:"too hot", glow:"#F5BFB0" },
  urgent:       { face:"O_O",  label:"Urgent!",      tone:"warn", word:"urgent",  glow:"#F5AEA4" },
  neutral:      { face:"._.",  label:"Okay",         tone:"",     word:"grumpy",  glow:"#C3F5EE" },
};

/* ───────────────── MOCK DATA ───────────────── */
const PLANTS = [

    reservoir:71, autoOn:true, schedule:"Every 2 days", amount:"Low",

const plantById = (id) => PLANTS.find(p=>p.id===id) || PLANTS[0];
/* A plant added through the Add Plant flow has no render, no avatar and no film
   of its own, so it carries `look` — the id of the plant whose art stands in for
   its species. Everything that reaches for art goes through here; everything
   that reaches for DATA still goes by the real id. */
const lookOf = (id) => { const x = PLANTS.find(p=>p.id===id); return (x && x.look) || id; };

/* NOTIFICATIONS = a digest of what actually needs the user OFFLINE. Social chatter
   ("Felix says hi") belongs in the chat and is deliberately absent here.
     kind:"urgent" → taps into the alert → diagnosis flow
     kind:"need"   → taps into the chat, focused on that plant's message */
const NOTIFS = [
  { id:"n1", plant:"felix", emo:"urgent",  kind:"urgent", time:"just now",
    text:"Felix needs a look — soggy soil and a cold draught" },
  { id:"n2", plant:"mary", emo:"thirsty", kind:"need",   time:"10 min ago",
    text:"Mary's reservoir is empty — she'd love a refill" },
  { id:"n3", plant:"gosha", emo:"low-light", kind:"need", time:"2 h ago",

];

/* Universal growth milestones — the same five for every plant, so the timeline
   reads consistently across the whole garden.

   FIVE, not six. The reworked rail (437:93) draws four dots and a thumb, and
   the reference state that names a middle stop puts "thriving" at the FOURTH
   of five positions (444:71 centred on 287, with stops at 17·107·197·287·385).
   Dropping "Established" is what makes the list land on the mockup exactly.
   Nothing else in the app reads MILESTONES — it feeds this one rail. */
const MILESTONES = [
  { stage:"Seed",        date:"2 Mar"  },
  { stage:"Sprout",      date:"12 Mar" },
  { stage:"Young plant", date:"18 Apr" },
  { stage:"Thriving",    date:"21 Jun" },
  { stage:"Now",         date:"Today"  },
];

/* The pot is self-aware: it already knows the reservoir was refilled and that the
   plant was moved, so the plants never hand out chores — they talk, they react,
   and they thank you. Message flags:
     cross:true  → the plant-to-plant banter thread, including the user's reply to it
                   (hidden when "plants talk to each other" is off, leaving Felix's
                   news, the congratulations and Mary's alert — still coherent)
     urgent:true → carries an inline "Check what happened" CTA into the alert
                   flow. Nothing sets it any more (see Mary's last line); the
                   mechanism stays because the shape it draws is still the one
                   an urgent message would want.
     rx          → reactions, [emoji, count]; everyone reacts to everyone */
const CHAT_INIT = [
  { who:"felix", at:"09:02",
    text:"New leaf today! The pot's already taking pictures — get my good side 🌿",
    rx:[["💚",2],["🎉",1]] },
  { who:"me",    at:"09:04", text:"Congrats, Felix! Looking great", rx:[["🌿",1]] },
  { who:"mary",  at:"09:06", cross:true,
    text:"Wait — nobody told me there was a photoshoot?! I would have turned my leaves.",
    rx:[["😂",2]] },
  { who:"gosha", at:"09:09", cross:true,
    text:"A leaf. Everyone's celebrating a leaf. It happens, you know.",
    rx:[["💅",1],["😂",1]] },
  { who:"me",    at:"09:11", cross:true,
    text:"Calm down, Gosha. It's just a leaf. Be happy for him.", rx:[["👍",1]] },
  /* No longer `urgent`. It was the only message in the app that carried a
     divider and a CTA into the alert flow, and a plant that files a support
     ticket is not the character this chat is written for — she mentions it and
     leaves it with you. The alert flow is still reached from Notifications,
     which is where a thing you must act on belongs. */
  { who:"mary",  at:"17:30",
    text:"Something feels a bit off today — my soil's soggy and it's chilly by this window." },
];

/* ───────────────── PERSONALITY MODEL (single source of truth) ─────────────────
   Six presets, each with default positions for THREE fixed sliders
   (warmth / drama / chattiness) and a small set of in-character line variants.
   Both the onboarding "create character" tuner and the plant-settings screen
   read from here. Slider values are CONTINUOUS 0–100. `words` is the spread of
   labels the handle passes through (index = which fifth of the range it's in). */
const SLIDERS = [
  { key:"warmth",     label:"Warmth",     words:["Dry","Reserved","Balanced","Warm","Affectionate"] },
  { key:"drama",      label:"Drama",      words:["Understated","Subtle","Balanced","Dramatic","Theatrical"] },
  { key:"chattiness", label:"Chattiness", words:["Rarely","Occasional","Balanced","Chatty","Often"] },
];
// map a 0–100 value to its word in a spread (equal buckets)
const wordFor = (words, val)=> words[Math.min(words.length-1, Math.floor(val/(100/words.length)))];
// thresholds that flip the sample-line variants (top / bottom fifth-ish)
const HI = 66, LO = 34;
const PERSONALITIES = {
  sliders: SLIDERS,
  presets: [
    { k:"Friendly", d:"Warm & easy", defaults:{warmth:84, drama:50, chattiness:84},
      lines:{
        terse:"Hey! Good to see you.",
        base:"Morning! So good to see you today — how are we doing?",
        big:"There you are! Honestly, you just made my whole day.",
        warm:"Missed you, you know.", dry:"Oh. Hello." },
      faces:{ base:"content", big:"greeting", terse:"content",
              warm:"greeting", dry:"neutral" } },
    { k:"Drama queen", d:"Season finale", defaults:{warmth:50, drama:84, chattiness:84},
      lines:{
        terse:"Ugh. Fine. Alive. Barely.",
        base:"This is, without question, the WORST day of my entire life. Probably.",
        big:"Call the papers — this is my FINAL act! One leaf left! Farewell, cruel windowsill!",
        warm:"…but I'm glad it's you who found me.", dry:"Whatever. You're here, I suppose." },
      faces:{ base:"thirsty", big:"urgent", terse:"overwatered",
              warm:"content", dry:"neutral" } },
    { k:"Grump", d:"Secretly caring", defaults:{warmth:16, drama:50, chattiness:16},
      lines:{
        terse:"Hmph. You again.",
        base:"Oh. It's you. …fine, I suppose it's good you came by.",
        big:"In MY day we didn't 'check in' — we just stood there and coped! Now shut the blinds.",
        warm:"…don't let it go to your head, but I did miss you.", dry:"Don't touch anything." },
      faces:{ base:"low-light", big:"hot", terse:"low-light",
              warm:"content", dry:"cold" } },
    { k:"Calm", d:"Zen & gentle", defaults:{warmth:50, drama:16, chattiness:50},
      lines:{
        terse:"All is well.",
        base:"All is well. Breathe. We're okay, you and me.",
        big:"Feel how the light moves through the room — nothing to fix, nothing to chase, just this.",
        warm:"I'm glad we share this quiet.", dry:"It is fine." },
      faces:{ base:"sleeping", big:"content", terse:"sleeping",
              warm:"content", dry:"neutral" } },
    { k:"Cheerful", d:"Sunny & peppy", defaults:{warmth:84, drama:50, chattiness:84},
      lines:{
        terse:"Hi! Lovely day!",
        base:"Hey hey! What a great day to be a plant. Loving this light!",
        big:"WOOHOO best day EVER — sunshine, water, AND you showed up?! I could burst!",
        warm:"So happy you're here!", dry:"…nice day, I guess." },
      faces:{ base:"greeting", big:"urgent", terse:"content",
              warm:"greeting", dry:"neutral" } },
    { k:"Sassy", d:"Playful bite", defaults:{warmth:50, drama:84, chattiness:50},
      lines:{
        terse:"Oh, look who it is.",
        base:"Took you long enough. I'm thriving, thanks for finally asking.",
        big:"Absolutely SERVING chlorophyll realness today and you're lucky to witness it, darling.",
        warm:"…you're kind of my favourite, don't tell the cactus.", dry:"Cool. Great. You're back." },
      faces:{ base:"hot", big:"hot", terse:"neutral",
              warm:"content", dry:"cold" } },
  ],
};
const personaByName = (k)=> PERSONALITIES.presets.find(p=>p.k===k) || PERSONALITIES.presets[0];

/* Live in-character sample line from continuous slider values. High drama → the
   "big" variant; low chattiness → the "terse" variant; high/low warmth appends an
   affectionate / dry tag. So dragging ANY slider across a threshold changes it. */
// which line variant the current slider values select — one source of truth for
// both the sentence and the face, so the two can never drift apart
function lineVariant(t){
  return t.drama>=HI ? "big" : (t.chattiness<=LO ? "terse" : "base");
}
function sampleLine(k, t){
  const L = personaByName(k).lines;
  let line = L[lineVariant(t)];
  if(t.warmth>=HI && L.warm)      line += " " + L.warm;
  else if(t.warmth<=LO && L.dry)  line += " " + L.dry;
  return line;
}

/* The emotion the pot wears while it "says" that line. Every preset maps its
   variants onto the existing EMO set, so changing preset changes the face, and
   dragging a slider across a threshold changes it again.
   The warmth tag re-colours the parting mood, EXCEPT on the "big" line — a
   theatrical sentence dominates whatever gets appended to it, so the face keeps
   the theatrical read. */
function faceFor(k, t){
  const F = personaByName(k).faces || {};
  const v = lineVariant(t);
  let emo = F[v] || F.base || "neutral";
  if(v !== "big"){
    if(t.warmth>=HI && F.warm)     emo = F.warm;
    else if(t.warmth<=LO && F.dry) emo = F.dry;
  }
  return emo;
}

/* Voice = timbre of the spoken sample (distinct from personality). */
const VOICES = [
  { k:"Warm",    d:"Gentle and reassuring" },
  { k:"Bright",  d:"Upbeat and lively" },
  { k:"Soft",    d:"Quiet and soothing" },
  { k:"Playful", d:"Cheeky and full of fun" },

const SPECIES = [
  "Ficus","Cannabis","Cactus","Aloe","Basil","Snake plant","Pothos","Peace lily",
  "Fern","Succulent","Orchid","Spider plant","Rubber plant","Philodendron","Calathea",
  "ZZ plant","Jade plant","Bamboo","English ivy","Lavender","Rosemary","Mint","Parlour palm",
];
// placeholder identity — comes from sign-up / social login in the real app
const USER_NAME = "Alexandra";

/* ───────────────── NAV ───────────────── */

/* ───────────────── SMALL COMPONENTS ───────────────── */

function Face({emotion, big, accent}){
  const e = EMO[emotion] || EMO.neutral;
  return <div className={"face"+(big?" big":"")+(accent?" accent":"")}>{e.face}</div>;
}

// Photo placeholder — the avatar. Emotion (if any) rides along as a corner badge.
function Photo({label="PHOTO", w, h=90, round, badge, style}){
  const e = badge && (EMO[badge] || EMO.neutral);
  return <div className={"ph"+(round?" round":"")}
    style={Object.assign({height:h, width:w, position:"relative", flex:w?"0 0 auto":undefined}, style||{})}>

}

function StatusPill({emotion}){
  const e = EMO[emotion] || EMO.neutral;
  return <span className={"pill"+(e.tone==="ok"?" accent":"")}>

  </span>;
}

function Toggle({on, onClick}){

}

/* Low-fi CONTINUOUS range slider (native input, 0–100). Grey track, accent fill via
   an inline gradient, accent handle, no shadow. Drag (mouse/touch) or tap the track;
   the right-hand label maps to a spread of words as the handle moves. */
function RangeSlider({label, words, val, onChange}){
  const word = wordFor(words, val);
  const lo = words[0], hi = words[words.length-1];
  const fill = `linear-gradient(to right, var(--accent) ${val}%, var(--line) ${val}%)`;
  return <div className="range">
    <div className="range-lab"><b>{label}</b><small>{word}</small></div>
    <input type="range" className="rng" min="0" max="100" step="1" value={val}
      style={{background:fill}} aria-label={label+": "+word}
      onChange={e=>onChange(Number(e.target.value))}/>
    <div className="range-lab"><small>{lo}</small><small>{hi}</small></div>
  </div>;
}

/* Compact 3×2 personality preset grid (6 presets). */
function PresetGrid({value, onChange}){
  return <div className="pgrid6">
    {PERSONALITIES.presets.map(x=>(
      <div key={x.k} className={"ptile"+(value===x.k?" on":"")} onClick={()=>onChange(x.k)}>
        <b>{x.k}</b><small>{x.d}</small>
      </div>
    ))}
  </div>;
}

/* The three fixed fine-tune sliders (warmth / drama / chattiness). */
function FineTuning({tune, onChange}){
  return <div className="card col" style={{gap:16}}>
    {PERSONALITIES.sliders.map(s=>(
      <RangeSlider key={s.key} label={s.label} words={s.words}
        val={tune[s.key]} onChange={i=>onChange(s.key,i)}/>
    ))}
  </div>;
}

/* Live in-character line as a speech bubble + a TEXT playback button beneath it.
   The button is fixed-size so mock playback never shifts the layout. Shared by the
   create-character hero (bubble coming off the pot) and plant settings. */
function LinePreview({preset, tune, playing, onPlay}){
  return <>
    <div className="pdspeech">{sampleLine(preset,tune)}</div>
    <button className={"listen"+(playing?" on":"")} onClick={onPlay}
      aria-label={playing?"Stop":"Play sample in the selected voice"}>
      {playing
        ? <><span className="eq"><i/><i/><i/></span>Playing…</>
        : <>▶ Try it</>}
    </button>
  </>;
}

/* Voice picker — timbre of the spoken line. Simple selectable rows (tap to select);
   playback lives only in the sticky preview, which speaks the line in this voice. */
function VoicePicker({value, onChange}){
  return <div className="field"><label>Voice</label>
    <div className="col">
      {VOICES.map(v=>(
        <div key={v.k} className={"opt"+(value===v.k?" on":"")} onClick={()=>onChange(v.k)}>
          <b>{v.k}</b><small>{v.d}</small>
        </div>
      ))}
    </div>
  </div>;
}

   PresetGrid / FineTuning / LinePreview stay: onboarding still builds on them. */

/* WINDOWSILL — the group chat. Plants message the user, talk to each other, and
   thank the user once the pot senses a need was handled offline. An urgent need
   carries a plain-text inline CTA under a hairline (no outlined box) that taps
   through into the alert → diagnosis flow. `focus` comes from a notification tap
   and scrolls to that plant's most recent message. */
function GardenChat({focus, open, onCollapse}){
  const nav = useNav();
  const { chatCross } = useApp();
  const [msgs,setMsgs] = useState(CHAT_INIT);
  const [text,setText] = useState("");
  // the top fade only exists while there IS hidden content above the viewport —
  // at the very first message the bubble must be fully lit, not dimmed
  const [scrolled,setScrolled] = useState(true);
  const scroller = useRef(null);
  const target = useRef(null);
  const onScroll = (e)=> setScrolled(e.currentTarget.scrollTop > 4);

  // "plants talk to each other" is controlled from the profile's chat settings
  const shown = chatCross ? msgs : msgs.filter(m=>!m.cross);
  // index of the message a notification pointed at, if any
  const hot = focus ? shown.map(m=>m.who).lastIndexOf(focus) : -1;

  useEffect(()=>{
    const el = scroller.current;
    if(!el) return;
    // a focused message wins; otherwise land on the newest (the urgent one)
    if(target.current) el.scrollTop = Math.max(0, target.current.offsetTop - 120);
    else el.scrollTop = el.scrollHeight;
    setScrolled(el.scrollTop > 4);
  },[shown.length]);

  // while the hero expands/collapses the pane changes height — keep the stream
  // pinned to its newest message for the whole 460ms so it reads as "pushed down"
  useEffect(()=>{
    const el = scroller.current;
    if(!el || target.current) return;
    let raf, stop = false;
    const pin = ()=>{ if(stop) return; el.scrollTop = el.scrollHeight; raf = requestAnimationFrame(pin); };
    pin();
    const t = setTimeout(()=>{ stop = true; cancelAnimationFrame(raf);
      setScrolled(el.scrollTop > 4); }, 520);
    return ()=>{ stop = true; cancelAnimationFrame(raf); clearTimeout(t); };
  },[open]);

  const send = ()=>{
    if(!text.trim()) return;
    const t = text;
    setText("");
    setMsgs(m=>[...m,{who:"me",text:t,at:"now"}]);
    setTimeout(()=>setMsgs(m=>[...m,
      {who:"mary",at:"now",text:"love it when you message us 💚"}]),400);
  };

  return <>
    {/* while the hero is open the stream is frozen, so a scroll gesture over it is
        unambiguous: it means "give me the chat back" */}
    <div className="gchat" onClick={()=> open && onCollapse()}
      onWheel={()=> open && onCollapse()}
      onTouchMove={()=> open && onCollapse()}>
      <div className="gscroll" ref={scroller} onScroll={onScroll}>
        {shown.map((m,i)=>{
          const isMe = m.who==="me";
          const p = !isMe && plantById(m.who);
          const av = AVATAR[lookOf(m.who)];
          const shape = isMe ? "me" : (m.urgent ? "alert" : "them");
          return <div key={i} className={"grow-row "+(isMe?"me":"them")+(m.rx?" rx":"")}
            ref={i===hot ? target : null}>
            {/* a plant's avatar is the way from the chat into its card */}
            <div className={"gmava"+(av?" art":"")+(isMe?"":" tap")}
              title={isMe?null:("Open "+p.name.split(" ")[0]+"'s card")}
              onClick={isMe?null:(ev=>{ev.stopPropagation();nav.go("plant",{id:m.who});})}>
              {av && <img src={av.src} alt="" className={av.round?"round":null}
                style={{width:av.w,height:av.h,left:av.l,top:av.t}}/>}
            </div>
            <div className="gbub" style={{backgroundImage:
              blobBg(shape, isMe ? BUBBLE.me : (BUBBLE[lookOf(m.who)]||BUBBLE.mary))}}>
              {!isMe && <div className="gmeta">
                <b>{p.name.split(" ")[0]}</b><span>{m.at}</span>
              </div>}
              <div className="gtext">{m.text}</div>
              {/* inline CTA — plain text over a hairline, never an outlined box */}
              {m.urgent && <>
                <div className="gline"/>
                <div className="glink" onClick={e=>{e.stopPropagation(); nav.go("alert");}}>
                  Check what happened
                </div>
              </>}
              {m.rx && <div className="grx">
                {m.rx.map(([e,n])=>(
                  <div className="grxchip" key={e}>{e}<span>{n}</span></div>
                ))}
              </div>}
            </div>
          </div>;
        })}
      </div>
    </div>
    <div className={"gfade"+(scrolled?" on":"")}/>

    {/* composer — elongated pill, microphone in place of a send arrow */}
    <div className="gcomposer" onClick={e=>e.stopPropagation()}>
      <input value={text} placeholder="Message to your plants"
        onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
      <span className="gmic" title="Hold to speak" onClick={send}><IconMic/></span>
    </div>
  </>;
}

/* ═════════════════ PLANT DETAIL (Figma "concept2" 417:1537) ═════════════════
   TWO LAYERS. The photo/video is a full-bleed background that never moves and
   runs edge to edge, behind the status bar included. Everything else — nav bar,
   species + mood chip, speech blob, timeline, info cards — lives in one scroller
   that rides over it, so scrolling climbs the cards up the photo to reveal the
   stats and the auto-watering toggle while the picture stays put.

   The stage is TWO REAL FILMS, not a poster (see FILM below). Timeline position
   maps linearly onto the growth film's currentTime, the right end being "now",
   and the swap between the two films is choreographed so that neither the cut
   nor the reframing is ever visible. */

/* the milestone labels, lowercase as the mockup sets them */
const TL = MILESTONES.map(m=>m.stage.toLowerCase());

/* ── THE TWO FILMS (Figma 437:93) ────────────────────────────────────────────
   still-vlad.mp4   the "now" state — a gentle idle loop of the grown plant,
                    running at the -184px framing. 976×2124, 5.04s.
   growth-vlad.mp4  the growth timeline, same size and length.

   The direction matters and the FILE, not the brief, settles it: growth-vlad's
   frame 0 is the fully grown bonsai (0.51/255 mean pixel difference from
   still-vlad's frame 0 — the same image), and its LAST frame is the seedling.
   The file is authored grown → sprout. So "now" is t=0 and scrubbing back in
   time runs FORWARD through the file: t = (1 - pos) * duration. Written the
   other way round it would grow as you scrubbed into the past, which is the one
   thing that must not happen.

   EVERY plant now has its own three films, named by id — the map that used to
   be the seam is now the real thing. FILM_HAVE is what assets/video actually
   holds; an id outside it falls back to Vlad, who is the plant every one of
   these frames was drawn from and so the only honest stand-in.

   All fifteen files agree with what the geometry above assumes: still- and
   growth- are 976×2124 / 5.042s to the frame, exactly like Vlad's, so the
   framings, the scrub mapping and the direction all carry over untouched. */
const FILM_HAVE     = ["felix","mary","gosha","vera","vlad"];
const FILM_FALLBACK = "vlad";
const filmId  = (id)=> FILM_HAVE.indexOf(id) >= 0 ? id : FILM_FALLBACK;
const filmSrc = (id,kind)=> "assets/video/" + kind + "-" + filmId(id) + ".mp4";
const filmFor = (id)=> ({ still:filmSrc(id,"still"), growth:filmSrc(id,"growth") });

/* Personality & Settings has its own film per plant (446:93). Same plant, its
   own take: a still, breathing portrait with the pot's face lit, framed for a
   stage that scrolls away rather than for a scrub rail. */
const psFilm = (id)=> filmSrc(id,"settings");

/* the two stage framings, straight off the mockup's own "still 1" rects */
const PD_Y     = { still:-184, growth:0 };   // 428:1782 / 437:90
const PD_SLIDE = 420;   // the -184 ⇄ 0 glide; must match .pdvid-still's transition
const PD_FADE  = 180;   // the cross-fade that covers the swap

/* ── HOW HARD THE FILM CHASES THE FINGER ─────────────────────────────────────
   Two speeds, and which one is in play is decided per scrub by how far the
   request moved.

     1        the film IS the finger — currentTime is written straight from the
              thumb's position, frame for frame. This is what a continuous
              scrub has to feel like: rev 26 eased every scrub at PD_EASE, which
              needs ~26 frames to close a long drag and left the film visibly
              trailing the thumb — near enough to "the drag doesn't move the
              video" to be reported as exactly that.
     PD_EASE  the film glides there under its own steam. Right for a JUMP: a
              press landing far from the thumb, or the hand-over back to "now",
              where a cut would be ugly and nobody is tracking a finger.

   PD_SCRUB_JUMP is the line between them — 0.08 of the rail, ~28px, comfortably
   more than any single pointermove or wheel notch and comfortably less than a
   deliberate tap somewhere else. */
const PD_EASE       = 0.22;
const PD_SCRUB_JUMP = 0.08;

/* The blur is a SCROLL STATE, and the mockup is what settles that. Aligning
   428:1782's film against the raw mp4 frame band by band gives sharpness ratios
   of 0.93 / 0.98 / 0.99 — the mockup's film is not blurred anywhere. It is
   drawn at rest, which is exactly the moment before the cards "scroll up and
   overlap the video". So strength ramps with scroll progress from nothing at
   rest to full at the bottom, while POSITION tracks the cards independently.
   That is the only reading that satisfies the brief and the mockup at once.

   PD_BLUR_LEAD is how far above the cards' own top edge the ramp begins. The
   cards are opaque #FFF, so a ramp starting exactly at their edge would be both
   invisible and a discontinuity on the boundary — the one thing "no hard blur
   edge" rules out.

   150, up from rev 25's 72. The brief asks for a blur that starts higher and
   bites harder, and those are two different knobs: LEAD is the reach and the
   four layers' radii are the strength. Both moved, and the layers were pulled
   up inside the lead as well (see .pdblur), because the band ABOVE the cards is
   the only part of the ramp that is ever visible — under them the film is
   behind opaque white. The ramp still starts at zero, so there is no edge. */
const PD_BLUR_LEAD = 150;

/* ── THE RAIL'S GEOMETRY, in the mockup's own pixels ────────────────────────
   The line is broken around every stop. These are the holes' radii, measured
   from each stop's centre: 5px around a 6px dot and 10px around the 16px
   thumb, i.e. 2px of clear film either side of both (444:23/26 against
   444:27/28, confirmed by a pixel probe across 441:633 at y 716). */
const PD_TL_DOTGAP   = 5;
const PD_TL_THUMBGAP = 10;
/* How near a stop counts as standing ON it. Two different tolerances, because
   they answer two different questions:
     ACTIVE, in gaps — when does the stop's word light up. A quarter-gap is
       generous enough that the word arrives as you approach and honest enough
       that the middle of a span shows nothing, which is the mockup's own
       centred state (441:633: thumb at 333, no word lit).
     MERGE, in rail fractions — when has the thumb physically swallowed the dot.
       That one is not a taste call: it is the thumb's own reach, 10px over the
       368px rail, and it is why 444:18 has no dot under its thumb. */
const PD_TL_ACTIVE = 0.28;
const PD_TL_MERGE  = 10/368;
/* The mockup's rail width, and the shortest piece of line worth drawing on it.
   As the thumb closes on a neighbouring dot the segment between them shrinks to
   a two-pixel speck that reads as dirt rather than as rail, so anything under
   4px is dropped and the two holes simply sit side by side. */
const PD_TL_RAILW  = 368;
const PD_TL_MINSEG = 4;

/* The cards' glide home when a scrub starts. 420ms on a quartic ease-out is the
   same shape --soft draws, so it reads as their own collapse rather than a jump. */
const PD_COLLAPSE = 420;

/* 445:90 reads "Every 2nd day at 7am". That is a SENTENCE FORM, not a string to
   paste: the cadence is the plant's own `schedule` ("Every 3 days") and the
   hour is the one every auto-watering in this prototype runs at, so the card
   states what is actually configured rather than what one mockup happened to
   show. Vlad therefore reads "Every 3rd day at 7am". */
const PD_WATER_HOUR = "7am";
const ordinal = (n)=>{
  const t = n % 10, h = n % 100;
  return n + ((t===1 && h!==11) ? "st" : (t===2 && h!==12) ? "nd"
            : (t===3 && h!==13) ? "rd" : "th");
};
const scheduleLine = (pl)=>{
  const m = /(\d+)/.exec(pl.schedule || "");
  return m ? "Every " + ordinal(+m[1]) + " day at " + PD_WATER_HOUR
           : (pl.schedule || "") + " at " + PD_WATER_HOUR;
};

function PlantDetail({params}){
  const nav = useNav();
  const p = plantById((params&&params.id)||"vlad");
  const e = EMO[p.emotion] || EMO.neutral;
  const film = filmFor(lookOf(p.id));  // this plant's own two films
  const last = TL.length - 1;

  const [pos,setPos]   = useState(1);        // 0…1 along the timeline; 1 = "now"
  const [menu,setMenu] = useState(false);
  const [auto,setAuto] = useState(p.autoOn);
  /* Two booleans the rest of the screen reads off. `drag` is the rail being
     held — it lights the drag indicator. `atTop` is the cards sitting at their
     default position — together with pos===1 it is the ONLY state in which the
     plant's greeting is on screen. Both are mirrored from refs/measurements
     rather than being the source of truth, so nothing re-renders per frame. */
  const [drag,setDrag]   = useState(false);
  const [atTop,setAtTop] = useState(true);

  /* ── THE STAGE ────────────────────────────────────────────────────────────
     Two films stacked in one box. `sy` is the still film's Y, handed to a CSS
     transition; `gOn` fades the growth film in over it. Nothing else about the
     stage is React state — the scrub itself runs on refs and rAF, because it
     has to keep up with a finger. */
  const [sy,setSy]   = useState(PD_Y.still);
  const [gOn,setGOn] = useState(false);

  const stillV = useRef(null);
  const growV  = useRef(null);
  const rail   = useRef(null);
  const raf    = useRef(0);
  const timers = useRef([]);
  const dur    = useRef(0);    // growth film's usable duration
  const want   = useRef(1);    // where the finger is, 0…1 (1 = now)
  const shown  = useRef(1);    // where the film is, chasing `want`
  const chase  = useRef(PD_EASE);   // …at this rate; see PD_SCRUB_JUMP
  /* still → down → growth → fadeOut → up → still. `down` and `up` are the
     -184 ⇄ 0 glides, `fadeOut` is the cross-fade home. A ref, not state: the
     visible consequences are all in `sy`/`gOn` and re-rendering on every step
     of the machine would only fight the scrub. */
  const phase  = useRef("still");

  const after = (ms,fn)=>{ timers.current.push(setTimeout(fn,ms)); };
  const stopTimers = ()=>{ timers.current.forEach(clearTimeout); timers.current = []; };

  /* ── going back in time ───────────────────────────────────────────────────
     Order is everything. Glide the still film from -184 down to 0 FIRST, and
     only once it has landed cross-fade the growth film in on top of it: both
     films are at 0 at that moment and growth's t=0 is, pixel for pixel, the
     still film's image, so there is nothing left to flash or jump. */
  const toGrowth = ()=>{
    const ph = phase.current;
    if(ph === "growth" || ph === "down") return;
    stopTimers();
    if(ph === "fadeOut"){          // caught inside the cross-fade — just turn round
      phase.current = "growth"; setGOn(true);
      after(PD_FADE, ()=>{ const v = stillV.current; if(v) v.pause(); });
      kick(); return;
    }
    // from "still", or from "up" with the film part-way back up: same glide,
    // and the transition takes its full 420ms from wherever it stands
    phase.current = "down";
    setSy(PD_Y.growth);
    after(PD_SLIDE, ()=>{
      const g = growV.current;
      if(g){ try{ g.pause(); g.currentTime = 0; }catch(err){} }
      phase.current = "growth";
      setGOn(true);
      after(PD_FADE, ()=>{ const v = stillV.current; if(v) v.pause(); });
      kick();
    });
  };

  /* ── and coming home ──────────────────────────────────────────────────────
     The same three beats in reverse: the growth film has to have reached its
     "now" frame before it fades, and the still film only starts climbing back
     to -184 once it is the only thing on screen. */
  const toStill = ()=>{
    const ph = phase.current;
    if(ph === "still" || ph === "fadeOut" || ph === "up") return;
    stopTimers();
    if(ph === "down"){             // never got as far as the swap — just climb back
      phase.current = "up";
      setSy(PD_Y.still);
      after(PD_SLIDE, ()=>{ phase.current = "still"; });
      return;
    }
    phase.current = "fadeOut";
    const v = stillV.current;
    if(v){ const q = v.play(); if(q && q.catch) q.catch(()=>{}); }
    setGOn(false);
    after(PD_FADE, ()=>{
      phase.current = "up";
      setSy(PD_Y.still);
      after(PD_SLIDE, ()=>{ phase.current = "still"; });
    });
  };

  /* ── the scrub ────────────────────────────────────────────────────────────
     A pointermove fires far more often than a video can seek, so the handler
     only records where the finger is and the film is moved once per animation
     frame. How far it moves is `chase`: all the way, for a continuous scrub, or
     a fraction of the way, for a jump (see PD_SCRUB_JUMP).

     `shown` is deliberately frozen unless the growth film is actually on
     screen — tick() returns early otherwise. That is what lets the still film
     sit at "now" through the whole 420ms hand-over no matter where the finger
     has got to, and it is also why a live scrub cannot tear the cross-fade: the
     growth film takes up the finger's position on the first frame it exists, at
     opacity 0, and the 180ms fade turns what would have been a cut into a
     dissolve from "now" to wherever the drag has reached. */
  const tick = ()=>{
    raf.current = 0;
    if(phase.current !== "growth") return;
    const g = growV.current, d = dur.current;
    const diff = want.current - shown.current;
    /* chase is 1 for a continuous scrub and PD_EASE for a jump; either way the
       film only moves once it is actually on screen, which is what keeps the
       cross-fade honest (see below). */
    shown.current = (chase.current >= 1 || Math.abs(diff) <= 0.0006)
      ? want.current
      : shown.current + diff*chase.current;
    if(g && d > 0){
      const t = (1 - shown.current) * d;      // now = t 0; back in time = forward
      if(Math.abs(g.currentTime - t) > 0.003){ try{ g.currentTime = t; }catch(err){} }
    }
    if(want.current >= 0.9994 && shown.current >= 0.9994){ shown.current = 1; toStill(); return; }
    if(shown.current !== want.current) raf.current = requestAnimationFrame(tick);
  };
  const kick = ()=>{ if(!raf.current) raf.current = requestAnimationFrame(tick); };

  /* ── THE SCRUB — one handler, every input ─────────────────────────────────
     A finger on the rail, a trackpad gesture over it, and anything else that
     ever moves the thumb all arrive here and nowhere else, so there is exactly
     one description of what a position means: it is the thumb, it is `pos`, and
     it is the growth film's currentTime, always the same three at once.

     The only thing an input decides is the CHASE, and it decides it by its own
     step size rather than by announcing what kind of input it is — a small step
     is somebody tracking, a large one is somebody jumping. */
  const scrub = (frac)=>{
    const f = Math.max(0, Math.min(1, frac));
    chase.current = Math.abs(f - want.current) > PD_SCRUB_JUMP ? PD_EASE : 1;
    want.current = f;
    setPos(f);
    /* leaving "now" is what starts the whole sequence — a bare tap ON now does
       not, because nothing has been scrubbed yet */
    if(f < 0.9994) toGrowth();
    else if(phase.current === "down") toStill();
    kick();
  };

  // the growth film never plays; it is seeked. Park it on its "now" frame and
  // keep the last 40ms back, because seeking to the exact tail is unreliable.
  const onGrowMeta = ()=>{
    const g = growV.current; if(!g) return;
    const d = g.duration;
    dur.current = (isFinite(d) && d > 0) ? Math.max(0, d - 0.04) : 0;
    try{ g.pause(); g.currentTime = 0; }catch(err){}
  };

  useEffect(()=>{
    // muted is set imperatively as well as declaratively: it is the condition
    // for autoplay, and it has to be true before play() is called
    const v = stillV.current, g = growV.current;
    if(g) g.muted = true;
    if(v){ v.muted = true; const q = v.play(); if(q && q.catch) q.catch(()=>{}); }
    return ()=>{ stopTimers(); if(raf.current) cancelAnimationFrame(raf.current); };
  },[]);

  /* ── the blur follows the cards ───────────────────────────────────────────
     .pdblur lives in .pdbg and the cards live in .pdscroll, so nothing but a
     measurement connects them. One read of the cards' top edge per scroll frame
     is enough, and rAF-coalescing it means a fast flick writes one style per
     frame rather than one per scroll event. */
  const bgEl  = useRef(null);
  const blurEl= useRef(null);
  const cards = useRef(null);
  const braf  = useRef(0);
  const scroller = useRef(null);
  const syncBlur = ()=>{
    braf.current = 0;
    const b = blurEl.current, c = cards.current, g = bgEl.current, s = scroller.current;
    if(!b || !c || !g || !s) return;
    // position: follow the cards
    const y = c.getBoundingClientRect().top - g.getBoundingClientRect().top;
    b.style.top = (y - PD_BLUR_LEAD) + "px";
    // strength: nothing at rest, full at the bottom of the scroll
    const range = s.scrollHeight - s.clientHeight;
    const prog = range > 0 ? Math.max(0, Math.min(1, s.scrollTop / range)) : 0;
    for(let i = 0; i < b.children.length; i++) b.children[i].style.opacity = prog;
    /* the same measurement answers "are the cards still down?", which is what
       gates the greeting. 8px of slack absorbs a rubber-band overshoot; React
       bails out of the re-render whenever the boolean has not actually flipped,
       so this costs nothing on the frames where the answer is unchanged. */
    setAtTop(s.scrollTop < 8);
  };
  const onScroll = ()=>{ if(!braf.current) braf.current = requestAnimationFrame(syncBlur); };
  useEffect(()=>{
    syncBlur();                       // land it before the first paint the user sees
    return ()=>{ if(braf.current) cancelAnimationFrame(braf.current); };
  },[]);

  /* Pointer capture normally guarantees the matching pointerup, but a capture
     can be lost (a system gesture, a context menu, a cancelled touch) and the
     drag indicator would then be stranded on screen. A window-level release is
     the backstop; it is idempotent, so it costs nothing when capture worked. */
  useEffect(()=>{
    const end = ()=>{ dragging.current = false; setDrag(false); };
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", end);
    return ()=>{ window.removeEventListener("pointerup", end);
                 window.removeEventListener("pointercancel", end);
                 if(stween.current) cancelAnimationFrame(stween.current); };
  },[]);

  /* ── the cards get out of the way ─────────────────────────────────────────
     Starting a scrub with the sheet pulled up is a contradiction: the thing you
     are scrubbing is the film the cards are covering. So they glide home. Hand-
     tweened rather than handed to scrollTo({behavior:"smooth"}), because that
     is the browser's curve and duration, not this file's — 420ms on 1-(1-t)⁴ is
     the shape --soft draws, i.e. the motion the sheet already has. */
  const stween = useRef(0);
  const collapseCards = ()=>{
    const s = scroller.current;
    if(!s || s.scrollTop <= 0) return;
    if(stween.current) cancelAnimationFrame(stween.current);
    const from = s.scrollTop, t0 = (typeof performance!=="undefined"?performance.now():Date.now());
    const step = ()=>{
      const now = (typeof performance!=="undefined"?performance.now():Date.now());
      const t = Math.min(1, (now - t0) / PD_COLLAPSE);
      s.scrollTop = from * (1 - (1 - Math.pow(1-t, 4)));
      stween.current = t < 1 ? requestAnimationFrame(step) : 0;
    };
    stween.current = requestAnimationFrame(step);
  };

  const fracFrom = (ev)=>{
    const el = rail.current; if(!el) return want.current;
    const r = el.getBoundingClientRect();
    return r.width ? (ev.clientX - r.left) / r.width : want.current;
  };
  const dragging = useRef(false);
  /* The press is taken on .pdtimeline, which spans the words, the rail and the
     band around them, and every child is pointer-events:none — so a press
     ANYWHERE along the timeline picks the thumb up and scrubs from there. The
     position comes from the rail's own rect, so the thumb lands under the
     finger rather than jumping by the wrapper's padding. */
  const down = (ev)=>{
    dragging.current = true;
    setDrag(true);
    collapseCards();
    try{ ev.currentTarget.setPointerCapture(ev.pointerId); }catch(err){}
    scrub(fracFrom(ev));
  };
  const move = (ev)=>{ if(dragging.current) scrub(fracFrom(ev)); };
  const up   = ()=>{ dragging.current = false; setDrag(false); };
  /* a horizontal trackpad gesture over the rail scrubs it; a vertical one is
     left alone, because the sheet under the timeline is a scroller now and
     hijacking its wheel would trap the page */
  const wheel = (ev)=>{
    if(Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) scrub(want.current + ev.deltaX/1400);
  };

  /* ── WHAT THE RAIL DRAWS ──────────────────────────────────────────────────
     `onStop` is the stop the thumb is standing on, or -1 for the spans in
     between. It drives everything: which word is bright, whether a middle word
     is on screen at all, and whether that stop's dot still exists.

     Every word IS mounted at every position — the two ends resting at .6, the
     middle ones at 0 — so lighting one up is a fade rather than a mount. The
     ends are anchored to the edges (the mockup sets "seed" at x 14 and "now"
     flush right) and a middle word is centred on its own stop, which is where
     444:71 puts "thriving": centre 286.5 against a stop at 287. */
  const onStop = (()=>{ const k = Math.round(pos*last);
                        return Math.abs(pos*last - k) <= PD_TL_ACTIVE ? k : -1; })();
  const labelPos = (i)=> i===last ? {right:0} : i===0 ? {left:0}
                       : {left:((i/last)*100)+"%", transform:"translateX(-50%)"};

  /* The line is the space BETWEEN holes. One hole per surviving dot plus a
     wider one for the thumb; sort them and every consecutive pair is a segment.
     Written this way the rail needs no special cases: it ends at the outermost
     stop because that stop is the outermost hole, it re-splits itself as the
     thumb travels, and when the thumb lands on a stop the two holes become one
     because the dot has already been dropped. Percent for the stop, pixels for
     the hole — calc() carries both, and max() keeps a segment from going
     negative as the thumb closes on its neighbour. */
  const covered = (f)=> Math.abs(f - pos) <= PD_TL_MERGE;
  const holes = [];
  for(let i = 0; i <= last; i++) if(!covered(i/last)) holes.push({f:i/last, g:PD_TL_DOTGAP});
  holes.push({f:Math.max(0, Math.min(1, pos)), g:PD_TL_THUMBGAP});
  holes.sort((a,b)=> a.f - b.f);
  const segs = [];
  for(let k = 0; k < holes.length - 1; k++){
    const a = holes[k], b = holes[k+1];
    if((b.f - a.f) * PD_TL_RAILW - (a.g + b.g) < PD_TL_MINSEG) continue;
    segs.push({ left:  "calc("+(a.f*100).toFixed(3)+"% + "+a.g+"px)",
                width: "max(0px, calc("+((b.f-a.f)*100).toFixed(3)+"% - "+(a.g+b.g)+"px))" });
  }

  /* The greeting is the live plant talking, so it is on screen in exactly one
     state: the film at "now" with the sheet still down. Scrub away from now, or
     pull the cards up over the film, and it withdraws. */
  const greeting = atTop && pos > 0.9994;

  return <div className="pdscreen" onClick={()=>menu&&setMenu(false)}>

    {/* 1 — THE STAGE: a full-bleed film background that never scrolls. It
        reaches up behind the status bar, so the bleed starts at the true top of
        the screen. Two films live here: the idle loop, which carries the Y
        animation, and the growth film above it, which only ever fades. */}
    <div className="pdbg" ref={bgEl}>
      <video className="pdvid pdvid-still" key={film.still} ref={stillV} src={film.still}
        muted loop autoPlay playsInline preload="auto"
        style={{transform:"translate3d(0,"+sy+"px,0)"}}/>
      <video className="pdvid pdvid-grow" key={film.growth} ref={growV} src={film.growth}
        muted playsInline preload="auto" onLoadedMetadata={onGrowMeta}
        style={{opacity:gOn?1:0}}/>
      {/* four masked backdrop-filters that ramp into one another; syncBlur()
          writes the top edge from the cards' measured position */}
      <div className="pdblur" ref={blurEl} aria-hidden="true">
        <i/><i/><i/><i/>
      </div>
    </div>

    {/* 2 — the header: outside the scroller, so it cannot move or bounce */}
    <div className="pdhead">

      <div className="plhead">
        <span className="plback" onClick={nav.back} title="Back"><IconChevronLeft/></span>
        <h1 className="pltitle">{p.name.split(" ")[0]}</h1>
        {/* The ⋯ and its popover travel together: the shell is the anchor, so
            the menu opens against the ICON instead of against a screen
            coordinate. One destination now — the watering schedule moved into
            the auto-watering card, where the schedule it edits already is. */}
        <span className="plmorewrap">
          <span className="plmore" title="More"
            onClick={ev=>{ev.stopPropagation();setMenu(m=>!m);}}><IconMore/></span>
          {menu && <div className="pdmenu" onClick={ev=>ev.stopPropagation()}>
            <div onClick={()=>{setMenu(false);nav.go("plantSettings",{id:p.id});}}>
              Personality &amp; Settings</div>
          </div>}
        </span>
      </div>

      <div className="pdrow">
        <span className="pdsp">{p.species}</span>
        <span className="moodchip" style={{background:e.glow,
          filter:"drop-shadow(0 0 15px "+e.glow+")"}}>{e.word}</span>
      </div>

      {/* the plant's own words, in a white organic blob. No quote marks. It is
          only here at "now" with the sheet down; see `greeting`. */}
      <div className={"pdbubwrap"+(greeting?"":" off")}>
        <div className="pdbub" style={{backgroundImage:blobBg("speech","#FFFFFF")}}>
          {p.checkin}
        </div>
      </div>
    </div>

    {/* 3 — the scroller now carries the timeline and the cards, nothing else */}
    <div className="pdscroll" ref={scroller} onScroll={onScroll}>

      {/* open photo — this is what the lower block is pushed down by */}
      <div className="pdspacer"/>

      <div className="pdlower">
        {/* 3 — the scrub: press anywhere along it, position maps linearly to
            currentTime. The halo is drawn before the thumb so it spreads under
            it and the thumb keeps its own hard edge. */}
        <div className={"pdtimeline"+(drag?" drag":"")}
          onPointerDown={down} onPointerMove={move}
          onPointerUp={up} onPointerCancel={up} onWheel={wheel}>
          <div className="pdtllab">
            {TL.map((label,i)=>{
              const cls = [];
              if(i!==0 && i!==last) cls.push("mid");
              if(i===onStop) cls.push("on");
              return <span key={label} className={cls.join(" ")}
                style={labelPos(i)}>{label}</span>;
            })}
          </div>
          <div className="pdtlrail" ref={rail}>
            {segs.map((st,k)=><span key={k} className="pdtlseg" style={st}/>)}
            {TL.map((label,i)=> !covered(i/last) &&
              <span key={label} className="pdtldot"
                style={{left:((i/last)*100)+"%"}}/>)}
            <span className="pdtlhalo" style={{left:(pos*100).toFixed(3)+"%"}}/>
            <span className="pdtlthumb" style={{left:(pos*100).toFixed(3)+"%"}}/>
          </div>
        </div>

        {/* 4 — the info cards, all in the canonical settings-card style. The
            bond card overlaps the bottom of the photo and the stat cards peek
            12px above the screen edge, which is the scroll affordance. */}
        <div className="pdcards" ref={cards}>
          <div className="scard">
            <div className="scard-t">Your bond</div>
            <div className="pdbondmeta">
              <span className="scard-l">Level {p.bondLevel}</span>
              <span className="pdsep"/>
              <span className="scard-l">{p.bondTitle}</span>
            </div>
            <div className="sbar"><i style={{width:p.bondPct+"%"}}/></div>
          </div>

          <div className="pdstats">
            <div className="pdstat">
              <div className="scard-l">Last watering</div>
              <div className="scard-v">{p.lastWatered}</div>
            </div>
            {/* the reservoir card fills itself to its own level */}
            <div className="pdstat">
              <span className="reswater"
                style={{height:p.reservoir+"%", backgroundImage:WATER}}/>
              <div className="scard-l">Reservoir</div>
              <div className="scard-v xl">{p.reservoir}%</div>
            </div>
            <div className="pdstat">
              <div className="scard-l">Light</div>
              <div className="scard-v">{p.light}</div>
            </div>
          </div>

          {/* 445:85 — title + toggle, the schedule it is running, a hairline,
              then the way in to change it. "Customise" goes to the watering
              screen this app already has rather than being a dead target. */}
          <div className="scard">
            <div className="pdauto">
              <div className="scard-t">Auto-watering</div>
              <Toggle on={auto} onClick={()=>setAuto(a=>!a)}/>
            </div>
            <div className={"pdautomore"+(auto?"":" off")}>
              <div className="pdautosub">{scheduleLine(p)}</div>
              <div className="pdautodiv"/>
              <div className="pdautoact"
                onClick={()=>nav.go("waterConfig",{id:p.id})}>Customise</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>;
}

/* ═══════════ AUTO-WATERING SETTINGS (Figma "concept2" 447:131) ═══════════
   Reached from "Customise" on the Plant Detail auto-watering card, and Back
   returns there. Two questions, three answers each, one of which is marked as
   the recommendation — and nothing else, because that is all 447:131 draws.

   "best choice" rides the MIDDLE option permanently, not the selected one. The
   mockup only ever shows it on a sage card, which reads two ways; the other
   reading — that it is part of being selected — would have "High" become the
   best choice the moment you picked it, which is not what a recommendation is. */
const AW_EVERY = [
  { k:"Every 1 day",  label:"1 day"  },
  { k:"Every 2 days", label:"2 days", best:true },
  { k:"Every 5 days", label:"5 days" },
];
const AW_AMOUNT = [
  { k:"Low" }, { k:"Medium", best:true }, { k:"High" },
];
/* The plants carry cadences the mockup's three do not offer (Felix every 3,
   Gosha every 10). Rather than open with nothing selected, the screen lands on
   the nearest option it does have — and the pick, once made, is written back to
   the plant, so the card that sent you here states what you just chose. */
const awNearest = (schedule)=>{
  const m = /(\d+)/.exec(schedule || "");
  if(!m) return AW_EVERY[1].k;
  const n = +m[1];
  return AW_EVERY.reduce((best,o)=>{
    const d = Math.abs((+/(\d+)/.exec(o.k)[1]) - n);
    return d < best.d ? {d, k:o.k} : best;
  }, {d:Infinity, k:AW_EVERY[1].k}).k;
};

/* Profile's message frequency (460:164) — the same {k, best} shape AW_EVERY and
   AW_AMOUNT carry, because it is drawn on the same option card. */
const PF_FREQ = [{k:"Quiet"}, {k:"Moderate", best:true}, {k:"Chatty"}];

/* Quiet hours, on the auto-watering screen's own design (447:131). Two labelled
   three-ups instead of one, for the same reason watering has two: the window is
   two independent picks that compose into one sentence, and "Every 2nd day at
   7am" and "silent from 10pm till 8am" are the same kind of sentence.
   The three fixed windows this used to offer inline (10pm–8am, 11pm–7am,
   9pm–7am) are all still reachable, and six more with them. */
const QT_FROM = [{k:"9pm"}, {k:"10pm", best:true}, {k:"11pm"}];
const QT_TO   = [{k:"7am"}, {k:"8am",  best:true}, {k:"9am"}];
/* PLANTS does not carry a window, and adding one to five rows to state the
   default twice over would be worse than defaulting here. */
const quietOf = (p)=>({ from: p.quietFrom || "10pm", to: p.quietTo || "8am" });
/* THE ADD PLANT DRAFT — the plant's own state before there is a plant to hang
   it on. It exists because the character screen can leave and come back:
   "Customise" opens the Quiet hours screen and returns, the screen remounts,
   and a name you had already typed would evaporate on the trip. So the screen
   reads its opening values from here and writes every change back, and the
   window lives here too — without it "Customise" in the flow would fall through
   plantById() and quietly rewrite Felix's evenings. Copied onto the real plant
   when the flow finishes, cleared when it starts. */
const AP_DRAFT = {};

/* ── the labelled three-up both settings screens are built from (447:131) ────
   One component, so "the same design" is not a promise two screens have to keep
   in step by hand — it is the same code, and the only difference between them
   is the words. */
function AwGroup({label, opts, value, onPick}){
  return <div className="awgroup">
    <div className="awlab">{label}</div>
    <div className="awopts">
      {opts.map(o=>(
        <div key={o.k} className={"awopt"+(value===o.k?" on":"")}
          onClick={()=>onPick(o.k)}>
          <b>{o.label || o.k}</b>
          {o.best && <small>best choice</small>}
        </div>
      ))}
    </div>
  </div>;
}

/* ── NO SAVE, on either screen ───────────────────────────────────────────────
   447:131 draws no button of any kind, and it is right not to: every choice
   here is a single tap on a card that lights up, so there is nothing to batch
   and nothing to confirm. Each pick writes straight through to the plant —
   PLANTS is this prototype's only store and both cards that send you here
   re-read it on mount — so Back is simply Back, and the card underneath is
   already stating what you just chose by the time you land on it. */
function WaterConfig({params}){
  const nav = useNav();
  const p = plantById((params&&params.id)||"felix");
  const [every,setEvery]   = useState(awNearest(p.schedule));
  const [amount,setAmount] = useState(p.amount);
  const pickEvery  = (k)=>{ p.schedule = k; setEvery(k); };

/* ═══════════ PERSONALITY & SETTINGS (Figma "concept2" 446:93) ═══════════
   Everything about one plant's character lives here, rebuilt off the mockup's
   four scroll states:

     440:330  at rest — the film runs to the top of the screen behind the title,
              its gradient resolves into the page at 662→750, and "Personality"
              already sits on the film at 596.
     438:96   part-scrolled, with the plant's reaction bubble at 163.
     441:425  deeper — the film is gone and 441:566's scrim holds the title off
              the settings sliding under it.
     441:497  deepest — settings alone under the pinned title.

   THREE LAYERS, and which layer a thing belongs to is the whole design:
     · the nav is pinned and never moves;
     · the scrim under it is a scroll state, absent while the film is there;
     · everything else — film, gradient, settings — is ONE scroller, because the
       brief has the film scrolling away rather than sitting behind the page the
       way the detail screen's does.

   The film is this screen's own: settings-vlad.mp4, 1340×1544, 5.04s, muted and
   looping. It is never scrubbed — it is a live plant, not a timeline. */

/* the stage, its resolve into the page, and the mockup's own overlap between
   the two (Frame 60 opens at 596 while the gradient runs to 750) */
const PS_STAGE = 662;
const PS_FADE  = 88;
const PS_LAP   = 84;    // stage 662 + the resolve's 18px overhang → content 596

/* ── HOW THE FILM SHRINKS ────────────────────────────────────────────────────
   The two states that show the film do NOT show it at the same size, and the
   difference is not decoration — it is the behaviour.

     440:330  at rest: film 744×856 at (−171,−194), stage visible 0…662
     438:96   scrolled ~200: film 402×462 at (0,0), stage visible 0…462

   Read as "the film covers whatever is left of the stage, times a zoom", both
   states fall out of one rule. Cover width for a visible stage of V is
   V × 0.86788; the rest state runs 744 / (662 × 0.86788) = 1.295× that, and the
   scrolled state runs 402 / (462 × 0.86788) = 1.002×, i.e. exactly cover. So
   the zoom eases from 1.295 to 1 over the first 200px of scroll, and the film
   is bottom-anchored throughout:

     at scroll 0    height 662 × 1.295 = 857 → top at −195   (mockup −194)
     at scroll 200  height 462 × 1     = 462 → top at 0      (mockup 0)

   Past that, cover would take the film NARROWER than the screen (below 445px of
   visible stage), so the width floors at the stage's own and the film simply
   crops from the top the rest of the way — which is what the two deep states
   show, a film already gone under a solid scrim.

   This is also what keeps the pinned title readable: at rest the serif sits
   above the canopy, and by the time scrolling would drag the canopy up into it
   the zoom has already pulled the whole plant down out of the way.

   The cover rule takes the FILM's aspect ratio as its input, and the settings
   films are not all one shape: Vlad's is 1340×1544 (0.86788), the other four
   are 1292×1604 (0.80549). So PS_AR is looked up per plant rather than fixed —
   pinning Vlad's ratio on everyone would stretch four films out of shape, which
   is the one thing "identical mechanics per plant" cannot mean. The arithmetic
   above is unchanged; only its one input moves. */
const PS_AR_BY_ID = { felix:1292/1604, mary:1292/1604, gosha:1292/1604,
                      vera: 1292/1604, vlad:1340/1544 };
const psAr        = (id)=> PS_AR_BY_ID[filmId(id)];
const PS_ZOOM     = 0.295;       // extra zoom over cover, at rest
const PS_ZOOM_END = 200;         // …spent by here
// the first paint — 744px on Vlad, 691px on the taller four
const psVidW0     = (ar)=> PS_STAGE * ar * (1 + PS_ZOOM);

/* The scrim's ramp, both ends read off the states rather than chosen.

   Each reference frame pins a scroll position. The film's own size dates
   438:96 at 200 (see PS_ZOOM), and the others date themselves by where their
   content sits against its resting 596: 441:425 opens at 177, i.e. 419, and
   441:497 opens on "General" at 213 against a resting 1019, i.e. 806.

   438:96 has NO scrim and nothing under the title yet; 441:425 has it solid and
   the film gone from under one. So the ramp is 200 → 419 — and it lands exactly
   where it has to, because the settings' own top edge (596) reaches the title's
   bottom (176) at 420. The scrim finishes arriving on the frame the content
   needs it. */
const PS_SCRIM_IN  = 200;
const PS_SCRIM_OUT = 419;

/* The chips' own side padding, and so the clearance a revealed chip keeps from
   the screen edge — one pad, the same gap it would have from a neighbour. */
const PS_CHIP_PAD = 24;

/* How far down the page the bubble still makes sense. The bubble is the PLANT
   talking, so it goes when there is no plant left under it: 410 is the scroll
   at which the film has left the bubble's own box (163 + 89). */
const PS_TALK_MAX = PS_STAGE - 163 - 89;          // 410

/* 440:373 — a gendered voice, not the timbre VOICES carries. The two are
   different questions and the onboarding tuner still asks the other one, so
   this list is local to this screen rather than a change to the shared set. */
const PS_VOICES = ["Male","Female","Prefer not to choose"];

/* ── THE PERSONALITY SECTION, ONE COMPONENT ─────────────────────────────────
   The chips row and the three sliders belong together, and two screens want
   them: Personality & Settings, where you tune a character you have already
   met, and the Add Plant flow, where you give it one. Rev 31 shipped the flow
   with chips only, on the reasoning that the sliders are a later-refinement
   affordance — the brief says otherwise, so rather than adding a second copy
   that can drift, the section became one component and both screens render it.

   The reveal lives here too, so "tapping a half-cut chip scrolls it fully into
   view" is one implementation rather than two. The row is 774px against a 386px
   screen; neither edge is special (the same two lines handle both) and 24px of
   clearance is the chips' own side padding, so a revealed chip sits exactly one
   pad from the edge rather than flush against it. Measured through
   getBoundingClientRect against the row, not offsetLeft: .pschips is not
   positioned, so offsetParent is the content column and offsetLeft would be
   measuring the wrong box. */
function PersonalitySection({preset, tune, onPick, onSlide, sec}){
  const chipRow = useRef(null);
  const reveal = (el)=>{
    const row = chipRow.current;
    if(!row || !el || !row.scrollTo) return;
    const r = el.getBoundingClientRect(), rr = row.getBoundingClientRect();
    const left  = row.scrollLeft + (r.left  - rr.left) - PS_CHIP_PAD;
    const right = row.scrollLeft + (r.right - rr.left) + PS_CHIP_PAD;
    let to = row.scrollLeft;
    if(right > to + row.clientWidth) to = right - row.clientWidth;
    if(left  < to)                   to = left;
    to = Math.max(0, Math.min(to, row.scrollWidth - row.clientWidth));
    if(Math.abs(to - row.scrollLeft) > 1) row.scrollTo({left:to, behavior:"smooth"});
  };
  return <div className={sec || "pssec"}>
    <h2 className="pssech">Personality</h2>
    <div className="pschips" ref={chipRow}>
      {PERSONALITIES.presets.map(x=>(
        <div key={x.k} className={"pschip"+(preset===x.k?" on":"")}
          onClick={ev=>{ onPick(x.k); reveal(ev.currentTarget); }}>{x.k}</div>
      ))}
    </div>
    <div className="pscard" style={{marginTop:"14px"}}>
      {PERSONALITIES.sliders.map(sl=>(
        <div className="psrow" key={sl.key}>
          <div className="pslab">{sl.label}
            <span>{wordFor(sl.words, tune[sl.key])}</span></div>
          <input type="range" className="psrange" min="0" max="100" step="1"
            value={tune[sl.key]} aria-label={sl.label}
            onChange={e=>onSlide(sl.key, Number(e.target.value))}
            style={{"--v": tune[sl.key] + "%"}}/>
        </div>
      ))}
    </div>
  </div>;
}

/* ── THE PERSONALITY & SETTINGS SHELL, ONE COMPONENT ───────────────────────
   Everything on that screen that is not a settings SECTION: the film stage and
   the cover rule that sizes it, the resolve, the scrim, the pinned nav and the
   plant's bubble — plus the single rAF-coalesced scroll read that drives all
   four. Personality & Settings renders its three sections into it; the Add
   Plant flow renders the one section that exists before a plant is yours. Two
   screens, one construction, and no copy of it to drift.

   One read per frame, written straight to the nodes — the scrim's opacity and
   the film's width both change on every frame of a flick, so neither belongs in
   state. `deep` is the one exception and earns it: it is a boolean, so it only
   re-renders on the frame it actually flips. */
/* ── THE ACTIVITY SECTION, ONE COMPONENT ────────────────────────────────────
   Messages, and the Quiet-hours card with its subtitle, its switch, its rule
   and its "Customise" — including the collapse to title + switch when the
   switch goes off, and the stated 50px basis that stops a container's own
   `> div` rule stretching it. Two screens render it: Personality & Settings,

   Its two switches are its own state. Nothing outside the section reads them,
   and pushing them up to two callers would be two copies of the same three

function ActivitySection({first, window:win, onCustomise, sec}){

      <b>Messages from {first}</b>
      <Toggle on={msgs} onClick={()=>setMsgs(m=>!m)}/>
    </div>
    <div className="psquiet">
      <div className="psqtop">
        <div className="psqtxt">
          <div className="psqt">Quiet hours</div>
          <div className={"psqmore"+(quiet?"":" off")}>
            <div className="psqsub">{first} stays silent from {win.from} till {win.to}</div>
          </div>
        </div>
        <Toggle on={quiet} onClick={()=>setQuiet(v=>!v)}/>
