/* ═════════════════ PLANT DETAIL (Figma "concept2" 417:1537) ═════════════════
   TWO LAYERS. The photo/video is a full-bleed background that never moves and
   runs edge to edge, behind the status bar included. Everything else — nav bar,
   species + mood chip, speech blob, timeline, info cards — lives in one scroller
   that rides over it, so scrolling climbs the cards up the photo to reveal the
   stats and the auto-watering toggle while the picture stays put.

   The stage is TWO REAL FILMS, not a poster (see FILM below). Timeline position
   maps linearly onto the growth film's currentTime, the right end being "now",
   and the swap between the two films is choreographed so that neither the cut
   nor the reframing is ever visible. */

/* the milestone labels, lowercase as the mockup sets them */
const TL = MILESTONES.map(m=>m.stage.toLowerCase());

/* ── THE TWO FILMS (Figma 437:93) ────────────────────────────────────────────
   still-vlad.mp4   the "now" state — a gentle idle loop of the grown plant,
                    running at the -184px framing. 976×2124, 5.04s.
   growth-vlad.mp4  the growth timeline, same size and length.

   The direction matters and the FILE, not the brief, settles it: growth-vlad's
   frame 0 is the fully grown bonsai (0.51/255 mean pixel difference from
   still-vlad's frame 0 — the same image), and its LAST frame is the seedling.
   The file is authored grown → sprout. So "now" is t=0 and scrubbing back in
   time runs FORWARD through the file: t = (1 - pos) * duration. Written the
   other way round it would grow as you scrubbed into the past, which is the one
   thing that must not happen.

   Vlad's films play for every plant. This screen is the prototype's sample
   plant detail whichever card opened it, and there is exactly one plant with
   footage; the map is the seam where per-plant films would land. */
const FILM = { still:"assets/video/still-vlad.mp4",
               growth:"assets/video/growth-vlad.mp4" };

/* the two stage framings, straight off the mockup's own "still 1" rects */
const PD_Y     = { still:-184, growth:0 };   // 428:1782 / 437:90
const PD_SLIDE = 420;   // the -184 ⇄ 0 glide; must match .pdvid-still's transition
const PD_FADE  = 180;   // the cross-fade that covers the swap

function PlantDetail({params}){
  const nav = useNav();
  const p = plantById((params&&params.id)||"vlad");
  const e = EMO[p.emotion] || EMO.neutral;
  const last = TL.length - 1;

  const [pos,setPos]   = useState(1);        // 0…1 along the timeline; 1 = "now"
  const [menu,setMenu] = useState(false);
  const [auto,setAuto] = useState(p.autoOn);

  /* ── THE STAGE ────────────────────────────────────────────────────────────
     Two films stacked in one box. `sy` is the still film's Y, handed to a CSS
     transition; `gOn` fades the growth film in over it. Nothing else about the
     stage is React state — the scrub itself runs on refs and rAF, because it
     has to keep up with a finger. */
  const [sy,setSy]   = useState(PD_Y.still);
  const [gOn,setGOn] = useState(false);

  const stillV = useRef(null);
  const growV  = useRef(null);
  const rail   = useRef(null);
  const raf    = useRef(0);
  const timers = useRef([]);
  const dur    = useRef(0);    // growth film's usable duration
  const want   = useRef(1);    // where the finger is, 0…1 (1 = now)
  const shown  = useRef(1);    // where the film is, eased toward `want`
  /* still → down → growth → fadeOut → up → still. `down` and `up` are the
     -184 ⇄ 0 glides, `fadeOut` is the cross-fade home. A ref, not state: the
     visible consequences are all in `sy`/`gOn` and re-rendering on every step
     of the machine would only fight the scrub. */
  const phase  = useRef("still");

  const after = (ms,fn)=>{ timers.current.push(setTimeout(fn,ms)); };
  const stopTimers = ()=>{ timers.current.forEach(clearTimeout); timers.current = []; };

  /* ── going back in time ───────────────────────────────────────────────────
     Order is everything. Glide the still film from -184 down to 0 FIRST, and
     only once it has landed cross-fade the growth film in on top of it: both
     films are at 0 at that moment and growth's t=0 is, pixel for pixel, the
     still film's image, so there is nothing left to flash or jump. */
  const toGrowth = ()=>{
    const ph = phase.current;
    if(ph === "growth" || ph === "down") return;
    stopTimers();
    if(ph === "fadeOut"){          // caught inside the cross-fade — just turn round
      phase.current = "growth"; setGOn(true);
      after(PD_FADE, ()=>{ const v = stillV.current; if(v) v.pause(); });
      kick(); return;
    }
    // from "still", or from "up" with the film part-way back up: same glide,
    // and the transition takes its full 420ms from wherever it stands
    phase.current = "down";
    setSy(PD_Y.growth);
    after(PD_SLIDE, ()=>{
      const g = growV.current;
      if(g){ try{ g.pause(); g.currentTime = 0; }catch(err){} }
      phase.current = "growth";
      setGOn(true);
      after(PD_FADE, ()=>{ const v = stillV.current; if(v) v.pause(); });
      kick();
    });
  };

  /* ── and coming home ──────────────────────────────────────────────────────
     The same three beats in reverse: the growth film has to have reached its
     "now" frame before it fades, and the still film only starts climbing back
     to -184 once it is the only thing on screen. */
  const toStill = ()=>{
    const ph = phase.current;
    if(ph === "still" || ph === "fadeOut" || ph === "up") return;
    stopTimers();
    if(ph === "down"){             // never got as far as the swap — just climb back
      phase.current = "up";
      setSy(PD_Y.still);
      after(PD_SLIDE, ()=>{ phase.current = "still"; });
      return;
    }
    phase.current = "fadeOut";
    const v = stillV.current;
    if(v){ const q = v.play(); if(q && q.catch) q.catch(()=>{}); }
    setGOn(false);
    after(PD_FADE, ()=>{
      phase.current = "up";
      setSy(PD_Y.still);
      after(PD_SLIDE, ()=>{ phase.current = "still"; });
    });
  };

  /* ── the scrub ────────────────────────────────────────────────────────────
     A pointermove fires far more often than a video can seek, so the handler
     only records where the finger is and one animation frame later the film is
     eased a fraction of the way there. The easing is not decoration: it is what
     lets `pos` answer the finger instantly while the film glides, and what lets
     the film sit at "now" through the whole hand-over and then rewind into
     place afterwards instead of jump-cutting to wherever the finger got to.

     `shown` is deliberately frozen unless the growth film is actually on
     screen. That is the guarantee that the cross-fade always happens with both
     films showing the same frame. */
  const tick = ()=>{
    raf.current = 0;
    if(phase.current !== "growth") return;
    const g = growV.current, d = dur.current;
    const diff = want.current - shown.current;
    shown.current = Math.abs(diff) > 0.0006 ? shown.current + diff*0.22 : want.current;
    if(g && d > 0){
      const t = (1 - shown.current) * d;      // now = t 0; back in time = forward
      if(Math.abs(g.currentTime - t) > 0.003){ try{ g.currentTime = t; }catch(err){} }
    }
    if(want.current >= 0.9994 && shown.current >= 0.9994){ shown.current = 1; toStill(); return; }
    if(shown.current !== want.current) raf.current = requestAnimationFrame(tick);
  };
  const kick = ()=>{ if(!raf.current) raf.current = requestAnimationFrame(tick); };

  const seek = (frac)=>{
    const f = Math.max(0, Math.min(1, frac));
    want.current = f;
    setPos(f);
    /* leaving "now" is what starts the whole sequence — a bare tap ON now does
       not, because nothing has been scrubbed yet */
    if(f < 0.9994) toGrowth();
    else if(phase.current === "down") toStill();
    kick();
  };

  // the growth film never plays; it is seeked. Park it on its "now" frame and
  // keep the last 40ms back, because seeking to the exact tail is unreliable.
  const onGrowMeta = ()=>{
    const g = growV.current; if(!g) return;
    const d = g.duration;
    dur.current = (isFinite(d) && d > 0) ? Math.max(0, d - 0.04) : 0;
    try{ g.pause(); g.currentTime = 0; }catch(err){}
  };

  useEffect(()=>{
    // muted is set imperatively as well as declaratively: it is the condition
    // for autoplay, and it has to be true before play() is called
    const v = stillV.current, g = growV.current;
    if(g) g.muted = true;
    if(v){ v.muted = true; const q = v.play(); if(q && q.catch) q.catch(()=>{}); }
    return ()=>{ stopTimers(); if(raf.current) cancelAnimationFrame(raf.current); };
  },[]);

  const fracFrom = (ev)=>{
    const el = rail.current; if(!el) return want.current;
    const r = el.getBoundingClientRect();
    return r.width ? (ev.clientX - r.left) / r.width : want.current;
  };
  const dragging = useRef(false);
  const down = (ev)=>{
    dragging.current = true;
    ev.currentTarget.setPointerCapture(ev.pointerId);
    seek(fracFrom(ev));
  };
  const move = (ev)=>{ if(dragging.current) seek(fracFrom(ev)); };
  const up   = ()=>{ dragging.current = false; };
  /* a horizontal trackpad gesture over the rail scrubs it; a vertical one is
     left alone, because the sheet under the timeline is a scroller now and
     hijacking its wheel would trap the page */
  const wheel = (ev)=>{
    if(Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) seek(want.current + ev.deltaX/1400);
  };

  const idx = Math.round(pos*last);
  /* The mockup shows two labels: the one you are standing on, and "now" as the
     right-hand anchor. Everything between is a dot — six words will not fit on a
     phone, and labelling only those two is what keeps the rail readable. */
  const labelled = (i)=> i===idx || i===last;
  const labelPos = (i)=> i===last ? {right:0} : i===0 ? {left:0}
                       : {left:((i/last)*100)+"%", transform:"translateX(-50%)"};

  return <div className="pdscreen" onClick={()=>menu&&setMenu(false)}>

    {/* 1 — THE STAGE: a full-bleed film background that never scrolls. It
        reaches up behind the status bar, so the bleed starts at the true top of
        the screen. Two films live here: the idle loop, which carries the Y
        animation, and the growth film above it, which only ever fades. */}
    <div className="pdbg">
      <video className="pdvid pdvid-still" ref={stillV} src={FILM.still}
        muted loop autoPlay playsInline preload="auto"
        style={{transform:"translate3d(0,"+sy+"px,0)"}}/>
      <video className="pdvid pdvid-grow" ref={growV} src={FILM.growth}
        muted playsInline preload="auto" onLoadedMetadata={onGrowMeta}
        style={{opacity:gOn?1:0}}/>
      <div className="pdscrimt"/>
      <div className="pdscrimb"/>
    </div>

    {/* 2 — everything else rides over the photo in one scroller */}
    <div className="pdscroll">

      {/* everything about this plant lives behind the ⋯ */}
      {menu && <div className="pdmenu" onClick={ev=>ev.stopPropagation()}>
        <div onClick={()=>{setMenu(false);nav.go("plantSettings",{id:p.id});}}>
          Personality &amp; Settings</div>
        <div onClick={()=>{setMenu(false);nav.go("waterConfig",{id:p.id});}}>
          Watering schedule</div>
      </div>}

      {/* the top block — nav bar, species + mood chip, speech blob. Pinned to
          221px so the spacer below it is one constant (see .pdtop). */}
      <div className="pdtop">
        <div className="plhead">
          <span className="plback" onClick={nav.back} title="Back"><IconChevronLeft/></span>
          <h1 className="pltitle">{p.name.split(" ")[0]}</h1>
          <span className="plmore" title="More"
            onClick={ev=>{ev.stopPropagation();setMenu(m=>!m);}}><IconMore/></span>
        </div>

        <div className="pdrow">
          <span className="pdsp">{p.species}</span>
          <span className="moodchip" style={{background:e.glow,
            filter:"drop-shadow(0 0 10px "+e.glow+")"}}>{e.word}</span>
        </div>

        {/* the plant's own words, in a white organic blob. No quote marks. */}
        <div className="pdbubwrap">
          <div className="pdbub" style={{backgroundImage:blobBg("speech","#FFFFFF")}}>
            {p.checkin}
          </div>
        </div>
      </div>

      {/* open photo — this is what the lower block is pushed down by */}
      <div className="pdspacer"/>

      <div className="pdlower">
        {/* 3 — the scrub: drag it, position maps linearly to currentTime */}
        <div className="pdtimeline" onPointerDown={down} onPointerMove={move}
          onPointerUp={up} onPointerCancel={up} onWheel={wheel}>
          <div className="pdtllab">
            {TL.map((label,i)=> labelled(i) &&
              <span key={label} style={labelPos(i)}>{label}</span>)}
          </div>
          <div className="pdtlrail" ref={rail}>
            <div className="pdtltrack"/>
            <div className="pdtlfill" style={{width:(pos*100).toFixed(2)+"%"}}/>
            {TL.map((label,i)=>(
              <span key={label} className={"pdtldot"+(i===idx?" on":"")}
                style={{left:((i/last)*100)+"%"}}/>
            ))}
          </div>
        </div>

        {/* 4 — the info cards, all in the canonical settings-card style. The
            bond card overlaps the bottom of the photo and the stat cards peek
            12px above the screen edge, which is the scroll affordance. */}
        <div className="pdcards">
          <div className="scard">

            <div className="pdbondmeta">

          <div className="pdstats">

            {/* the reservoir card fills itself to its own level */}
            <div className="pdstat">

              <div className="scard-l">Reservoir</div>

    ["Colour & texture","Surface colour, gloss and any variegation"],

    <Top title="Create their character" onBack={nav.back} kicker={`New plant · step 3 of 3 · ${species}`}/>

      {/* the pot wears the emotion that matches the line in the bubble above it */}
      <div className="pdpot" style={{width:188,height:146}}>

/* Language picker — a plain LIST of options, not full-width card tiles. */
const LANGS = ["English","Русский","Español","Deutsch"];

/* Pot renders — the five square 1024px sources from the mockup (364:1073/1075/
   1077/1097 and 415:1423), re-exported at 768px. Nothing is measured by hand
   here: `win` is each image frame's own box and `img` is the source's offset
   inside that frame, both read off Figma node 364:1065 and re-expressed against
   the card's TOP-RIGHT corner instead of the artboard's top-left. Anchoring on
   the right is what lets the 402px mockup land unchanged in a 386px device —
   every pot keeps its exact distance from the card edge, and the 16px difference
   is absorbed by the empty gap between the text column and the pot.
     mockup (card top / card right edge)      -> card-relative
     felix  frame 185,135 258x218  card 135/397   win right -46, top   0  img 258 @   0,-40
     margot frame 132,275 265x172  card 275/397   win right   0, top   0  img 363 @   0,-144
     gosha  frame 248,411 140x187  card 415/397   win right   9, top  -4  img 308 @ -88,-80
     vera   frame 173,555 224x227  card 555/397   win right   0, top   0  img 282 @   0,-79
     vlad   frame 184,651 267x267  card 695/397   win right -54, top -44  img 267 @   0,0
   Vera's frame now starts exactly on her card's top-left, so her render is fully
   clipped by the card like Felix/Margot/Gosha. Vlad is the one that breaks out —
   his frame starts 44px ABOVE his card and runs 54px past its right edge, and he
   is the last card, which is what .plcard:last-child{overflow:visible} unlocks. */
const SHOT = {
  felix:{ src:"assets/pot-felix.webp",  win:{w:258,h:218,right:-46,top:  0},
                                        img:{s:258,left:    0,top:-40  } },
  margo:{ src:"assets/pot-margot.webp", win:{w:265,h:172,right:  0,top:  0},
                                        img:{s:363,left:    0,top:-144 } },
  gosha:{ src:"assets/pot-gosha.webp",  win:{w:140,h:187,right:  9,top: -4},
                                        img:{s:308,left:-88.2,top:-80.2} },
  vera: { src:"assets/pot-vera.webp",   win:{w:224,h:227,right:  0,top:  0},
                                        img:{s:282,left: -0.1,top:-78.9} },
  vlad: { src:"assets/pot-vlad.webp",   win:{w:267,h:267,right:-54,top:-44},
                                        img:{s:267,left:    0,top:  0  } },
};
function PotShot({who}){
  const p = SHOT[who];
  if(!p) return null;
  const {win:w, img:i} = p;
  return <span className="plwin"
    style={{width:w.w, height:w.h, right:w.right, top:w.top}}>
    <img src={p.src} alt=""
      style={{width:i.s, height:i.s, left:i.left, top:i.top}}/>
  </span>;
}

/* Plants list — reached from the expanded hero's "See your plants" (and from
   Profile). An edge-to-edge stack: every plant is a full-width card in its
   character gradient, tucked over the bottom of the card above, with its pot
   render breaking out of the card and spilling onto the one below. Tapping a
   card opens that plant's detail screen. */
function PlantsList(){
  const nav = useNav();
  return <div className="screen">
    <div className="plhead">
      <span className="plback" onClick={nav.back} title="Back"><IconChevronLeft/></span>
      <h1 className="pltitle">My Plants</h1>
      <button className="pladd" onClick={()=>nav.go("pair")}>Add</button>
    </div>

    <div className="pstack">
      {PLANTS.map((it)=>{
        const e = EMO[it.emotion] || EMO.neutral;
        /* No z-index anywhere: every card clips its own render, so paint order
           is simply DOM order — each card tucks over the one above it, and
           within a card the chip/species/name follow the pot and so sit on top
           of it. The last card is the one exception and it paints last anyway. */
        return <div className="plcard" key={it.id}
          onClick={()=>nav.go("plant",{id:it.id})}>
          <div className="plsurface" style={{background:"var(--g-"+it.id+")"}}/>
          <PotShot who={it.id}/>
          <div className="plchip">{e.word}</div>
          {it.species !== it.name.split(" ")[0] &&
            <div className="plspecies">{it.species}</div>}
          <div className="plname">{it.name.split(" ")[0]}</div>
        </div>;
      })}
    </div>
  </div>;
}

/* ───────────────── APP STATE + ROUTER ───────────────── */
const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

const SCREENS = {
  dashboard:Dashboard, notifs:Notifications, profile:Profile, langPick:LangPick,
  plantsList:PlantsList,
  plant:PlantDetail, waterConfig:WaterConfig, plantSettings:PlantSettings,
  alert:Alert, diagnosis:Diagnosis, alertDone:AlertDone,
  pair:PairDevice, capture:CapturePhoto, matches:SpeciesMatches, species:SpeciesList,
  speciesDetail:SpeciesDetail, create:CreateCharacter, meeting:FirstMeeting,
};

/* Flow index — prototype-shell shortcut panel. Lives OUTSIDE the device.
   One entry per flow; `path` is the screen stack the shortcut builds, so an entry
   can land deep in a flow with Back still working. */
const FLOWS = [
  { label:"Add new plant",      path:[["pair"]] },
  { label:"Dashboard",          path:[["dashboard"]] },   // = hero + Windowsill chat
  { label:"Notifications",      path:[["notifs"]] },
  { label:"Plant card",         path:[["plant",{id:"vlad"}]] },   // Vlad: the films are his
  { label:"Alert simulation",   path:[["alert"]] },
  { label:"Profile & settings", path:[["profile"]] },
];
function FlowIndex({cur}){
  const nav = useNav();
  return <aside className="flowindex">
    {FLOWS.map(({label,path})=>{
      const dest = path[path.length-1][0];
      return <div key={label}
        className={"fi-link"+(cur.screen===dest?" on":"")}
        onClick={()=>nav.jump(path)}>{label}</div>;
    })}
  </aside>;
}

function App(){
  const [stack,setStack] = useState([{screen:"dashboard",params:{}}]);
  const [chatCross,setChatCross] = useState(true);
  const [freq,setFreq]           = useState("Moderate");
  const [uiLang,setUiLang]       = useState("English");
  const [convLang,setConvLang]   = useState("English");

  const cur = stack[stack.length-1];
  const nav = useMemo(()=>({
    go:(screen,params={})=> setStack(s=> screen==="dashboard"
      ? [{screen:"dashboard",params}]         // dashboard is the root — reset the stack
      : [...s,{screen,params}]),
    back:()=>setStack(s=>s.length>1?s.slice(0,-1):s),
    // pop back to a named screen — used by "keep looking" after hopping through
    // several look-alike species; falls back to a single step if it isn't in the stack
    backTo:(screen)=>setStack(s=>{
      const i = s.map(x=>x.screen).lastIndexOf(screen);
      return i>=0 ? s.slice(0,i+1) : (s.length>1?s.slice(0,-1):s);
    }),
    // replace the whole stack — lets the flow index land deep in a flow with Back intact
    jump:(path)=> setStack(path.map(([screen,params])=>({screen,params:params||{}}))),
  }),[]);

  const Screen = SCREENS[cur.screen] || Dashboard;

  return (
    <AppCtx.Provider value={{chatCross,setChatCross,freq,setFreq,
      uiLang,setUiLang,convLang,setConvLang}}>
    <Nav.Provider value={nav}>
      <div className="phone">
        <div className="device">
          <div className="island"/>
          <StatusBar/>
          <Screen params={cur.params} key={cur.screen+stack.length}/>
        </div>
      </div>
      <FlowIndex cur={cur}/>
    </Nav.Provider>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- Bootstrap: manual Babel transform, classic runtime, no ES modules -->
<script>
(function () {
  function fail(msg) {
    document.getElementById("root").innerHTML =
      '<div style="max-width:360px;margin:80px auto;font-family:\'Circular Std\',sans-serif;color:#333;text-align:center">'
      + '<h2>Could not start the prototype</h2><p style="color:#777">' + msg + '</p></div>';
  }
  if (!window.React || !window.ReactDOM || !window.Babel) {
    return fail("React / Babel failed to load from the CDN. An internet connection is needed the first time you open this file.");
  }
  try {
    var src = document.getElementById("app-src").textContent;
    // classic runtime => React.createElement, never `import {jsx} from 'react/jsx-runtime'`
    var out = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]]
    }).code;
    (0, eval)(out); // indirect eval => run in global scope
  } catch (e) {
    fail(String(e && e.message || e));
    throw e;
  }
})();
</script>
